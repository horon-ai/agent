name: Publish npm packages

# Turns one release's archives into the seven npm packages of `@horon-ai/horon`
# and publishes them with npm trusted publishing. Three paths reach this file,
# and only one of them can publish:
#
#   * `workflow_run` after "Release Tag" finishes on `main`: the normal path,
#     taken once a tag exists for the commit that Release Tag just released.
#   * `workflow_dispatch`: an operator names a public release tag or a
#     `package_only` Release workflow run. It defaults to a dry run, and npm
#     trusted publishing only trusts the top-level workflow file name, which is
#     why nothing here is `workflow_call`ed.
#   * `pull_request`: the fixture path. It packages fake archives and runs the
#     same `npm publish --dry-run` loop, so the workflow is exercised before it
#     reaches `main`. It never publishes: the packaging version `0.0.1` is a
#     fixture and the registry is compared before and after.
#
# The real publish stays off until the owner sets the repository variable
# `NPM_PUBLISH` to `true` and registers this workflow as each package's trusted
# publisher. Without that variable every path is a dry run.

env:
  # `actions/checkout` runs `git init` on a fresh runner and git prints a hint
  # about the default branch name. Naming it removes the cause of the message.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

on:
  workflow_run:
    # Release Tag itself starts from CI's `workflow_run`, so the run that ends
    # here carries `event == 'workflow_run'`, never `push`.
    workflows: ["Release Tag"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public release tag whose archives to package (e.g. v0.1.3)
        required: false
        type: string
      run_id:
        description: Id of a Release workflow run with package_only=true (dry run only)
        required: false
        type: string
      version:
        description: Version for the run_id path; derived from the tag otherwise
        required: false
        type: string
      dry_run:
        description: Package and publish with --dry-run instead of to npm
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - 'npm/**'
      - 'scripts/npm/**'
      - '.github/workflows/publish-npm.yml'

permissions:
  contents: read

# A second run would race the first for the same version and could publish a
# platform package the other one just published. Queue instead of cancelling:
# the later run re-checks the registry and skips what already landed.
concurrency:
  group: publish-npm-horon
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve source, version and mode
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The automatic path reads the finishing run's jobs to tell a release that
      # produced no tag from a normal main run that produced nothing to publish.
      actions: read
    outputs:
      source: ${{ steps.source.outputs.source }}
      version: ${{ steps.source.outputs.version }}
      mode: ${{ steps.source.outputs.mode }}
      tag: ${{ steps.source.outputs.tag }}
      run_id: ${{ steps.source.outputs.run_id }}
      ref: ${{ steps.source.outputs.ref }}
      skip: ${{ steps.source.outputs.skip }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve the source, version and mode
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          RUN_ID_INPUT: ${{ inputs.run_id }}
          VERSION_INPUT: ${{ inputs.version }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: |
          set -euo pipefail
          emit() {
            printf '%s=%s\n' "$1" "$2" >>"$GITHUB_OUTPUT"
          }
          source=""
          version=""
          tag=""
          run_id=""
          ref="$HEAD_SHA"
          [ -n "$ref" ] || ref="$GITHUB_SHA"
          mode="dry-run"

          if [ "$EVENT" = "pull_request" ]; then
            source="fixture"
            version="$(python3 scripts/npm/release_npm_version.py fixture-version)"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # The helper validates the inputs and prints source/version/mode,
            # so the same rules the unit test covers run here before anything
            # is downloaded or published.
            plan=()
            if [ -n "$(printf '%s' "$RELEASE_TAG_INPUT" | tr -d '[:space:]')" ]; then
              plan+=(--release-tag "$RELEASE_TAG_INPUT")
            fi
            if [ -n "$(printf '%s' "$RUN_ID_INPUT" | tr -d '[:space:]')" ]; then
              plan+=(--run-id "$RUN_ID_INPUT" --version "$VERSION_INPUT")
            fi
            if [ "${DRY_RUN_INPUT,,}" = "false" ]; then
              plan+=(--dry-run false)
            fi
            # Command substitution, not process substitution: a rejected input
            # must fail the step here instead of leaving empty values.
            planned="$(python3 scripts/npm/release_npm_version.py dispatch ${plan[@]+"${plan[@]}"})"
            while IFS='=' read -r key value; do
              case "$key" in
                source) source="$value" ;;
                version) version="$value" ;;
                mode) mode="$value" ;;
              esac
            done <<<"$planned"
            if [ "$source" = "release_tag" ]; then
              tag="$RELEASE_TAG_INPUT"
              ref="refs/tags/$RELEASE_TAG_INPUT"
            else
              run_id="$RUN_ID_INPUT"
            fi
          else
            # Automatic path. Only a run of this repository, on `main`, started
            # by another workflow and successful can mean "something released".
            if [ "$TRIGGER_CONCLUSION" != "success" ] || [ "$TRIGGER_BRANCH" != "main" ] \
              || [ "$TRIGGER_EVENT" != "workflow_run" ] \
              || [ "$GITHUB_REPOSITORY" != "horon-ai/agent" ]; then
              echo "::notice::Not a successful Release Tag run on main of horon-ai/agent; nothing to publish."
              emit skip true
              exit 0
            fi
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" --paginate \
              --jq ".[] | select(.object.sha == \"$HEAD_SHA\") | .ref" | sed 's#^refs/tags/##' | head -n 1)"
            if [ -n "$tag" ]; then
              if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "false" ]; then
                echo "::notice::$tag has no public release yet; publishing the next run will pick it up."
                emit skip true
                exit 0
              fi
              source="release_tag"
              version="$(python3 scripts/npm/release_npm_version.py tag-version "$tag")"
              ref="refs/tags/$tag"
              # The automatic path is the normal release: it publishes unless
              # the owner's master switch says otherwise (checked below).
              mode="publish"
            else
              succeeded="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}/jobs" --paginate \
                --jq '[.jobs[] | select(.name | startswith("Release / ")) | select(.conclusion == "success")] | length')"
              if [ "$succeeded" != "0" ]; then
                echo "::error::Release Tag released ${HEAD_SHA} but no tag points at it; nothing was published to npm."
                exit 1
              fi
              echo "::notice::Release Tag ran on ${HEAD_SHA} without creating a tag (no release); nothing to publish."
              emit skip true
              exit 0
            fi
          fi

          # The variable is the owner's master switch and the pull-request path
          # can never publish, so a dispatch with dry_run=false stays a dry run
          # until both are true.
          if [ "$mode" = "publish" ]; then
            if [ "$NPM_PUBLISH" != "true" ] || [ "$EVENT" = "pull_request" ]; then
              echo "::notice::NPM_PUBLISH is not 'true'; running the publish path as a dry run."
              mode="dry-run"
            fi
          fi

          emit skip false
          emit source "$source"
          emit version "$version"
          emit mode "$mode"
          emit tag "$tag"
          emit run_id "$run_id"
          emit ref "$ref"
          echo "source=${source} version=${version} mode=${mode}"

  dry-run:
    name: Package and dry-run publish
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' && needs.plan.outputs.mode == 'dry-run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      # A `run_id` dry run downloads that run's artifacts.
      actions: read
    env:
      SOURCE: ${{ needs.plan.outputs.source }}
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RUN_ID: ${{ needs.plan.outputs.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check npm version
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm $version"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $version cannot sign provenance (11.5.1 or newer is required)."
            exit 1
          fi

      - name: Generate fixture assets
        if: env.SOURCE == 'fixture'
        shell: bash
        run: |
          set -euo pipefail
          # The same archive names and the same four shapes the release
          # produces, so the packaging script's member and digest checks run for
          # real. Nothing here is downloaded or executed.
          mkdir -p assets
          for suffix in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64 windows-aarch64; do
            for stem in horon-agent horon-tui; do
              dir="$(mktemp -d)"
              artifact="$stem-$suffix"
              case "$suffix" in
                linux-x86_64)
                  printf '#!/bin/sh\necho "%s %s (fixture)"\n' "$stem" "$VERSION" >"$dir/$artifact.bin"
                  # Written with an escaped `$`, so the wrapper expands it when
                  # it runs rather than while it is generated.
                  printf '%s\n' '#!/bin/sh' \
                    "exec \"\$(dirname \"\$0\")/$artifact.bin\" \"\$@\"" >"$dir/$artifact"
                  chmod +x "$dir/$artifact" "$dir/$artifact.bin"
                  tar -czf "assets/$artifact.tar.gz" -C "$dir" "$artifact" "$artifact.bin"
                  ;;
                windows-*)
                  printf 'fixture %s %s\r\n' "$stem" "$VERSION" >"$dir/$artifact.exe"
                  tar -czf "assets/$artifact.tar.gz" -C "$dir" "$artifact.exe"
                  ;;
                *)
                  printf '#!/bin/sh\necho "%s %s (fixture)"\n' "$stem" "$VERSION" >"$dir/$artifact"
                  chmod +x "$dir/$artifact"
                  tar -czf "assets/$artifact.tar.gz" -C "$dir" "$artifact"
                  ;;
              esac
              rm -rf "$dir"
            done
          done
          (cd assets && sha256sum ./*.tar.gz | sed 's#\./##' >SHA256SUMS)
          echo "generated 12 fixture archives at version $VERSION"

      - name: Download release assets
        if: env.SOURCE != 'fixture'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          case "$SOURCE" in
            release_tag)
              gh release download "$RELEASE_TAG" --dir assets \
                --pattern 'horon-agent-*.tar.gz' \
                --pattern 'horon-tui-*.tar.gz' \
                --pattern 'SHA256SUMS'
              echo "assets: public release $RELEASE_TAG, with its own SHA256SUMS"
              ;;
            run_id)
              # A package_only run skips the job that writes SHA256SUMS, so the
              # checksums are generated here from the tarballs that run uploaded.
              mkdir -p downloads
              gh run download "$RUN_ID" --dir downloads
              find downloads -name '*.tar.gz' -type f ! -name 'windows-unsigned-*' -exec mv {} assets/ \;
              (cd assets && sha256sum ./*.tar.gz | sed 's#\./##' >SHA256SUMS)
              echo "assets: workflow artifact, run $RUN_ID, SHA256SUMS generated here"
              ;;
          esac
          ls -l assets

      - name: Check the release assets
        shell: bash
        run: python3 scripts/npm/release_npm_version.py missing-assets assets

      - name: Prepare the seven packages
        shell: bash
        run: bash scripts/npm/prepare_cli_packages.sh packages assets "$VERSION"

      - name: Check the seven packages agree
        shell: bash
        run: python3 scripts/npm/release_npm_version.py check-packages packages "$VERSION"

      - name: Dry-run the publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-pack"
          # Recorded so the evidence can show the registry did not change.
          before="$(npm view @horon-ai/horon versions --json || echo '[]')"
          mapfile -t dirs < <(python3 scripts/npm/release_npm_version.py publish-order)
          for dir in "${dirs[@]}"; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            packed="$(cd "packages/$dir" && npm pack --pack-destination "$RUNNER_TEMP/npm-pack")"
            tarball="$(printf '%s\n' "$packed" | tail -n 1)"
            echo "::group::$name@$version"
            # Platform packages first, the wrapper last: the wrapper's optional
            # dependencies resolve by name, so a wrapper published early would
            # install a package that does not exist yet.
            npm publish "$RUNNER_TEMP/npm-pack/$tarball" --access public --provenance --dry-run
            echo "::endgroup::"
          done
          after="$(npm view @horon-ai/horon versions --json || echo '[]')"
          if [ "$before" != "$after" ]; then
            echo "::error::a dry run changed the registry: before=[$before] after=[$after]"
            exit 1
          fi
          echo "registry unchanged: $after"

  publish:
    name: Publish to npm
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' && needs.plan.outputs.mode == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      # npm trusted publishing and the provenance signature use short-lived
      # GitHub OIDC credentials. Only this job can really publish, so only this
      # job may request them.
      id-token: write
    env:
      SOURCE: ${{ needs.plan.outputs.source }}
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RUN_ID: ${{ needs.plan.outputs.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check npm version
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm $version"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $version cannot sign provenance or use trusted publishing (11.5.1 or newer is required)."
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::This job received no OIDC token, so npm trusted publishing cannot authenticate."
            exit 1
          fi

      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          case "$SOURCE" in
            release_tag)
              gh release download "$RELEASE_TAG" --dir assets \
                --pattern 'horon-agent-*.tar.gz' \
                --pattern 'horon-tui-*.tar.gz' \
                --pattern 'SHA256SUMS'
              echo "assets: public release $RELEASE_TAG, with its own SHA256SUMS"
              ;;
            *)
              echo "::error::a $SOURCE dispatch cannot publish; only a release tag can"
              exit 1
              ;;
          esac
          ls -l assets

      - name: Check the release assets
        shell: bash
        run: python3 scripts/npm/release_npm_version.py missing-assets assets

      - name: Prepare the seven packages
        shell: bash
        run: bash scripts/npm/prepare_cli_packages.sh packages assets "$VERSION"

      - name: Check the seven packages agree
        shell: bash
        run: python3 scripts/npm/release_npm_version.py check-packages packages "$VERSION"

      - name: Publish the seven packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-pack"
          mapfile -t dirs < <(python3 scripts/npm/release_npm_version.py publish-order)
          for dir in "${dirs[@]}"; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            # A rerun must finish the set, not fail on the packages the first
            # run already published.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on the registry; skipping"
              continue
            fi
            packed="$(cd "packages/$dir" && npm pack --pack-destination "$RUNNER_TEMP/npm-pack")"
            tarball="$(printf '%s\n' "$packed" | tail -n 1)"
            echo "::group::$name@$version"
            npm publish "$RUNNER_TEMP/npm-pack/$tarball" --access public --provenance
            echo "::endgroup::"
          done

      - name: Verify the registry
        shell: bash
        run: |
          set -euo pipefail
          # npm answers 404 for a few minutes after a publish, so poll for up to
          # ten minutes before calling the release incomplete.
          mapfile -t dirs < <(python3 scripts/npm/release_npm_version.py publish-order)
          for dir in "${dirs[@]}"; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            published=""
            for attempt in $(seq 1 40); do
              if published="$(npm view "$name@$version" version 2>/dev/null)" && [ -n "$published" ]; then
                break
              fi
              published=""
              echo "$name@$version is not visible yet ($attempt/40); retrying in 15s"
              sleep 15
            done
            if [ -z "$published" ]; then
              echo "::error::$name@$version did not appear on the registry within ten minutes"
              exit 1
            fi
            echo "$name@$published"
          done
          npm view "@horon-ai/horon@$VERSION" optionalDependencies
