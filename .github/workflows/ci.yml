      - name: Run prompt surface cohort
        shell: bash
        # The static system prompt and the tool catalog are the cached prefix of
        # every request, and the tests that pin them compiled in every run
        # without a step naming their modules. `agent::tests::
        # prompt_request_bytes` prints the `prompt` line the structural gate
        # reads (static bytes, digest, index bytes, source-file probes) and
        # asserts that an unchanged request rebuilds a byte-identical prefix;
        # `agent::tests::prompt_prefix_stability` pins that prefix across tool
        # round trips and checks that an edited prompt file reaches a running
        # session only at its next boundary; `agent::tests::tool_request_bytes`
        # prints the `prefix` line and `agent::tests::tool_schema_shape` pins
        # the eager schemas without their descriptions.
        # `agent::tests::tool_tiers` and `agent::tests::deferred_tools` cover which
        # tools a profile sends eagerly, lists or defers, `agent::prompting::
        # tests` and `tool::toolbox_tests` cover the listed-tools index and the
        # tool that reaches it, `startup_profile` covers the opt-in serve stage
        # report, `prompt::prompt_tests` in `horon-agent-base` covers the
        # prompt assembly and its source files, and `prompt::
        # session_context_tests` there prints the `session_context` line the
        # structural gate reads (the `git` and GPU-probe child processes a
        # session context starts). libtest accepts one filter per run, so each
        # module has its own call, and each must report at least one pass so a
        # renamed module fails the step instead of passing empty. Every call
        # runs even after one fails, and the step fails at the end, so one red
        # module cannot hide the ones listed after it.
        run: |
          set +e
          failed=0
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- agent::tests::prompt_request_bytes --nocapture
          failed=$((failed | $?))
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- agent::tests::tool_request_bytes --nocapture
          failed=$((failed | $?))
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- agent::tests::tool_tiers --nocapture
          failed=$((failed | $?))
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- agent::tests::deferred_tools --nocapture
          failed=$((failed | $?))
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- agent::prompting::tests --nocapture
          failed=$((failed | $?))
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- tool::toolbox_tests --nocapture
          failed=$((failed | $?))
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- startup_profile --nocapture
          failed=$((failed | $?))
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- prompt::prompt_tests --nocapture
          failed=$((failed | $?))
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- prompt::session_context_tests --nocapture
          failed=$((failed | $?))
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- agent::tests::prompt_prefix_stability --nocapture
