name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  # A push run on the commit a release tag will point at is the evidence
  # `scripts/release/check_ci.py` requires; after a cancelled or flaky run, re-run
  # that push run so the retry keeps the same commit and event. A manual dispatch
  # runs the same gates on any ref for diagnosis, but it is never accepted as that
  # evidence.
  workflow_dispatch:
    inputs:
      tui_smoke_repeats:
        description: Consecutive Linux TUI PTY smoke iterations for flake verification (1 on normal runs)
        required: false
        default: "1"
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer run on the same ref cancels the older one everywhere except `main`: a
  # push run on `main` is release evidence, so a running one is never cancelled
  # (GitHub can still replace a run that is only pending with a newer one). On
  # `dev` a push and a manual dispatch share the group and cancel each other; a
  # cancelled `dev` push run is recovered with `Re-run all jobs` on that run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only for every job here: the workflow builds, tests, and uploads
# artifacts, and never writes to the repository. Jobs that need more grant it
# themselves.
permissions:
  contents: read

env:
  # `actions/checkout` runs `git init` on a fresh runner and git prints a hint
  # about the default branch name. Naming it removes the cause of the message.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  HORON_AGENT_CI: "1"
  # CI builds without the local parallel-frontend rustc wrapper from
  # .cargo/config.toml (a POSIX shell script; see scripts/dev/rustc_parallel_frontend).
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  # Registry and toolchain downloads are the usual source of a one-off red run.
  # Cargo and rustup retry them on their own when asked to.
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # A rustc or build-script warning in a workspace crate fails the build. CI must
  # show zero warnings (AGENTS.md, "CI warnings"); this keeps a new one from
  # merging. Warnings in registry dependencies are never reported by cargo.
  CARGO_BUILD_WARNINGS: deny
  # Test and dev builds do not need debug info, and on a hosted runner every byte
  # is disk. The workspace profiles already set debug = 0; these make that hold
  # for member crates that might override the profile.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Decides which gates a change needs. A pull request is compared with its
  # base; a first-attempt push to `dev` with the head of the last successful
  # `dev` push run of this workflow (needs `actions: read`). A push to `main`, a
  # dispatch, a re-run of a `dev` push, a head already in `origin/main` and every
  # lookup or diff failure run everything: the release gate accepts only a fully
  # successful push run (scripts/release/check_ci.py).
  changes:
    name: Changed Paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      rust: ${{ steps.classify.outputs.rust }}
      docs_site: ${{ steps.classify.outputs.docs_site }}
      ts_sdk: ${{ steps.classify.outputs.ts_sdk }}
      py_sdk: ${{ steps.classify.outputs.py_sdk }}
      npm_pkg: ${{ steps.classify.outputs.npm_pkg }}
      install_scripts: ${{ steps.classify.outputs.install_scripts }}
      release_scripts: ${{ steps.classify.outputs.release_scripts }}
      workflows: ${{ steps.classify.outputs.workflows }}
      tui_only: ${{ steps.classify.outputs.tui_only }}
      tui_smoke: ${{ steps.classify.outputs.tui_smoke }}
      platform_windows: ${{ steps.classify.outputs.platform_windows }}
      platform_macos: ${{ steps.classify.outputs.platform_macos }}
      full_matrix: ${{ steps.classify.outputs.full_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The three-dot diff needs the merge base, which a shallow clone lacks.
          fetch-depth: 0

      - name: Classifier contract test
        run: python3 -m unittest -v scripts/ci/test_classify_changes.py

      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/ci/classify_changes.py --workflow ci.yml --base "$BASE_SHA" --head "$HEAD_SHA"
  quality:
    name: Quality Guardrails
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts_sdk == 'true' || needs.changes.outputs.py_sdk == 'true' || needs.changes.outputs.npm_pkg == 'true' }}
    # The issue-reference gate lists this repository's issues to prove the
    # numbers in `.github/` and `scripts/` open. Reading them needs the token
    # scopes below; every other step in this job only reads the checkout.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Match rust-toolchain.toml for clippy/rustfmt parity while overriding nested
      # dependency rust-toolchain.toml files (e.g. convert_case 1.83.0) without
      # installing a second `stable` (1.100.0) toolchain.
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      # Run after checkout because the cleanup lives in the repository now: the
      # shared script is not on disk until the workspace exists. It renames the
      # unused toolchains and returns before the deletion, which continues in
      # the background while the toolchain installs (#21).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Free disk space
        # A hosted ubuntu runner has about 14 GB free on `/`, and a cold
        # all-targets/all-features build does not fit. The pre-installed
        # toolchains are unused here.
        if: ${{ !cancelled() && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: bash scripts/ci/free_disk_space.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.run_attempt == '1' }}
          cache-on-failure: "false"
          key: quality-${{ runner.os }}-1.99.1
          cache-all-crates: "true"

      - name: Check module declarations resolve
        # A `mod x;` with no file makes rustfmt fail with "Error writing files:
        # failed to resolve mod", which reads like a formatting problem and hides
        # every gate behind it. Naming the real cause first (221159294).
        run: python3 scripts/ci/check_module_files.py

      - name: Check English/Korean documentation pairs
        # Every README and docs/ page has an English X.md and a Korean X.ko.md
        # with the same structure, valid relative links and a language switch.
        # Python standard library only; takes well under a second.
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check_docs_pairs.py

      - name: Check formatting
        # These gates are independent. Report every failure in one run instead
        # of letting a Clippy error hide stale lockfiles or budget violations.
        # No continue-on-error: any failed check still fails the quality job.
        if: ${{ !cancelled() }}
        run: bash scripts/ci/check_format.sh

      - name: Run clippy with warnings denied
        # Clippy compiles every target and feature that `cargo check` would, so
        # this single step covers both and halves the all-features artifacts a
        # hosted runner has to hold.
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run clippy on workspace targets
        # Bare `cargo clippy` above selects only the root package, so member
        # crates' test, bench, and example targets (along with standalone
        # members like `horon-tui`, `horon-agent-extension-sdk`, and
        # `horon-package-example`) are not linted there. Running `--workspace
        # --all-targets` with default features covers every member target while
        # keeping the terminal stack out of the root `--all-features` build.
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run the author SDK issue verification commands
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: |
          HORON_HOME="$(mktemp -d)"
          export HORON_HOME
          trap 'rm -rf "$HORON_HOME"' EXIT
          cargo test --locked -p horon-agent-extension-sdk

      - name: Enforce Cargo.lock is up to date
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        # Adding a dependency without regenerating Cargo.lock breaks every
        # `--locked` build. Only the Windows jobs pass `--locked`, so such a
        # commit passes 8 of 9 CI jobs and fails Windows at "Build release
        # binary", skipping all of its validation steps. This catches it in
        # seconds, on the job that already owns dependency hygiene.
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          git diff --exit-code -- Cargo.lock

      - name: Warning budget gate contract tests
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: scripts/ci/test_check_warnings.sh

      - name: Benchmark script gate
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 -m unittest -v scripts/perf/test_bench.py scripts/perf/test_ab_perf.py scripts/perf/test_analyze_memory_log.py scripts/perf/test_bench_suites.py scripts/perf/test_mock_llm_server.py scripts/perf/test_bench_compare.py scripts/perf/test_install_competitors.py scripts/perf/test_bench_docs.py scripts/perf/test_record_charts.py scripts/perf/test_bench_tui.py scripts/perf/test_bench_common_platform.py scripts/perf/test_check_soak.py scripts/perf/test_bench_tools_cpu.py scripts/perf/test_bench_report.py scripts/perf/test_package_workloads.py

      - name: npm CLI package gate
        # The npm distribution is generated, so its shape is only real when
        # something builds it: the script assembles the six platform packages
        # from fake archives, one per archive shape (linux wrapper + payload,
        # single-file, Windows .exe), and the launcher test covers argument and
        # environment hand-off plus the two failure messages. Node ships with
        # the hosted runner image; no setup step is needed for one test file.
        #
        # The TypeScript SDK is released at the same tag version as the CLI, so
        # its committed version and six runtime pins must equal the root
        # Cargo.toml version. The publish workflow stamps the tag version into
        # its checkout; this is the check that keeps the tracked file honest.
        #
        # The seven npm names also need a `0.0.0` placeholder before a Trusted
        # Publisher can be registered, and the maintainer publishes those by
        # hand. That placeholder is generated here and packed, because the
        # tarball a first publish would upload is exactly what this prints: one
        # manifest and one README, no payload that could shadow a release.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bash scripts/npm/test_prepare_cli_packages.sh
          node --test packages/npm/horon/test/launcher.test.mjs
          python3 -m unittest -v scripts/npm/test_release_npm_version.py
          python3 -m unittest -v scripts/sdk/test_sdk_release.py
          python3 -m unittest -v scripts/sdk/test_python_platform_wheel.py
          python3 -m unittest -v scripts/test/test_tui_pty_smoke.py
          python3 scripts/sdk/sdk_release.py check-committed
          placeholders="$(mktemp -d)"
          bash scripts/npm/prepare_placeholders.sh "$placeholders" >/dev/null
          for dir in "$placeholders"/*/; do
            name="$(node -p 'require(process.argv[1]).name' "$dir/package.json")"
            packed="$(cd "$dir" && npm pack --dry-run --json)"
            node -e '
              const name = process.argv[1];
              const packed = JSON.parse(process.argv[2]);
              const files = packed[0].files.map((file) => file.path).sort();
              const expected = ["README.md", "package.json"];
              if (JSON.stringify(files) !== JSON.stringify(expected)) {
                throw new Error(name + " placeholder packs " + JSON.stringify(files));
              }
              console.log(name + ": npm pack --dry-run packs " + files.join(" "));
            ' "$name" "$packed"
          done
          rm -rf "$placeholders"

      # A comment that cites a number nobody can open costs the reader a dead
      # end and hides whether the reasoning or the number was lost. Eleven such
      # references had accumulated in `.github/` and `scripts/`.
      - name: Issue references resolve
        if: ${{ !cancelled() }}
        env:
          # `gh` refuses to run in a workflow without it, and the check must fail
          # loudly rather than report "skipped" for a missing token.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest -v scripts/ci/test_check_issue_refs.py
          python3 scripts/ci/check_issue_refs.py

      - name: Enforce warning budget
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: scripts/ci/check_warnings.sh

      - name: Enforce oversized-file ratchet
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 scripts/ci/check_code_size.py

      - name: Enforce oversized-test ratchet
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 scripts/ci/check_test_size.py

      - name: Enforce panic-prone usage ratchet
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 scripts/ci/check_panics.py

      - name: Enforce swallowed-error usage ratchet
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 scripts/ci/check_swallowed_errors.py

      - name: Growth ratchet contract tests
        # The gate discovers its own ceiling files by shape, so a new ratchet
        # (the `Result<_, String>` count of #156, model names) needs no step
        # here. These tests are what keeps that discovery honest.
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 -m unittest -v scripts/ci/test_check_growth_ratchets.py

      - name: Enforce growth ratchets
        # Cargo.lock package count and internal legacy markers: both may fall
        # but not rise. Ceilings live in `scripts/ci/*.json` objects that
        # declare `counter` and `ceiling`; adding one needs no edit here.
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 scripts/ci/check_growth_ratchets.py

      - name: Enforce crate dependency boundaries
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 scripts/ci/check_dependency_boundaries.py

      - name: Enforce headless dependency graph
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 scripts/ci/check_headless_graph.py

      - name: Headless graph gate contract tests
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 -m unittest -v scripts/ci/test_check_headless_graph.py

      - name: Keep the author SDK out of the agent binary
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        # `horon-agent-extension-sdk` and its example are workspace members so
        # `-p` builds reach them; they are never dependencies of `horon-agent`.
        # `cargo tree -i` names a package the graph does not hold instead of
        # printing an empty tree, so the absence itself is asserted here.
        run: |
          set -euo pipefail
          for package in horon-agent-extension-sdk horon-package-example; do
            if tree="$(cargo tree --locked -p horon-agent -e normal,build,dev -i "$package" 2>&1)"; then
              echo "::error::$package reached the horon-agent graph"
              echo "$tree"
              exit 1
            fi
            case "$tree" in
              *"did not match any packages"*) ;;
              *)
                echo "::error::cargo tree could not decide for $package"
                echo "$tree"
                exit 1
                ;;
            esac
          done
          sdk="$(cargo tree --locked -p horon-agent-extension-sdk -e normal,build,dev --prefix none)"
          if printf '%s\n' "$sdk" | grep -Eq '^(horon-agent-(app-core|base)|horon-tui) v'; then
            echo "::error::the author SDK reaches the agent runtime"
            exit 1
          fi

      - name: Test runner contract tests
        # The cohort steps trust `run_lib_tests.py` to turn a libtest run that
        # matched nothing into a failure; `--min-passed` is that behaviour, and
        # this is where it is proved rather than assumed. The integration
        # runner's per-target `skipped` rows are proved the same way.
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: |
          python3 -m unittest -v \
            scripts/ci/test_run_lib_tests.py \
            scripts/ci/test_run_integration_targets.py

      - name: Test coverage gate contract tests
        # Both guards are data-driven (a manifest and a ratchet baseline), so the
        # decision they encode is only as good as the code that reads it. These
        # tests prove each rejection path: a target or module that no step runs,
        # a stale entry, an empty reason, and a row that runs but has no count.
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: |
          python3 -m unittest -v \
            scripts/ci/test_check_test_targets.py \
            scripts/ci/test_check_lib_test_coverage.py

      - name: Package compat gate contract tests
        # `scripts/ci/package_compat.py` decides whether a native report proves
        # its target and whether the install guide may advertise it, so its
        # rejection paths (cross-compiled evidence, a missing step, a failed
        # step, an unproven claim) are proved here rather than assumed.
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 -m unittest -v scripts/ci/test_package_compat.py

      - name: Enforce every integration target runs
        # #226: the compile step builds every integration target and, before this
        # guard, nothing started most of them. Static check (workflow plus
        # `cargo metadata`), so it costs seconds and needs no build.
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 scripts/ci/check_test_targets.py

      - name: Enforce Rust and TypeScript SDK surface parity
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts_sdk == 'true' || needs.changes.outputs.py_sdk == 'true') }}
        shell: bash
        run: |
          cargo test --locked -p horon-agent-sdk --lib parity -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/sdk-parity.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/sdk-parity.log"

      - name: Run Rust SDK tool verdict tests
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts_sdk == 'true') }}
        shell: bash
        # The `parity` filter above selects nothing in this integration target,
        # so it is named here. The count is the number of tests in
        # `crates/agent-sdk/tests/tool_verdict.rs`: a run that matched fewer
        # fails instead of passing over a smaller set.
        run: |
          cargo test --locked -p horon-agent-sdk --test tool_verdict -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/sdk-tool-verdict.log"
          grep -q '^test result: ok\. 4 passed' "$RUNNER_TEMP/sdk-tool-verdict.log"

      - name: Run Rust SDK A2UI tests
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts_sdk == 'true' || needs.changes.outputs.py_sdk == 'true') }}
        shell: bash
        # `crates/agent-sdk/tests/a2ui.rs` is not covered by `--lib parity`.
        run: |
          cargo test --locked -p horon-agent-sdk --test a2ui -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/sdk-a2ui.log"
          grep -q '^test result: ok\. 4 passed' "$RUNNER_TEMP/sdk-a2ui.log"

      - name: Enforce wildcard re-export ratchet
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 scripts/ci/check_wildcard_reexports.py

      - name: Platform cfg gate contract tests
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 -m unittest -v scripts/ci/test_check_platform_cfg.py

      - name: Enforce platform cfg allowlist
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: python3 scripts/ci/check_platform_cfg.py

      - name: Install cargo-machete
        # The crate is published as a binary; building it from source on every
        # run costs minutes and hundreds of MB on a job that already has the
        # largest build. install-action downloads the release binary instead.
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        uses: taiki-e/install-action@c5695724643db014337e10f479712023ee658d78 # cargo-machete
        with:
          tool: cargo-machete

      - name: Enforce no unused dependencies
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        shell: bash
        run: cargo machete

  release-automation:
    name: Release Automation
    needs: changes
    if: ${{ needs.changes.outputs.release_scripts == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.install_scripts == 'true' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test justrust release installation and routing
        run: |
          python3 tests/test_ci_workflow_guards.py
          python3 tests/test_install_justrust_ci.py
          python3 tests/test_public_release_builds.py
          python3 tests/test_release_ci.py
          python3 scripts/release/test_release.py
          python3 scripts/release/test_auto_release.py
          python3 tests/test_verify_public_release.py
          python3 tests/test_watch_release_run.py
          bash -n scripts/ci/install_justrust.sh scripts/release/build_linux_compat.sh scripts/release/release.sh

  build:
    name: Build & Test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.runner }}
    # 35 minutes covers a normal push (~12 min with a warm Swatinem cache) but
    # not a *rerun*, where the cache is cold: three consecutive reruns of a
    # known-good commit were cancelled at the cap, each getting further through
    # the same green steps. A rerun is exactly what you reach for after a
    # concurrency cancellation, so the old cap made healthy commits look red.
    # A hosted 4 vCPU runner with no cache at all needs more still: this job
    # builds release, test, and e2e artifacts from scratch in one target dir.
    timeout-minutes: 60
    # Some dependencies (e.g. convert_case 0.10.0 via derive_more/crossterm, and
    # proc-macro2/quote) accidentally ship a `rust-toolchain.toml` *inside their
    # published crate*. When cargo builds such a crate its CWD is that crate dir,
    # so the rustup proxy honours the file: convert_case pins `channel = "1.83.0"`
    # and proc-macro2 requests `components = ["rust-src"]`. That made every
    # Build & Test job (a) race two parallel `rust-src` downloads and (b) later
    # try to compile convert_case with rustc 1.83.0, failing with E0514/E0599.
    # RUSTUP_TOOLCHAIN takes precedence over any rust-toolchain.toml override, so
    # pinning it here makes every step use this job's installed stable toolchain.
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON((github.event_name != 'pull_request' || needs.changes.outputs.platform_macos == 'true' || needs.changes.outputs.full_matrix == 'true') && '{"include":[{"os":"ubuntu-latest","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","runner":"macos-latest","target":"aarch64-apple-darwin"}]}' || '{"include":[{"os":"ubuntu-latest","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]}') }}

    steps:
      # The Linux cleanup runs after checkout because it is the shared script in
      # the repository; it renames the unused toolchains and deletes them in the
      # background (#21).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Verify Python eval runner
        run: python3 -B -m unittest -v scripts/ci/test_eval_runner.py

      - name: Free disk space (Linux)
        # Hosted ubuntu starts with about 14 GB on `/`. One job holds the release
        # build, both test harnesses, and the e2e binaries in a single target
        # dir, so the pre-installed toolchains this job never uses are removed.
        if: ${{ !cancelled() && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: bash scripts/ci/free_disk_space.sh

      - name: Free disk space (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          sudo rm -rf /Users/runner/Library/Android /usr/local/share/dotnet \
            "$HOME/Library/Caches/Homebrew"
          df -h /

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          # Pre-install rust-src in the (serial) toolchain step. Some build-script
          # / proc-macro units trigger an on-demand `rustup component add rust-src`,
          # and when several parallel cargo/rustc processes request it at once they
          # race on the shared `~/.rustup/downloads/*.partial` file and fail with
          # "could not rename ... No such file or directory". Fetching it once here
          # removes the race. (Was failing every Build & Test job.)
          components: rust-src${{ runner.os == 'macOS' && ', llvm-tools' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.run_attempt == '1' }}
          cache-on-failure: "false"
          # Suffix bumped to evict caches that held 1.83.0 / <unknown rustc>
          # artifacts produced before RUSTUP_TOOLCHAIN=stable pinned the job.
          key: ${{ matrix.os }}-stablepin

      - name: Install mold linker and reflink tools (Linux)
        if: runner.os == 'Linux'
        run: |
          # clang and mold link Linux binaries; btrfs-progs is used later for the
          # clone isolation reflink cohort, avoiding a second apt-get update.
          installed=0
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq clang mold btrfs-progs; then
              installed=1
              break
            fi
            sleep $((attempt * 10))
          done
          [ "$installed" = 1 ]

      - name: Build
        shell: bash
        run: |
          mkdir -p .cargo
          if [ "$RUNNER_OS" = "Linux" ]; then
            cat > .cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=mold"]
          EOF
          fi
          # Keep the toolchain and compiler fingerprint consistent across this
          # release build and later test compiles.
          RUSTC="$(rustup which rustc)"
          export RUSTC
          CARGO_BIN="$(rustup which cargo)"
          "$CARGO_BIN" build --locked --release --target ${{ matrix.target }}
          # Separate invocation: `-p horon-tui` must not unify features with the
          # headless package. The headless graph gate proves the two never meet;
          # this proves the separate interactive binary actually links on this
          # target, which is the only place crossterm's platform backends are
          # exercised.
          "$CARGO_BIN" build --locked --target ${{ matrix.target }} -p horon-tui

      - name: Launch profile isolation
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/test/launch_profile_smoke.py --agent target/${{ matrix.target }}/release/horon-agent

      - name: System template bounds
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/test/system_template_smoke.py --agent target/${{ matrix.target }}/release/horon-agent

      - name: Skills CLI install gate
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/test/skills_cli_smoke.py --agent target/${{ matrix.target }}/release/horon-agent

      - name: TUI PTY smoke (Linux, macOS)
        # The bare command hands a terminal launch to the sibling `horon-tui`
        # binary, and nothing else in this workflow drives that handoff or the
        # terminal client's screen: the build above only proves the two binaries
        # link. This runs both through a real PTY against the mock model server
        # and checks the first screen, a streamed reply, the approval prompt, the
        # retried tool call, `/quit`, the three headless fallbacks, and a relaunch
        # over the socket file a killed bridge left behind. The client is built
        # without `--release` above, next to the release daemon.
        if: ${{ runner.os != 'Windows' && (github.event_name != 'pull_request' || needs.changes.outputs.tui_smoke == 'true' || needs.changes.outputs.full_matrix == 'true') }}
        shell: bash
        env:
          TUI_SMOKE_REPEATS: ${{ github.event_name == 'workflow_dispatch' && runner.os == 'Linux' && inputs.tui_smoke_repeats || '1' }}
        run: |
          repeats="$TUI_SMOKE_REPEATS"
          if ! [[ "$repeats" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::tui_smoke_repeats must be a positive integer, got '$repeats'"
            exit 1
          fi
          python3 scripts/test/tui_pty_smoke.py \
            --agent target/${{ matrix.target }}/release/horon-agent \
            --tui target/${{ matrix.target }}/debug/horon-tui \
            --transcript "$RUNNER_TEMP/tui-pty-transcript.txt"
          echo "--- transcript ---"
          cat "$RUNNER_TEMP/tui-pty-transcript.txt"
          if [ "$repeats" -gt 1 ]; then
            echo "[tui-pty] repeat 1/$repeats passed (all cases)"
            for i in $(seq 2 "$repeats"); do
              python3 scripts/test/tui_pty_smoke.py \
                --cases 1 \
                --agent target/${{ matrix.target }}/release/horon-agent \
                --tui target/${{ matrix.target }}/debug/horon-tui
              echo "[tui-pty] repeat $i/$repeats passed (case 1)"
            done
          fi

      - name: Installed layout TUI smoke
        # Release packaging runs only in the release workflow, after the change
        # is on `main`, so nothing on a pull request ever drove
        # `install-release --assets` or the layout it leaves behind. This
        # packages the binaries built above under the release asset names for
        # this platform, installs them into a throwaway HORON_HOME, and drives
        # the launcher symlink the terminal client starts from.
        if: ${{ runner.os != 'Windows' && (github.event_name != 'pull_request' || needs.changes.outputs.tui_smoke == 'true' || needs.changes.outputs.full_matrix == 'true') }}
        shell: bash
        run: |
          bash scripts/test/install_release_layout_smoke.sh \
            "target/${{ matrix.target }}/release/horon-agent" \
            "target/${{ matrix.target }}/debug/horon-tui" \
            "$RUNNER_TEMP/installed-layout"
          python3 scripts/test/tui_pty_smoke.py \
            --layout installed \
            --layout-root "$RUNNER_TEMP/installed-layout/home" \
            --transcript "$RUNNER_TEMP/tui-installed-transcript.txt"
          echo "--- transcript ---"
          cat "$RUNNER_TEMP/tui-installed-transcript.txt"

      - name: Release rehearsal installs the optional client
        # The update path takes the same asset directory over HTTP, and the
        # client is optional there: a release that publishes it must install
        # both binaries with no client warning, and an older agent-only release
        # must still install with exactly one warning naming the missing asset.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/release/rehearse_update.py --headless-check --rate 0 --no-strip \
            --root "$RUNNER_TEMP/update-rehearsal-tui" \
            --binary "target/${{ matrix.target }}/release/horon-agent" \
            --tui-binary "target/${{ matrix.target }}/debug/horon-tui"
          python3 scripts/release/rehearse_update.py --headless-check --rate 0 --no-strip \
            --root "$RUNNER_TEMP/update-rehearsal-agent-only" \
            --binary "target/${{ matrix.target }}/release/horon-agent"

      - name: npm install smoke
        # The publish workflow is the only place the seven packages are built
        # from the real archives, and it cannot run before it is on `main`. This
        # installs the same two tarballs a user does, so an archive shape, a
        # bin layout or a launcher regression fails on the pull request.
        shell: bash
        run: |
          bash scripts/npm/smoke_npm_install.sh \
            "target/${{ matrix.target }}/release/horon-agent" \
            "target/${{ matrix.target }}/debug/horon-tui"

      - name: Benchmark script smoke
        # The benchmark workflow runs on demand and after a push to `main`, so
        # nothing on a pull request started the daemon-backed suites: a renamed
        # home variable broke three of them unnoticed. This runs tools, reload
        # and compare once each against the binary built above and reads their
        # reports, because a suite exits 0 even when its daemon never came up.
        # Timings are discarded.
        shell: bash
        run: python3 scripts/perf/bench_smoke.py --binary target/${{ matrix.target }}/release/horon-agent

      - name: Bare Linux runtime smoke (Linux)
        # A hosted ubuntu image ships libssl, a CA bundle, a TTY, and
        # XDG_RUNTIME_DIR, so a release binary that linked OpenSSL dynamically
        # (and could not load on a bare Debian server at all) passed every test
        # here. This runs the real binary in a Debian container with OpenSSL and
        # the CA store removed.
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/ci/check_linux_bare_runtime.sh target/${{ matrix.target }}/release/horon-agent

      - name: Compile library and binary tests
        shell: bash
        # One call compiles the lib and bin tests of every package the cohorts
        # below use. Selecting a different `-p` set per cohort unifies features
        # differently, so each of those calls recompiled dozens of workspace
        # crates (#19). `--message-format=json-render-diagnostics` keeps rendered
        # diagnostics on stderr and writes only JSON messages to stdout, which
        # records each test executable for the cohort steps. The cohort steps
        # run those executables instead of invoking cargo again (#19): a
        # per-cohort `cargo test -p <crate>` unifies features over only that
        # crate, so every workspace crate recompiles with a different
        # fingerprint. The artifacts file lives in `$RUNNER_TEMP`; the JSON is
        # build output, not a test result.
        run: |
          set -euo pipefail
          TEST_ARTIFACTS="$RUNNER_TEMP/test-artifacts.jsonl"
          echo "TEST_ARTIFACTS=$TEST_ARTIFACTS" >> "$GITHUB_ENV"
          # Every package that owns a target in
          # `scripts/ci/integration_targets.json` must be built here, or
          # `run_integration_targets.py` finds no executable for it.
          packages=(-p horon-agent -p horon-agent-app-core -p horon-agent-base -p horon-agent-protocol -p horon-agent-harness-api -p horon-agent-harness-api-server -p horon-agent-irc-core -p horon-agent-todo-policy -p horon-agent-tool-types -p horon-agent-memory-types -p horon-agent-message-types -p horon-agent-productivity-core -p horon-agent-provider-openai -p horon-agent-session-store -p horon-agent-sdk -p horon-tui -p horon-agent-time -p horon-agent-token-estimate -p horon-agent-platform -p horon-agent-import-core -p horon-agent-schema-dialect -p horon-agent-session-types -p horon-agent-logging -p horon-agent-config-types -p horon-agent-extension-sdk)
          if [ "$RUNNER_OS" = "Linux" ]; then
            packages+=(-p horon-agent-embedding)
          fi
          # `tests` compiles every integration target of those packages, not
          # just `e2e`: sixteen session-store contracts, nine SDK contracts and
          # the app-core and base targets. Each was built and started by no
          # workflow before #226, so a break in one merged green; the
          # `Run integration contracts` step below is what runs them, and
          # `scripts/ci/check_test_targets.py` refuses a target neither runs nor
          # allowlists.
          python3 .github/scripts/run_with_timeout.py 1800 \
            "$(rustup which cargo)" test --locked --target ${{ matrix.target }} \
            "${packages[@]}" --lib --bins --tests --test e2e --no-run \
            --message-format=json-render-diagnostics \
            > "$TEST_ARTIFACTS"

      - name: Enforce every compiled lib test module runs
        shell: bash
        # Reads the compile step's artifacts, so it must follow it. It runs each
        # lib executable's `--list <filter>` and compares the modules libtest
        # actually selects against `scripts/ci/lib_test_coverage.ratchet.json`:
        # a module that holds tests but no cohort filter reaches them fails, and
        # a baseline module that is now covered is reported as a drop (#226).
        run: |
          python3 scripts/ci/check_lib_test_coverage.py \
            --artifacts "$TEST_ARTIFACTS"

      - name: Run horon-tui tests
        shell: bash
        # No filter: the whole crate is the surface under test. `--min-passed 1`
        # is the guard against a libtest run that silently matched nothing and
        # reported `0 passed` with exit 0.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-tui \
            --min-passed 1 --timeout 600

      - name: Run whole-crate lib tests without a cohort
        shell: bash
        # The packages below are compiled with `--lib` for their integration
        # targets but no filtered cohort names them, so their lib tests were
        # compiled and never started (#226). No filter: the whole crate is the
        # surface. `--min-passed` is the measured count, so a crate whose tests
        # stop being compiled or selected fails here instead of shrinking to a
        # green `0 passed`.
        run: |
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-config-types --min-passed 65 --timeout 600
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-import-core --min-passed 23 --timeout 600
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-logging --min-passed 28 --timeout 600
          # The memory wiki's shared page model and its graph tests existed but
          # no step named this package, so its lib tests were compiled and never
          # run (#664). 24 graph cases plus 10 page cases make the measured 34.
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-memory-types --min-passed 34 --timeout 600
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-platform --min-passed 11 --timeout 600
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-productivity-core --min-passed 7 --timeout 600
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-schema-dialect --min-passed 38 --timeout 600
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-sdk --min-passed 59 --timeout 600
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-session-store --min-passed 5 --timeout 600
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-session-types --min-passed 12 --timeout 600
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-time --min-passed 46 --timeout 600
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-token-estimate --min-passed 16 --timeout 600

      - name: Prepare a reflink filesystem for clone isolation (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # `git_clone_isolation` copies a repository with `cp -a --reflink=always`
        # and refuses when the filesystem cannot reflink. The hosted runner's
        # root filesystem is ext4, so the success path needs a real reflink
        # filesystem: btrfs on a loopback file, named by
        # `HORON_AGENT_CLONE_TEST_ROOT`. A failure here fails the step instead
        # of letting the clone tests pass on an unsupported filesystem.
        run: |
          set -euo pipefail
          if ! command -v mkfs.btrfs >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq btrfs-progs
          fi
          fixture=$(mktemp -d "$RUNNER_TEMP/horon-clone.XXXXXXXX")
          image="$fixture/disk.img"
          mount_point="$fixture/mount"
          truncate -s 256M "$image"
          mkfs.btrfs -q "$image"
          mkdir "$mount_point"
          sudo mount -o loop "$image" "$mount_point"
          sudo chown "$(id -u):$(id -g)" "$mount_point"
          echo "HORON_AGENT_CLONE_TEST_ROOT=$mount_point" >> "$GITHUB_ENV"
          # The refusal test needs a filesystem without reflink; the hosted
          # runner's ext4 `$RUNNER_TEMP` is one.
          echo "HORON_AGENT_CLONE_TEST_NO_REFLINK_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Run horon-agent-base lib tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # `horon-agent-base` owns config, memory, session, skill and storage
        # tests that only filtered cohorts ever ran, so a module outside those
        # filters could rot green: #321 collected eighteen failures, from stale
        # tool-profile expectations to non-UUID journal ids and an explicit
        # export save guard nothing exercised. No filter: the whole crate is the
        # surface.
        #
        # The first Linux run executed 1605 cases (#321, job 134409170973).
        # The five staged-import regressions and the filesystem refusal test
        # bring that floor to 1611. The three ignored benchmarks are separate.
        # It moved 1611 -> 1597 when prune-tests (#419) removed fourteen tests
        # that guarded no behavior, and the hosting boundary (#663) brought it
        # to 1612. The fifty memory wiki store cases (#664) bring it to 1662, the
        # thirteen hosted MCP and child-process gate tests (#668) bring it to
        # 1675, and the fifteen harness API exposure cases (fourteen resolution
        # tests plus the config-template documentation test) bring it to 1690.
        # The memory integration (#665) adds fifteen: fourteen store-backend
        # cases and one that keeps the memory event log inside HORON_HOME, for
        # 1705. The volume lifecycle (#666) adds thirty-one: export and import,
        # the archive's hostile-entry refusals, the write fence and its
        # checkpoint, the key contract, the control-plane client with its
        # no-body property, and the deletion step machine, for 1736.
        run: |
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-base --min-passed 1736 --timeout 1200

      - name: Run horon-agent-base lib tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # The previous macOS suite passed 1592 cases. Include the five
        # staged-import regressions in the minimum for the complete suite.
        # It moved 1597 -> 1583 when prune-tests (#419) removed fourteen tests
        # that guarded no behavior, and the hosting boundary (#663) brought it
        # to 1598. The fifty memory wiki store cases (#664) bring it to 1648, the
        # thirteen hosted MCP and child-process gate tests (#668) bring it to
        # 1661, and the fifteen harness API exposure cases bring it to 1676.
        # The memory integration (#665) adds fifteen, for 1691. The volume
        # lifecycle (#666) adds thirty-one, for 1722.
        run: |
          python3 scripts/ci/run_lib_tests.py --artifacts "$TEST_ARTIFACTS" \
            --package horon-agent-base --min-passed 1722 --timeout 1200

      - name: Remove the reflink filesystem (Linux)
        if: always() && runner.os == 'Linux' && env.HORON_AGENT_CLONE_TEST_ROOT != ''
        shell: bash
        run: |
          sudo umount "$HORON_AGENT_CLONE_TEST_ROOT"
          fixture=$(dirname "$HORON_AGENT_CLONE_TEST_ROOT")
          rm "$fixture/disk.img"
          rmdir "$HORON_AGENT_CLONE_TEST_ROOT" "$fixture"

      - name: Run CLI handoff cohort
        shell: bash
        # The bare command's handoff decision is the only thing that sends a
        # terminal launch into `horon-tui`, and no other step runs `horon-agent`
        # lib tests at all, so a filter that matched nothing would look green.
        # `--min-passed 1` fails the step when the filter selects no test.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 1 \
            -- tui_handoff --nocapture

      - name: Run CLI continue cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 1 \
            -- cli::dispatch::dispatch_tests::continue_ --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 1 \
            -- cli::commands::run_jobs::tests::waits_for_two_owned_jobs_without_waiting_for_another_session --nocapture

      - name: Run CLI shell completions cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 2 \
            -- cli::startup::completions::tests:: --nocapture

      - name: Run CLI stream rule preview cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 2 \
            -- cli::startup::stream_rule_preview::tests:: --nocapture

      - name: Run CLI token estimation cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 2 \
            -- cli::startup::tokens::tests:: --nocapture

      - name: Run CLI agent catalog cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 1 \
            -- cli::startup::agent_catalog::tests:: --nocapture

      - name: Run skill source policy tests
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- skill_install::tests::only_plain_remotes --nocapture

      - name: Run CLI launch profile cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 3 \
            -- cli::launch_profile::tests:: --nocapture

      - name: Run CLI session recovery preview cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 6 \
            -- cli::sessions::recovery::tests:: --nocapture

      - name: Run CLI provider status cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 1 \
            -- cli::startup::provider_status::tests:: --nocapture

      - name: Run CLI provider failover preview cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 3 \
            -- cli::commands::failover_preview::tests:: --nocapture

      - name: Run CLI changelog cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 2 \
            -- cli::startup::changelog::tests:: --nocapture

      - name: Run CLI generated images cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 2 \
            -- cli::startup::images::tests:: --nocapture

      - name: Run CLI compact-text cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 2 \
            -- cli::dispatch::compact_text::tests:: --nocapture

      - name: Run CLI cloud doctor cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 1 \
            -- cli::cloud_doctor::tests:: --nocapture

      - name: Run CLI visible reasoning cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 2 \
            -- cli::commands::thoughts::tests:: --nocapture

      - name: Run ACP cohort
        shell: bash
        # AGENTS.md fixed requirement 2 names `cargo test -p horon-agent --lib acp`
        # as its check, and until this step no workflow ran it: the ACP v1 and
        # v2 adapter tests were compiled here and never executed (#226).
        # `--min-passed` pins the count the filter selects, so a rename that
        # moves tests out of the filter fails the step instead of shrinking it.
        # It moved 297 -> 296 with the permanent session delete: that change
        # removed the `CatalogLookup` probe, which only there decided whether a
        # delete had anything to remove, so its single test went with it. The
        # delete path is covered instead by the daemon tests in app-core.
        # It moved 296 -> 294 when prune-tests (#419) removed two tests that
        # duplicated stronger ACP tests.
