            --artifacts "$TEST_ARTIFACTS" --package horon-agent-provider-openai \
            --timeout 600 --min-passed 2 \
            -- stream::stream_tool_tests::tool_call_example_stays_text --nocapture

      - name: Run swarm plan proposal and lightweight comm cohort
        shell: bash
        # Both modules were split out of oversized files to stay inside the
        # code-size ratchet, and app-core lib tests are never run whole here,
        # so without this step they would compile in every run and execute in
        # none. The plan-proposal store is the typed replacement for the
        # removed `plan_proposal:<session>` shared-context key (take is
        # atomic-once, peek does not consume, per-swarm scoping holds), and the
        # lightweight comm path proves a control-only request never pays for
        # full session initialization. Each `--min-passed` is the number of
        # tests its filter really matches, so a renamed module fails on the
        # count instead of passing over an empty subset.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 4 \
            -- server::plan_proposals::tests --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- server::client_lifecycle::tests::lightweight_comm --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 2 \
            -- tool::communicate::tests::spawn_label_validation --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- tool::communicate::tests::spawn_execute_rejects_missing_label_before_sending_request --nocapture

      - name: Run turn end race cohort
        shell: bash
        # A prompt a client sends on a turn's terminal event must find that turn
        # closed, a context message written on it must be stored after that
        # turn's completion tail, and a cancel's reply must follow the cancelled
        # turn's queued events. These drive the daemon's request loop and the
        # turn forwarder in process; the rest of `acp_v2_events` is still
        # outside every cohort. `--min-passed` is the number of tests the filter
        # matches.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 6 \
            -- server::client_lifecycle::tests::acp_v2_events::turn_end_race --nocapture

      - name: Run tool_done verdict cohort
        shell: bash
        # The optional `verdict` on `tool_done` has three surfaces this workflow
        # reaches only through filters: the daemon wire frame in
        # `horon-agent-protocol`, the harness API frame in
        # `horon-agent-harness-api`, and the bridge that copies the stored
        # verdict between them in `horon-agent-harness-api-server`. Each
        # `--min-passed` is the number of tests its filter really matches, so a
        # renamed module fails on the count instead of passing over an empty
        # subset. libtest takes one filter per run.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-protocol \
            --timeout 600 --min-passed 3 \
            -- tool_done_ --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-harness-api \
            --timeout 600 --min-passed 4 \
            -- tool_done_verdict_tests:: --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-harness-api-server \
            --timeout 600 --min-passed 1 \
            -- tool_done_carries_ --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-harness-api-server \
            --timeout 600 --min-passed 1 \
            -- translate::tests::soft_interrupt_injected_closes_open_text_and_carries_ids --nocapture

      - name: Run effective settings wire cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-harness-api \
            --timeout 600 --min-passed 5 \
            -- effective_settings_snapshot_tests:: --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-harness-api-server \
            --timeout 600 --min-passed 6 \
            -- translate::effective_settings::tests:: --nocapture

      - name: Run stale API socket probe cohort
        shell: bash
        # A client that answered "is the bridge up?" from the socket file's
        # existence dialled the bridge a closed terminal had killed, and reported
        # "no harness answered". The SDK now probes with a connection, and that
        # probe hangs up without sending a byte, so the bridge must end such a
        # connection without an error frame or a log line. `stdio_tests` has no
        # other cohort, `--min-passed` is the number of tests the filter matches,
        # and a renamed test then fails instead of passing over an empty subset.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-harness-api-server \
            --timeout 600 --min-passed 1 \
            -- stale_socket_probe --nocapture

      - name: Run bridge lifecycle cohort
        shell: bash
        # The bridge used to accept forever, so the first one a terminal started
        # outlived its client and kept the socket path through an upgrade
        # (#429). Its lib tests run only through this filter, and
        # `--min-passed` is the count the filter matches, so a renamed module
        # fails here instead of passing over an empty subset. The lock test is
        # in no other cohort and is the acceptance's "a second spawn still
        # exits on the lock" half.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-harness-api-server \
            --timeout 600 --min-passed 3 \
            -- bridge_lifecycle_tests:: --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-harness-api-server \
            --timeout 600 --min-passed 1 \
            -- single_instance_tests:: --nocapture

      - name: Run stored message content cohort
        shell: bash
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-harness-api-server \
            --timeout 600 --min-passed 3 \
            -- message_content::tests:: --nocapture

      - name: Run session id prefix cohort
        shell: bash
        # Both suites only run through filters, so a prefix resolver that
        # compiles would ship untested: `horon-agent-base` and
        # `horon-agent-app-core` lib tests are never run whole here. The base
        # half covers the matcher itself (exact id wins, duplicates do not
        # ambiguate, ten-candidate cap, a five-character match refused);
        # the app-core half covers the Subscribe path that resolves a stored
        # or live session, and the refusals an operator sees.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- session_prefix:: --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- subscribe_prefix --nocapture

      - name: Run MCP server request cohort
        shell: bash
        # An MCP server may call back into the client (`ping`, `roots/list`, or a
        # method this version does not implement). Dropping those requests
        # leaves the server waiting on a reply that never comes, so the three
        # modules below cover the answer end to end and none of them has another
        # cohort: they would compile and never execute
        # (scripts/ci/check_lib_test_coverage.py). The stdio half proves a
        # request is answered while a notification is not, and that roots are
        # served only under the `[mcp] expose_roots` opt-in; the remote half
        # proves the same two answers over the dedicated POST that bypasses the
        # request registry; the config half proves the opt-in defaults off and
        # parses when set.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 2 \
            -- mcp::client::server_requests_tests --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 2 \
            -- mcp::remote::remote_server_requests_tests --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- config::mcp::tests --nocapture
      - name: Run cancellable work cohort
        shell: bash
        # Cancelling a run, cancelling one tool call and listing background work
        # span three packages, and all three suites run only through filters
        # here. The daemon half drives the real connection: a cancelled call
        # stops while the turn continues, an unknown id is refused, a
        # `cancel_turn` for another run id leaves the turn alone and one for the
        # reported run id stops it, and the background-work list and cancel
        # replies each carry the `call_id` they name. The harness-api half pins
        # the two replies as additive frames that older clients still decode,
        # and the bridge half proves each of the four requests forwards as the
        # daemon frame it names and that a reply correlates back to its request.
        # `cancellable_work_snapshot_tests` and `translate::cancellable_work_tests`
        # are new modules with no other cohort, so without this step they would
        # compile and never execute (scripts/ci/check_lib_test_coverage.py).
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 4 \
            -- acp_tool_cancel --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 9 \
            -- acp_background_work --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-harness-api \
            --timeout 600 --min-passed 2 \
            -- cancellable_work_snapshot_tests:: --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-harness-api-server \
            --timeout 600 --min-passed 4 \
            -- translate::cancellable_work_tests --nocapture

      - name: Run checkpoint tool cohort
        shell: bash
        # `horon-agent-app-core` and `horon-agent-base` lib tests only run
        # through filters, so the checkpoint and rewind tools would compile and
        # ship unexecuted. The first filter covers the two tools and their
        # registration switch, the second the settle path that commits the
        # marker, folds a branch into the report and undoes it, the third the
        # `[tools] checkpoint` config switch.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 12 \
            -- tool::checkpoint:: --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 14 \
            -- agent::rewind_summary:: --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 3 \
            -- config::checkpoint_switch_tests:: --nocapture

      - name: Run compaction and handoff cohorts
        shell: bash
        # Compaction is the path that decides what a resumed session can still
        # see, and no other step in this workflow runs it: every `horon-agent-base`
        # and `horon-agent-app-core` run above is filtered to another prefix, so
        # a change to the handoff generator, the strategy dispatch or the
        # overnight trigger would compile and never execute. All three live in
        # the lib suites, which is why `--min-passed 1` matters: a filter that
        # matched nothing reports `0 passed` and exits 0, the looks-green shape
        # this workflow has already fixed twice.
        #
        # `overnight_handoff` is the subset of the overnight trigger that crosses
        # into compaction; it is not selected by `compaction` alone because the
        # module is named for the run, not the mechanism.
        #
        # `HORON_HOME` points at a throwaway directory with mode 700. The
        # compaction tests in `agent::tests` save and reload a session, and the
        # store refuses a home whose path components are not owner-private; on a
        # hosted runner `$HOME` is world-readable, so those tests pass on a
        # developer machine and fail here. One directory serves the whole step:
        # the three calls run in sequence and share the session store they build.
        run: |
          HORON_HOME="$(mktemp -d)"
          export HORON_HOME
          chmod 700 "$HORON_HOME"
          trap 'rm -rf "$HORON_HOME"' EXIT
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- compaction --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- compaction --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- overnight_handoff --nocapture

      - name: Run integration contracts
        shell: bash
        # Compiles `--tests` above, so these are built; before #226 nothing
        # started them, and a target that only builds can break in a merged
        # pull request without turning a check red. The target list, package
        # and measured pass count live in `scripts/ci/integration_targets.json`
        # so the guard that checks this coverage reads the same file.
        run: |
          python3 scripts/ci/run_integration_targets.py \
            --artifacts "$TEST_ARTIFACTS" --timeout 900

      - name: Verify package manifests with an isolated home
        shell: bash
        run: |
          HORON_HOME="$(mktemp -d)"
          export HORON_HOME
          trap 'rmdir "$HORON_HOME"' EXIT
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --kind test --target-name package_manifest --min-passed 9 --timeout 900

      - name: Run extension wire contracts with an isolated home
        shell: bash
        # The extension wire owns the framing, deadlines and correlation a
        # user-installed Rust child speaks. It is a lib module in
        # `horon-agent-app-core`, so no other cohort filter reaches it: the
        # `--min-passed` count is the guard against a filter that matches
        # nothing and reports `0 passed` with exit 0. One test starts this very
        # test executable as a real child process over stdin and stderr, so the
        # framing crosses real OS pipes.
        #
        # `HORON_HOME` selects a fresh owner-private directory for Horon state,
        # so the tests and the child they start never touch the user's Horon
        # home. It sets no other limit on what a process can open.
        run: |
          HORON_HOME="$(mktemp -d)"
          export HORON_HOME
          chmod 700 "$HORON_HOME"
          trap 'rm -rf "$HORON_HOME"' EXIT
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --min-passed 34 --timeout 900 -- extensions::wire::tests --nocapture

      # e2e runs inside `Run integration contracts` above, through the same
      # artifacts file: its binary is built by the compile step, and a second
      # `cargo test --test e2e` here would rebuild the selection set (#19).

      # macOS only: the quality job already runs the same gate on Linux, and a
      # second whole-workspace `cargo check` on the ubuntu matrix entry is a
      # second full compile of a release build that is already on disk. macOS is
      # the only place this gate sees Apple-specific warnings. Windows still has
      # its own cfg-gated surface and is not yet warning-clean, so it stays
      # out.
      - name: Enforce warning budget (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/ci/check_warnings.sh

      - name: Install cargo-audit
        if: runner.os == 'Linux'
        # Pre-built binary: building cargo-audit from source costs 5-10 minutes
        # on a job that already has a full target dir.
        uses: taiki-e/install-action@c5695724643db014337e10f479712023ee658d78 # cargo-audit
        with:
          tool: cargo-audit

      - name: Security preflight (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/ci/check_security.sh --strict

      - name: sccache stats
        # Runs even after a failed gate so the cache state is visible in the
        # log, but only when the wrapper was really enabled.
        if: ${{ always() && env.RUSTC_WRAPPER == 'sccache' }}
        shell: bash
        run: sccache --show-stats

  windows-build-test:
    name: Build & Test (windows-latest)
    needs: changes
    runs-on: windows-latest
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 75
    steps:
      - name: Report free disk space
        # D: carries the workspace and target dir on the Windows image. Logged,
        # not gated: the image has room, but a target dir of this size makes the
        # number worth having when a run fails.
        shell: pwsh
        run: Get-PSDrive D | Format-Table -AutoSize

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Verify Python eval runner
        run: python -B -m unittest -v scripts/ci/test_eval_runner.py

      - uses: ./.github/actions/msvc-dev-cmd
        with:
          arch: amd64

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Job-wide, before the first cargo call: a wrapper applied to one step
      # only left `<unknown rustc version>` artifacts that the next unwrapped
      # compile rejected with E0514 ("compiled by an incompatible version of
      # rustc", run 42373575639). Every cargo call in this job must share the
      # same wrapper.
      #
      # CARGO_INCREMENTAL=0 is required, not a speed tweak: sccache cannot
      # cache incremental units, and both [profile.dev] and [profile.release]
      # in Cargo.toml set incremental = true, so nothing would be cached.
      #
      # This job runs on a GitHub-hosted Windows image only; the guard keeps
      # the step out of any other environment.
      - name: Setup sccache
        if: runner.environment == 'github-hosted'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          disable_annotations: true
        continue-on-error: true

      - name: Enable sccache
        # The wrapper is written only when the server actually starts, so a
        # runner without a working sccache runs every cargo call unwrapped
        # instead of mixing wrapped and unwrapped builds.
        if: runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) {
            Write-Host 'sccache is not available; this job builds without a wrapper'
            exit 0
          }
          sccache --start-server
          if ($LASTEXITCODE -eq 0) {
            "RUSTC_WRAPPER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CARGO_INCREMENTAL=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host 'sccache failed to start; this job builds without a wrapper'
          }
          # A step is not a script: GitHub appends `exit $LASTEXITCODE` to a
          # pwsh body, so a failed `sccache --start-server` would fail the whole
          # job even though the branch above deliberately continues unwrapped.
          # The bash twin has no such epilogue, which is why only Windows went
          # red when the cache backend answered 503 ServerBusy ("Egress is over
          # the account limit", run 43451256902) and every later step, including
          # the build, was skipped. Ending with an explicit success keeps the
          # decision here: the wrapper is opt-in, its absence is not a failure.
          exit 0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          key: windows-latest
          cache-all-crates: "true"

      - name: Build release binary
        shell: pwsh
        run: |
          & cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows release build failed'
          }

      - name: Build horon-tui binary
        shell: pwsh
        # A separate package from the headless binary on purpose: the graph gate
        # forbids any path from `horon-agent` to a terminal library, so the two
        # are built by separate cargo invocations.
        run: |
          & cargo build --locked --target x86_64-pc-windows-msvc -p horon-tui
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows horon-tui build failed'
          }

      - name: ConPTY smoke (TUI client on Windows)
        shell: bash
        # The client's Windows behaviour used to be covered only by its library
        # tests: nothing drew a screen, read a keystroke or left through a real
        # console, so a broken render or exit path merged green (#432). The same
        # smoke cases the Unix jobs run (happy path, piped stdin) now drive
        # `horon-agent.exe` -> `horon-tui.exe` through a ConPTY.
        #
        # `pywinpty` is the ConPTY binding. The image ships Python but not the
        # package, and a package that cannot be installed must say so instead of
        # failing the job for an unrelated reason.
        run: |
          if ! python -m pip install --quiet --disable-pip-version-check pywinpty; then
            echo "::warning::pywinpty could not be installed; the Windows ConPTY smoke test did not run"
            exit 0
          fi
          python scripts/test/tui_pty_smoke.py --cases 1,2 \
            --agent target/x86_64-pc-windows-msvc/release/horon-agent.exe \
            --tui target/x86_64-pc-windows-msvc/debug/horon-tui.exe

      - name: npm install smoke
        # The Windows archive is the one shape the other two jobs never produce:
        # a `.exe` entry with no shell wrapper, which `npm install -g` shims as
        # a `.cmd`. Git Bash runs the script so it shares one implementation
        # with the Linux and macOS jobs.
        shell: bash
        run: |
          bash scripts/npm/smoke_npm_install.sh \
            target/x86_64-pc-windows-msvc/release/horon-agent.exe \
            target/x86_64-pc-windows-msvc/debug/horon-tui.exe

      - name: Compile library and binary tests
        shell: pwsh
        run: |
          & cargo test --locked --target x86_64-pc-windows-msvc --lib --bins --no-run
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows library/binary test compilation failed'
          }

      - name: Run horon-tui tests
        shell: pwsh
        # No filter: the whole crate runs. The Linux and macOS jobs additionally
        # go through `run_lib_tests.py --min-passed 1`, which is what catches a
        # libtest run that matched nothing; here the count is read back from the
        # run so a silently empty executable still fails.
        run: |
          # The compile runs under the timeout wrapper: it is the expensive part
          # of this step, and an unwrapped hang would sit here until the job
          # limit. Afterwards the executable exists, so the `--list` call below
          # only starts it and is safe to run outside the wrapper.
          & ./scripts/ci/cargo_with_timeout.ps1 `
            -Name 'compile horon-tui tests' `
            -TimeoutSeconds 600 `
            -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '-p', 'horon-tui', '--lib', '--no-run')
          # The timeout helper launches cargo as a child process, so its output
          # never reaches a captured variable. The count therefore comes from a
          # separate `--list` invocation of the same already-compiled test
          # binary, and the run itself is only checked for its exit code.
          $list = & cargo test --locked --target x86_64-pc-windows-msvc -p horon-tui --lib -- --list 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw 'could not list horon-tui tests'
          }
          $compiled = ($list | Select-String -Pattern ': test$').Count
          if ($compiled -lt 1) {
            throw 'horon-tui compiled no tests'
          }
          Write-Host "horon-tui tests compiled: $compiled"
          & ./scripts/ci/cargo_with_timeout.ps1 `
            -Name 'horon-tui tests' `
            -TimeoutSeconds 600 `
            -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '-p', 'horon-tui', '--lib')

      - name: Prepare targeted Windows validation tests
        shell: pwsh
        # One cargo invocation builds all four group executables. Asking cargo
        # per group re-unified features over that group's package alone, so
        # every group recompiled the workspace crates and the step spent
        # minutes building for seconds of tests (#413; the Unix jobs took the
        # same path in #19). The second cargo call only reports where those
        # executables landed: the build above is up to date, so it compiles
        # nothing, and the human diagnostics stay in the first call where a
        # failure is read.
        run: |
          & ./scripts/ci/cargo_with_timeout.ps1 `
            -Name 'compile targeted Windows validation tests' `
            -TimeoutSeconds 1800 `
            -CargoArgs @(
              'test', '--locked', '--target', 'x86_64-pc-windows-msvc',
              '-p', 'horon-agent-platform-windows', '-p', 'horon-agent-base',
              '-p', 'horon-agent-app-core', '-p', 'horon-agent-irc-core',
              '--lib', '--no-run'
            )
          $artifacts = Join-Path $env:RUNNER_TEMP 'targeted-validation-artifacts.jsonl'
          "TARGETED_VALIDATION_ARTIFACTS=$artifacts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & ./scripts/ci/cargo_with_timeout.ps1 `
            -Name 'locate targeted Windows validation executables' `
            -TimeoutSeconds 300 `
            -StandardOutput $artifacts `
            -CargoArgs @(
              'test', '--locked', '--target', 'x86_64-pc-windows-msvc',
              '-p', 'horon-agent-platform-windows', '-p', 'horon-agent-base',
              '-p', 'horon-agent-app-core', '-p', 'horon-agent-irc-core',
              '--lib', '--no-run', '--message-format=json-render-diagnostics'
            )

      - name: Run targeted Windows validation tests
        shell: pwsh
        run: |
          # Each test lives in a specific crate, so every group names its
          # package. A filter that matches nothing makes libtest report
          # "0 passed" and exit 0, so each name is checked against the
          # executable's own test list before the run and a missing name fails
          # the step. The executables are the ones the prepare step built;
          # starting them directly is what skips cargo's per-package feature
          # re-unification (#413).
          $groups = [ordered]@{
            'horon-agent-platform-windows' = @(
              'is_process_running_reports_exited_children_as_stopped',
              'spawn_replacement_process_returns_without_waiting_for_child_exit',
              'pipe_name_is_stable_and_normalizes_case_and_separators',
              'pipe_name_falls_back_when_stem_is_empty',
              'busy_pipe_is_reported_as_a_live_socket_path',
              'sync_connect_waits_while_every_instance_is_taken',
              'a_blocked_read_does_not_hold_back_a_write',
              'stream_pair_round_trips_bytes',
              'split_stream_supports_concurrent_read_and_write',
              'directory_sync_is_not_effective_on_windows',
              'resources::tests::snapshot_reports_real_memory_load_and_battery',
              'resources::tests::disk_fact_reads_the_system_volume',
              'resources::tests::disk_fact_is_skipped_when_no_path_is_asked_for'
            )
            'horon-agent-base' = @(
              'import::takeover_tests::takeover_is_refused_before_a_session_is_staged_on_an_unsupported_platform',
              'import::takeover_tests::unsupported_reason_is_none_exactly_where_takeover_works'
            )
            'horon-agent-app-core' = @(
              'sibling_socket_path_roundtrip',
              'cleanup_socket_pair_removes_main_and_debug_files',
              'build_shell_command_uses_cmd_and_executes_command',
              'eval_opt_in_follows_profile_and_disabled_tools',
              'eval_accepts_model_tool_arguments',
              'eval_requires_explicit_approval_even_in_permissive_modes',
              'eval_retains_state_until_reset_or_idle_reclamation',
              'eval_bounds_inline_output_and_keeps_a_session_artifact',
              'eval_timeout_stops_the_process_and_its_child',
              'eval_aborted_call_cleans_up_before_the_next_cell',
              'eval_oversized_cell_preserves_previous_state',
              'eval_daemon_approval_is_consumed_once',
              'eval_editor_approves_one_cell_without_releasing_another',
              'eval_bridge_reads_and_runs_shell_through_the_registry',
              'eval_bridge_requires_separate_approval_for_a_shell_call',
              'eval_bridge_refuses_off_tools_dispatchers_and_background_shell',
              'eval_bridge_limits_calls_and_keeps_the_next_cell_usable',
              'eval_bridge_timeout_stops_running_shell'
            )
            'horon-agent-irc-core' = @(
              'send_orders_same_millisecond_messages_by_seq',
              'mailbox_drops_oldest_beyond_cap',
              'mutual_wait_returns_unanswerable'
            )
          }

          # Read the prepare step's artifact report. Each selected package
          # contributes exactly one test-profile lib executable; two would mean
          # the report is ambiguous and the run could start the wrong binary.
          $executables = @{}
          Get-Content -LiteralPath $env:TARGETED_VALIDATION_ARTIFACTS | ForEach-Object {
            if ([string]::IsNullOrWhiteSpace($_)) { return }
            $message = $_ | ConvertFrom-Json
            if ($message.reason -ne 'compiler-artifact') { return }
            if (-not ($message.target.kind -contains 'lib')) { return }
            if (-not $message.profile.test) { return }
            if (-not $message.executable) { return }

            $packageId = [string]$message.package_id
            if ($packageId.Contains('#')) {
              $fragment = $packageId.Substring($packageId.LastIndexOf('#') + 1)
              $at = $fragment.IndexOf('@')
              if ($at -ge 0) {
                $package = $fragment.Substring(0, $at)
                $version = $fragment.Substring($at + 1)
              } else {
                $package = $fragment
                $version = '0.0.0'
              }
            } else {
              $fields = $packageId.Split(' ')
              $package = $fields[0]
              $version = if ($fields.Count -ge 2) { $fields[1] } else { '0.0.0' }
            }

            if ($executables.ContainsKey($package)) {
              throw "cargo reported two lib test executables for $package"
            }
            $executables[$package] = [pscustomobject]@{
              Executable = [string]$message.executable
              Directory  = Split-Path -Parent ([string]$message.manifest_path)
              Version    = $version
            }
          }

          $cargoPath = (Get-Command cargo -ErrorAction Stop).Source

          foreach ($package in $groups.Keys) {
            $names = $groups[$package]
            if (-not $executables.ContainsKey($package)) {
              throw "the prepared artifacts hold no lib test executable for $package"
            }
            $entry = $executables[$package]

            $listed = & $entry.Executable --list 2>&1 | ForEach-Object { "$_" }
            if ($LASTEXITCODE -ne 0) {
              $listed | ForEach-Object { Write-Host $_ }
              throw "listing tests of $package failed with exit code $LASTEXITCODE"
            }
            foreach ($testName in $names) {
              if (-not ($listed | Where-Object { $_ -match "(^|::)$([regex]::Escape($testName)): test$" })) {
                throw "Windows targeted test $testName is not in the $package lib tests"
              }
            }

            # Cargo runs a lib test executable with the package root as the
            # working directory and these variables set; starting the
            # executable directly has to reproduce both.
            $env:CARGO_MANIFEST_DIR = $entry.Directory
            $env:CARGO_PKG_NAME = $package
            $env:CARGO_PKG_VERSION = $entry.Version
            $env:CARGO = $cargoPath
            & ./scripts/ci/run_with_timeout.ps1 `
              -Name "Windows targeted tests: $package" `
              -TimeoutSeconds 600 `
              -FilePath $entry.Executable `
              -WorkingDirectory $entry.Directory `
              -Arguments (@($names) + @('--nocapture'))
          }

      - name: Run Windows power tests
        shell: pwsh
        run: |
          & ./scripts/ci/cargo_with_timeout.ps1 `
            -Name 'Windows power-inhibit tests' `
            -TimeoutSeconds 900 `
            -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '-p', 'horon-agent-platform-windows', '--lib', 'power::tests::', '--', '--nocapture')

      - name: Run Windows package manifest contracts
        shell: pwsh
        run: |
          $env:HORON_HOME = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $env:HORON_HOME -ErrorAction Stop | Out-Null
          try {
            & ./scripts/ci/cargo_with_timeout.ps1 `
              -Name 'Windows package manifest contracts' `
              -TimeoutSeconds 900 `
              -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '-p', 'horon-agent-base', '--test', 'package_manifest')
          } finally {
            Remove-Item -LiteralPath $env:HORON_HOME -Recurse -Force
          }

      - name: Run Windows package catalog contracts
        shell: pwsh
        run: |
          $env:HORON_HOME = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $env:HORON_HOME -ErrorAction Stop | Out-Null
          try {
            & ./scripts/ci/cargo_with_timeout.ps1 `
              -Name 'Windows package catalog contracts' `
              -TimeoutSeconds 900 `
              -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '-p', 'horon-agent-base', '--test', 'package_catalog')
          } finally {
            Remove-Item -LiteralPath $env:HORON_HOME -Recurse -Force
          }

      - name: Run Windows extension wire contracts
        shell: pwsh
        # The same lib module the Linux/macOS job runs, on the one OS whose pipes
        # and process model differ. The targeted-validation prepare step above
        # already compiled and located this crate's lib test executable, so this
        # step starts that binary directly instead of asking cargo again (#413).
        # The filter is checked against the executable's own `--list` first,
        # because a filter that selects nothing reports `0 passed` and exits 0.
        # `HORON_HOME` selects a fresh per-run directory for Horon state.
        run: |
          $env:HORON_HOME = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $env:HORON_HOME -ErrorAction Stop | Out-Null
          try {
            $executables = @{}
            Get-Content -LiteralPath $env:TARGETED_VALIDATION_ARTIFACTS | ForEach-Object {
              if ([string]::IsNullOrWhiteSpace($_)) { return }
              $message = $_ | ConvertFrom-Json
              if ($message.reason -ne 'compiler-artifact') { return }
              if (-not ($message.target.kind -contains 'lib')) { return }
              if (-not $message.profile.test) { return }
              if (-not $message.executable) { return }
              $packageId = [string]$message.package_id
              if ($packageId.Contains('#')) {
                $fragment = $packageId.Substring($packageId.LastIndexOf('#') + 1)
                $at = $fragment.IndexOf('@')
                $package = if ($at -ge 0) { $fragment.Substring(0, $at) } else { $fragment }
              } else {
                $package = $packageId.Split(' ')[0]
              }
              if ($executables.ContainsKey($package)) {
                throw "cargo reported two lib test executables for $package"
              }
              $executables[$package] = [pscustomobject]@{
                Executable = [string]$message.executable
                Directory  = Split-Path -Parent ([string]$message.manifest_path)
              }
            }
            if (-not $executables.ContainsKey('horon-agent-app-core')) {
              throw 'the prepared artifacts hold no lib test executable for horon-agent-app-core'
            }
            $entry = $executables['horon-agent-app-core']
            $listed = & $entry.Executable --list 'extensions::wire::tests' 2>&1 | ForEach-Object { "$_" }
            if ($LASTEXITCODE -ne 0) {
              $listed | ForEach-Object { Write-Host $_ }
              throw 'could not list the extension wire contracts'
            }
            $selected = ($listed | Select-String -Pattern ': test$').Count
            if ($selected -lt 34) {
              throw "the extension wire filter selected $selected tests, expected at least 34"
            }
            Write-Host "extension wire contracts selected: $selected"
            $env:CARGO_MANIFEST_DIR = $entry.Directory
            $env:CARGO_PKG_NAME = 'horon-agent-app-core'
            $env:CARGO = (Get-Command cargo -ErrorAction Stop).Source
            & ./scripts/ci/run_with_timeout.ps1 `
              -Name 'Windows extension wire contracts' `
              -TimeoutSeconds 900 `
              -FilePath $entry.Executable `
              -WorkingDirectory $entry.Directory `
              -Arguments (@('extensions::wire::tests', '--nocapture'))
          } finally {
            Remove-Item -LiteralPath $env:HORON_HOME -Recurse -Force
          }

      - name: Run Windows package CLI contracts
        shell: pwsh
        run: |
          $env:HORON_HOME = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $env:HORON_HOME -ErrorAction Stop | Out-Null
          try {
            & ./scripts/ci/cargo_with_timeout.ps1 `
              -Name 'Windows package CLI contracts' `
              -TimeoutSeconds 900 `
              -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '--test', 'package_cli')
          } finally {
            Remove-Item -LiteralPath $env:HORON_HOME -Recurse -Force
          }

      - name: Run Windows e2e smoke tests
        shell: pwsh
        run: |
          $tests = @(
            'provider_behavior::test_socket_model_cycle_supported_models',
            'provider_behavior::test_model_switch_resets_provider_session'
          )

          foreach ($testName in $tests) {
            & ./scripts/ci/cargo_with_timeout.ps1 `
              -Name "Windows e2e smoke test: $testName" `
              -TimeoutSeconds 420 `
              -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '--test', 'e2e', $testName, '--', '--exact', '--nocapture')
          }

      - name: Run Windows lifecycle e2e tests
        shell: pwsh
        env:
          HORON_AGENT_E2E_ARTIFACT_DIR: ${{ runner.temp }}/horon-agent-windows-e2e-logs
        run: |
          New-Item -ItemType Directory -Force -Path $env:HORON_AGENT_E2E_ARTIFACT_DIR | Out-Null
          $tests = @(
            'windows_lifecycle::windows_binary_server_accepts_clients_and_debug_cli',
            'windows_lifecycle::windows_binary_server_rebinds_named_pipe_after_exit'
          )
          foreach ($testName in $tests) {
            & ./scripts/ci/cargo_with_timeout.ps1 `
              -Name "Windows lifecycle e2e test: $testName" `
              -TimeoutSeconds 420 `
              -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '--test', 'e2e', $testName, '--', '--exact', '--nocapture')
          }

      - name: Upload Windows e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-e2e-diagnostics
          path: ${{ runner.temp }}/horon-agent-windows-e2e-logs
          if-no-files-found: ignore

      - name: Verify built binary launches
        shell: pwsh
        run: |
          & "target/x86_64-pc-windows-msvc/release/horon-agent.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Built Windows binary failed to run --version'
          }

      - name: Run Windows installer lifecycle tests
        shell: pwsh
        run: |
          & ./scripts/install/test_install_windows_launcher.ps1
          & ./scripts/install/test_windows_setup.ps1

      - name: sccache stats
        # Runs even after a failed test so the cache state is in the log, and
        # only when the wrapper was enabled for this job.
        if: ${{ always() && env.RUSTC_WRAPPER == 'sccache' }}
        shell: pwsh
        run: sccache --show-stats

  fmt:
    name: Format
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned toolchain
        # `cargo fmt` runs under the toolchain rust-toolchain.toml pins. Installing
        # it here, with its listed components, replaces rustup's automatic install,
        # which prints a warning on first use.
        run: rustup toolchain install --profile minimal

      - name: Check module declarations resolve
        # A `mod x;` with no file makes rustfmt fail with "Error writing files:
        # failed to resolve mod", which reads like a formatting problem and hides
        # every gate behind it. Naming the real cause first (221159294).
        run: python3 scripts/ci/check_module_files.py

      - name: Check formatting
        run: bash scripts/ci/check_format.sh

  typescript-sdk:
    name: TypeScript SDK
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `scripts/sdk/test_package.sh` packs and installs the tarball with npm,
      # so the npm major decides what a consumer receives. Pin Node instead of
      # inheriting whatever the image ships that week.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      # The SDK mirrors crates/harness-api by hand. Without this job the
      # only guard that runs on a change is the Rust-side variant check, and a
      # typo in the TypeScript itself (or a broken client) reaches consumers.
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: packages/sdk/typescript

      - name: Typecheck, build, and test
        run: bun run check
        working-directory: packages/sdk/typescript

      # `npm run check` proves the source compiles; it says nothing about what
      # a consumer actually receives. The published tarball is a separate
      # artifact (`files`, `exports`, `prepack`), and getting it wrong ships a
      # package that installs but cannot be imported. Install it as a real
      # dependency and import it the way a consumer would.
      - name: Published tarball installs and imports
        run: bash scripts/sdk/test_package.sh

  python-sdk:
    name: Python SDK (${{ matrix.python }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the newest stable one.
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: packages/sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}

      # Like the TypeScript job: the SDK mirrors crates/harness-api by hand,
      # and the Rust-side parity test only proves the method names exist.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

  docs-site:
    name: Documentation Site
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # `packages/docs-site` is the Mintlify project served at agent.horon.ai.
    # Mintlify deploys it from the `deploy/docs` branch, which only
    # `docs-site-deploy.yml` moves (from `main`), so this job deploys nothing:
    # it fails when the project no longer validates, contains a broken internal
    # link, or when its Reference pages are stale against `docs/`
    # (`scripts/ci/sync_docs_site.py --check`).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reference pages are current
        run: |
          python3 -m unittest -v scripts/ci/test_sync_docs_site.py
          python3 scripts/ci/sync_docs_site.py --check

      # The Mintlify CLI (`mint`) runs on Node; pin it instead of inheriting the
      # image's version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: packages/docs-site

      - name: Validate and check links
        run: bun run check
        working-directory: packages/docs-site

  setup-friction:
    name: Setup Friction Eval (Linux installer)
    needs: changes
    runs-on: ubuntu-24.04
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install probe shells
        run: sudo apt-get update && sudo apt-get install -y fish zsh

      - name: Installer conversion telemetry tests
        run: bash scripts/install/test_install.sh

      - name: Setup friction scorecard
        run: bash scripts/install/eval_setup_friction.sh

  powershell-syntax:
    name: PowerShell Syntax
    needs: changes
    runs-on: windows-latest
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check PowerShell script syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          & ./scripts/ci/check_powershell.ps1

      - name: Check PowerShell script syntax (PowerShell 7)
        shell: pwsh
        run: |
          & ./scripts/ci/check_powershell.ps1

  windows-arm64-check:
    name: Windows ARM64 Release Configuration
    needs: changes
    runs-on: windows-latest
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 30
    env:
      # `dtolnay/rust-toolchain` installs components into the `stable` toolchain
      # by name, while anything run inside the checkout resolves the repository's
      # rust-toolchain.toml pin to a separate toolchain directory. Without this,
      # the aarch64 target is installed for a toolchain the build never uses and
      # `justrust check` fails with "target may not be installed". Same cure as
      # the `build` job.
      RUSTUP_TOOLCHAIN: stable
      # Native Windows hosted routing is unsupported. Keep execution on the
      # runner and bypass alpha.17's sampler until a fixed client is validated.
      JUSTRUST_TOOLCHAIN: system
      JUSTRUST_SLOTS: "0"
      JUSTRUST_NO_TELEMETRY: "1"
      JUSTRUST_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/msvc-dev-cmd
        with:
          arch: amd64_arm64

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          key: windows-arm64-release-check
          cache-all-crates: "true"

      - name: Install pinned justrust
        shell: bash
        env:
          # Only for the release API fallback when the download URL fails.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/install_justrust.sh

      - name: Check full Windows ARM64 release configuration
        shell: pwsh
        # Unlike the advisory Linux cross-check, this uses the native MSVC
        # toolchain and the release feature graph, including the companion.
        run: |
          & justrust check --local --locked -p horon-agent --bins --target aarch64-pc-windows-msvc --no-default-features --features pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-cross-check:
    name: Windows Cross-Target Check (Linux)
    needs: changes
    runs-on: ubuntu-24.04
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 30
    env:
      # The two Windows targets are installed into `stable`; the same pin makes
      # `cargo xwin` resolve that toolchain instead of rust-toolchain.toml's.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Free disk space
        # cargo-xwin unpacks the Windows SDK and CRT into the target dir on top
        # of a workspace build; the hosted image's 14 GB is not enough with the
        # pre-installed toolchains still there. The shared script sits in the
        # repository, so it runs after checkout and deletes in the background
        # (#21).
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        shell: bash
        run: bash scripts/ci/free_disk_space.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          key: windows-cross-check
          cache-all-crates: "true"

      - name: Install LLVM toolchain for cargo-xwin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm ninja-build

      - name: Install cargo-xwin
        # Pre-built release binary; building it from the git source cost several
        # minutes on every run.
        uses: taiki-e/install-action@c5695724643db014337e10f479712023ee658d78 # cargo-xwin
        with:
          tool: cargo-xwin

      - name: Resolve cargo-xwin version and cache directory
        # XWIN_CACHE_DIR is the environment form of `--xwin-cache-dir`, "xwin
        # cache directory to put CRT and SDK files" (cargo-xwin README, option
        # table). The download is the bulk of this job's 14.5 minutes in run
        # 42373575639. The directory sits outside the checkout and `target/`, so
        # Swatinem/rust-cache does not store it, and it is resolved to an
        # absolute path without `..` here: actions/cache rejects `..` in `path`
        # and skipped the save in run 42387478682.
        id: xwin
        shell: bash
        run: |
          version=$(cargo xwin --version | head -n1 | tr -d '\n' | tr -c 'A-Za-z0-9._-' '-')
          dir="$HOME/.cache/cargo-xwin"
          mkdir -p "$dir"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "XWIN_CACHE_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        # The CRT and SDK archives are the 14.5 minutes of run 42373575639. The
        # key carries the cargo-xwin version and both cross targets because the
        # cached files are version-pinned and target-pinned.
        with:
          path: ${{ steps.xwin.outputs.dir }}
          key: cargo-xwin-${{ runner.os }}-${{ steps.xwin.outputs.version }}-x86_64-pc-windows-msvc-aarch64-pc-windows-msvc

      # Only x64 is cross-checked here. The Windows ARM64 target is checked
      # natively by "Windows ARM64 Release Configuration": a cross-check of it
      # failed on every run because cargo-xwin feeds clang-style ring builds MSVC
      # /imsvc flags, and an advisory step that always fails only adds warnings.
      - name: Check Windows x64 target
        shell: bash
        run: |
          cargo xwin check --locked --target x86_64-pc-windows-msvc
          # Shows the CRT and SDK landed in the cached directory.
          du -sh "$XWIN_CACHE_DIR"

  # Documentation-only pull requests and `dev` pushes run this instead of the
  # code gates.
  docs:
    name: Documentation Checks
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check relative links and UTF-8
        run: python3 scripts/ci/check_docs_links.py

      - name: Check English/Korean documentation pairs
        # Present once the bilingual documentation lands; until then there is no
        # pair set to check.
        if: ${{ !cancelled() && hashFiles('scripts/ci/check_docs_pairs.py') != '' }}
        run: python3 scripts/ci/check_docs_pairs.py

      - name: Documentation pair gate unit tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest -v scripts/ci/test_check_docs_pairs.py

      # `@horon-ai/horon`, `@horon-ai/agent-sdk` and `horon-agent-sdk` are not
      # published, so a doc that offers the install command sends the reader to a
      # launcher with no runtime behind it or to a 404. The gate fails the
      # install command's section unless it says the package is unpublished.
      - name: Unpublished install claims
        if: ${{ !cancelled() }}
        run: python3 -m unittest -v scripts/ci/test_docs_install_claims.py

      - name: Documentation benchmark block contract
        if: ${{ !cancelled() }}
        run: python3 -m unittest -v scripts/perf/test_bench_docs.py

      # The record charts above the generated block are committed files, so
      # nothing else would notice a table edit that left its chart behind.
      - name: Documentation record charts
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest -v scripts/perf/test_record_charts.py
          python3 scripts/perf/record_charts.py --check

  # `docs/` and README.md are compiled into the binary (crates/app-core/build.rs)
  # and the `horon_agent_docs` tests read them, so a documentation-only change
  # still proves the corpus builds and those tests pass, without the release
  # build, the cross-platform matrix or the structural performance run.
  docs-corpus:
    name: Documentation Corpus Test
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Free disk space
        if: ${{ !cancelled() && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: bash scripts/ci/free_disk_space.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ubuntu-latest-stablepin
          save-if: false

      - name: Run the embedded documentation tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p horon-agent-app-core --lib horon_agent_docs 2>&1 | tee "$RUNNER_TEMP/docs-corpus.log"
          # A filter that matches nothing reports a green "0 passed".
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/docs-corpus.log"

  workflow-lint:
    name: Workflow Lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image's preinstalled Go can be older than actionlint's go.mod
      # requirement, and the automatic toolchain switch then fails on a
      # toolchain version the module proxy does not serve. Pin Go here and keep
      # it from fetching another toolchain so the job depends only on these pins.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Run actionlint
        # Pinned to a release; actionlint also runs the preinstalled shellcheck
        # over every `run:` script. Zero findings is the standing requirement.
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  # The one check a branch rule needs. Gates that a documentation-only pull
  # request or `dev` push skips by design stay "skipped" and would leave a
  # required check pending; this job always finishes and fails only when a gate
  # failed, was cancelled, or the path classification broke or came back empty.
  ci-required:
    name: CI Required
    if: ${{ always() }}
    needs:
      - changes
      - quality
      - release-automation
      - build
      - windows-build-test
      - fmt
      - typescript-sdk
      - python-sdk
      - docs-site
      - setup-friction
      - powershell-syntax
      - windows-arm64-check
      - windows-cross-check
      - docs
      - docs-corpus
      - workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate that ran to have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          if [ "$(echo "$NEEDS" | jq -r '.changes.result')" != success ]; then
            echo "::error::path classification did not succeed"
            exit 1
          fi
          code="$(echo "$NEEDS" | jq -r '.changes.outputs.code // ""')"
          docs_only="$(echo "$NEEDS" | jq -r '.changes.outputs.docs_only // ""')"
          if [ "$code" != true ] && [ "$code" != false ]; then
            echo "::error::Changed Paths gave code='$code'; expected true or false"
            exit 1
          fi
          if [ "$code" != true ] && [ "$docs_only" != true ]; then
            echo "::error::Changed Paths skipped the code gates without a documentation-only result"
            exit 1
          fi
          failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$failed" ]; then
            echo "::error::failed or cancelled: $failed"
            exit 1
          fi
