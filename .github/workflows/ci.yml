name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  # A push run on the commit a release tag will point at is the evidence
  # `scripts/release/check_ci.py` requires; after a cancelled or flaky run, re-run
  # that push run so the retry keeps the same commit and event. A manual dispatch
  # runs the same gates on any ref for diagnosis, but it is never accepted as that
  # evidence.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer run on the same ref cancels the older one everywhere except `main`: a
  # push run on `main` is release evidence, so a running one is never cancelled
  # (GitHub can still replace a run that is only pending with a newer one). On
  # `dev` a push and a manual dispatch share the group and cancel each other; a
  # cancelled `dev` push run is recovered with `Re-run all jobs` on that run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only for every job here: the workflow builds, tests, and uploads
# artifacts, and never writes to the repository. Jobs that need more grant it
# themselves.
permissions:
  contents: read

env:
  # `actions/checkout` runs `git init` on a fresh runner and git prints a hint
  # about the default branch name. Naming it removes the cause of the message.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  HORON_AGENT_CI: "1"
  # CI builds without the local parallel-frontend rustc wrapper from
  # .cargo/config.toml (a POSIX shell script; see scripts/dev/rustc_parallel_frontend).
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  # Registry and toolchain downloads are the usual source of a one-off red run.
  # Cargo and rustup retry them on their own when asked to.
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # A rustc or build-script warning in a workspace crate fails the build. CI must
  # show zero warnings (AGENTS.md, "CI warnings"); this keeps a new one from
  # merging. Warnings in registry dependencies are never reported by cargo.
  CARGO_BUILD_WARNINGS: deny
  SCCACHE_GHA_ENABLED: "true"
  # Test and dev builds do not need debug info, and on a hosted runner every byte
  # is disk. The workspace profiles already set debug = 0; these make that hold
  # for member crates that might override the profile.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# Runner selection. With the repository variable `CI_SELF_HOSTED` set to `true`,
# the jobs that can run on macOS go to the self-hosted runner labelled
# `horon-agent`, and the Linux-only and Windows-only jobs are skipped (shown as
# skipped, never as passed). Unset the variable to return to GitHub-hosted
# runners; nothing else changes.
#
# This repository is public, so a pull request from a fork is untrusted: its
# workflow file and every script it runs come from the fork, not from `main`.
# The self-hosted runner is a persistent machine, never a disposable VM, so fork
# code must not run on it. Every self-hosted branch therefore requires either a
# non-PR event or a PR whose head repository is this repository, and falls back
# to `ubuntu-24.04` otherwise. The GitHub-hosted-only jobs use the negated
# condition so a fork PR still gets them.
jobs:
  # Decides which gates a change needs. A pull request is compared with its
  # base; a first-attempt push to `dev` with the head of the last successful
  # `dev` push run of this workflow (needs `actions: read`). A push to `main`, a
  # dispatch, a re-run of a `dev` push, a head already in `origin/main` and every
  # lookup or diff failure run everything: the release gate accepts only a fully
  # successful push run (scripts/release/check_ci.py).
  changes:
    name: Changed Paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The three-dot diff needs the merge base, which a shallow clone lacks.
          fetch-depth: 0

      - name: Classifier contract test
        run: python3 -m unittest -v scripts/ci/test_classify_changes.py

      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/classify_changes.py --workflow ci.yml --base "$BASE_SHA" --head "$HEAD_SHA"
  quality:
    name: Quality Guardrails
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","horon-agent"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      # Run after checkout because the cleanup lives in the repository now: the
      # shared script is not on disk until the workspace exists. It renames the
      # unused toolchains and returns before the deletion, which continues in
      # the background while the toolchain installs (#21).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Free disk space
        # A hosted ubuntu runner has about 14 GB free on `/`, and a cold
        # all-targets/all-features build does not fit. The pre-installed
        # toolchains are unused here. Skipped on the self-hosted machine, whose
        # toolchains belong to its owner.
        if: ${{ !cancelled() && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: bash scripts/ci/free_disk_space.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          # A later step failing (an advisory, a flaky test) must not throw away
          # the artifacts the earlier steps spent minutes compiling.
          cache-on-failure: true
          # Keyed by runner OS: with CI_SELF_HOSTED this job runs on macOS, and a
          # macOS cache restored on Linux (same branch) carries unusable artifacts.
          key: quality-${{ runner.os }}
          cache-all-crates: "true"

      - name: Check module declarations resolve
        # A `mod x;` with no file makes rustfmt fail with "Error writing files:
        # failed to resolve mod", which reads like a formatting problem and hides
        # every gate behind it. Naming the real cause first (221159294).
        run: python3 scripts/ci/check_module_files.py

      - name: Check English/Korean documentation pairs
        # Every README and docs/ page has an English X.md and a Korean X.ko.md
        # with the same structure, valid relative links and a language switch.
        # Python standard library only; takes well under a second.
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check_docs_pairs.py

      # sccache is enabled once for the whole job and never for a single step:
      # a run that wrapped only one cargo invocation produced
      # `<unknown rustc version>` artifacts that the next unwrapped invocation
      # rejected with E0514 ("compiled by an incompatible version of rustc",
      # run 42373575639). One wrapper for every cargo call keeps the
      # fingerprints equal.
      #
      # CARGO_INCREMENTAL=0 is required, not an optimization: sccache cannot
      # cache incremental units, and the profiles this job builds
      # ([profile.dev] and [profile.release] in Cargo.toml) set incremental =
      # true, so with incremental on nothing is ever cached.
      #
      # Hosted runners only: the self-hosted runner is a persistent machine
      # whose toolchains and caches belong to its owner, and a pull request
      # from a fork must not install or start a cache there. This step is one
      # of the quality gates, so it must keep reporting failures: no
      # continue-on-error below.
      - name: Setup sccache
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          disable_annotations: true

      - name: Enable sccache
        # Only a successful `sccache --start-server` writes the wrapper, so a
        # runner without a usable sccache builds the whole job unwrapped instead
        # of mixing wrapped and unwrapped cargo calls.
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "sccache is not available; this job builds without a wrapper"
            exit 0
          fi
          if sccache --start-server; then
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "CARGO_INCREMENTAL=0"
            } >> "$GITHUB_ENV"
          else
            echo "sccache failed to start; this job builds without a wrapper"
          fi

      - name: Check formatting
        # These gates are independent. Report every failure in one run instead
        # of letting a Clippy error hide stale lockfiles or budget violations.
        # No continue-on-error: any failed check still fails the quality job.
        if: ${{ !cancelled() }}
        run: bash scripts/ci/check_format.sh

      - name: Run clippy with warnings denied
        # Clippy compiles every target and feature that `cargo check` would, so
        # this single step covers both and halves the all-features artifacts a
        # hosted runner has to hold.
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run clippy on horon-tui
        # A separate `-p` selection, not `--workspace`: this is the one package
        # the guardrail job would otherwise miss, because a bare `cargo clippy`
        # at the root selects only the root package. It also keeps the terminal
        # stack out of the root package's all-features build.
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets --all-features -p horon-tui -- -D warnings

      - name: Enforce Cargo.lock is up to date
        if: ${{ !cancelled() }}
        shell: bash
        # Adding a dependency without regenerating Cargo.lock breaks every
        # `--locked` build. Only the Windows jobs pass `--locked`, so such a
        # commit passes 8 of 9 CI jobs and fails Windows at "Build release
        # binary", skipping all of its validation steps. This catches it in
        # seconds, on the job that already owns dependency hygiene.
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          git diff --exit-code -- Cargo.lock

      - name: Warning budget gate contract tests
        if: ${{ !cancelled() }}
        shell: bash
        run: scripts/ci/test_check_warnings.sh

      - name: Benchmark script gate
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 -m unittest -v scripts/perf/test_bench.py scripts/perf/test_ab_perf.py scripts/perf/test_analyze_memory_log.py scripts/perf/test_bench_suites.py scripts/perf/test_mock_llm_server.py scripts/perf/test_bench_compare.py scripts/perf/test_install_competitors.py scripts/perf/test_bench_docs.py scripts/perf/test_bench_tui.py scripts/perf/test_bench_common_platform.py

      - name: npm CLI package gate
        # The npm distribution is generated, so its shape is only real when
        # something builds it: the script assembles the six platform packages
        # from fake archives, one per archive shape (linux wrapper + payload,
        # single-file, Windows .exe), and the launcher test covers argument and
        # environment hand-off plus the two failure messages. Node ships with
        # the hosted runner image; no setup step is needed for one test file.
        #
        # The TypeScript SDK is released at the same tag version as the CLI, so
        # its committed version and six runtime pins must equal the root
        # Cargo.toml version. The publish workflow stamps the tag version into
        # its checkout; this is the check that keeps the tracked file honest.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bash scripts/npm/test_prepare_cli_packages.sh
          node --test npm/horon/test/launcher.test.mjs
          python3 -m unittest -v scripts/npm/test_release_npm_version.py
          python3 -m unittest -v scripts/sdk/test_sdk_release.py
          python3 scripts/sdk/sdk_release.py check-committed

      - name: Enforce warning budget
        if: ${{ !cancelled() }}
        shell: bash
        run: scripts/ci/check_warnings.sh

      - name: Enforce oversized-file ratchet
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/ci/check_code_size.py

      - name: Enforce oversized-test ratchet
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/ci/check_test_size.py

      - name: Enforce panic-prone usage ratchet
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/ci/check_panics.py

      - name: Enforce swallowed-error usage ratchet
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/ci/check_swallowed_errors.py

      - name: Growth ratchet contract tests
        # The gate discovers its own ceiling files by shape, so a new ratchet
        # (the `Result<_, String>` count of #156, model names) needs no step
        # here. These tests are what keeps that discovery honest.
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 -m unittest -v scripts/ci/test_check_growth_ratchets.py

      - name: Enforce growth ratchets
        # Cargo.lock package count and internal legacy markers: both may fall
        # but not rise. Ceilings live in `scripts/ci/*.json` objects that
        # declare `counter` and `ceiling`; adding one needs no edit here.
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/ci/check_growth_ratchets.py

      - name: Enforce crate dependency boundaries
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/ci/check_dependency_boundaries.py

      - name: Enforce headless dependency graph
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/ci/check_headless_graph.py

      - name: Headless graph gate contract tests
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 -m unittest -v scripts/ci/test_check_headless_graph.py

      - name: Test runner contract tests
        # The cohort steps trust `run_lib_tests.py` to turn a libtest run that
        # matched nothing into a failure; `--min-passed` is that behaviour, and
        # this is where it is proved rather than assumed.
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 -m unittest -v scripts/ci/test_run_lib_tests.py

      - name: Enforce Rust and TypeScript SDK surface parity
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked -p horon-agent-sdk parity -- --nocapture

      - name: Enforce wildcard re-export ratchet
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/ci/check_wildcard_reexports.py

      - name: Platform cfg gate contract tests
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 -m unittest -v scripts/ci/test_check_platform_cfg.py

      - name: Enforce platform cfg allowlist
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/ci/check_platform_cfg.py

      - name: Install cargo-machete
        # The crate is published as a binary; building it from source on every
        # run costs minutes and hundreds of MB on a job that already has the
        # largest build. install-action downloads the release binary instead.
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@c5695724643db014337e10f479712023ee658d78 # cargo-machete
        with:
          tool: cargo-machete

      - name: Enforce no unused dependencies
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo machete

      - name: sccache stats
        # Printed only when the wrapper was actually enabled, so a run that
        # built without sccache does not report misleading numbers. The
        # condition starts with `!cancelled()` like every other quality step:
        # a cancelled run should stop, and this is diagnostic output, not a
        # gate.
        if: ${{ !cancelled() && env.RUSTC_WRAPPER == 'sccache' }}
        shell: bash
        run: sccache --show-stats

  release-automation:
    name: Release Automation
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","horon-agent"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test justrust release installation and routing
        run: |
          python3 tests/test_ci_workflow_guards.py
          python3 tests/test_install_justrust_ci.py
          python3 tests/test_public_release_builds.py
          python3 tests/test_release_ci.py
          python3 scripts/release/test_release.py
          python3 scripts/release/test_auto_release.py
          python3 tests/test_verify_public_release.py
          python3 tests/test_watch_release_run.py
          bash -n scripts/ci/install_justrust.sh scripts/release/build_linux_compat.sh scripts/release/release.sh

  build:
    name: Build & Test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","horon-agent"]') || matrix.runner }}
    # 35 minutes covers a normal push (~12 min with a warm Swatinem cache) but
    # not a *rerun*, where the cache is cold: three consecutive reruns of a
    # known-good commit were cancelled at the cap, each getting further through
    # the same green steps (#693). A rerun is exactly what you reach for after a
    # concurrency cancellation, so the old cap made healthy commits look red.
    # A hosted 4 vCPU runner with no cache at all needs more still: this job
    # builds release, test, and e2e artifacts from scratch in one target dir.
    timeout-minutes: 60
    # Some dependencies (e.g. convert_case 0.10.0 via derive_more/crossterm, and
    # proc-macro2/quote) accidentally ship a `rust-toolchain.toml` *inside their
    # published crate*. When cargo builds such a crate its CWD is that crate dir,
    # so the rustup proxy honours the file: convert_case pins `channel = "1.83.0"`
    # and proc-macro2 requests `components = ["rust-src"]`. That made every
    # Build & Test job (a) race two parallel `rust-src` downloads and (b) later
    # try to compile convert_case with rustc 1.83.0, failing with E0514/E0599.
    # RUSTUP_TOOLCHAIN takes precedence over any rust-toolchain.toml override, so
    # pinning it here makes every step use this job's installed stable toolchain.
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        # Build & Test (ubuntu-latest) and Build & Test (macos-latest). The
        # matrix is one `include` list rather than `os` plus `include`, because
        # `include` re-adds any combination `exclude` removes; with
        # CI_SELF_HOSTED only the macOS entry exists. A fork PR falls back to
        # both GitHub-hosted entries for the same reason as `runs-on` above.
        # `os` stays the label in the job name, which scripts/release/check_ci.py
        # requires verbatim; `runner` is the pinned image the job runs on, so
        # the ubuntu-latest migration notice does not attach to the run.
        include: ${{ fromJSON(vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '[{"os":"macos-latest","runner":"macos-latest","target":"aarch64-apple-darwin"}]' || '[{"os":"ubuntu-latest","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","runner":"macos-latest","target":"aarch64-apple-darwin"}]') }}

    steps:
      # The Linux cleanup runs after checkout because it is the shared script in
      # the repository; it renames the unused toolchains and deletes them in the
      # background (#21).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Free disk space (Linux)
        # Hosted ubuntu starts with about 14 GB on `/`. One job holds the release
        # build, both test harnesses, and the e2e binaries in a single target
        # dir, so the pre-installed toolchains this job never uses are removed.
        # A self-hosted runner is macOS, so this never touches it.
        if: ${{ !cancelled() && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: bash scripts/ci/free_disk_space.sh

      - name: Free disk space (macOS)
        # The macOS hosted image has the least free space of the three. Skip on
        # the self-hosted machine: its caches and toolchains are its owner's.
        if: ${{ !cancelled() && runner.os == 'macOS' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          sudo rm -rf /Users/runner/Library/Android /usr/local/share/dotnet \
            "$HOME/Library/Caches/Homebrew"
          df -h /

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          # Pre-install rust-src in the (serial) toolchain step. Some build-script
          # / proc-macro units trigger an on-demand `rustup component add rust-src`,
          # and when several parallel cargo/rustc processes request it at once they
          # race on the shared `~/.rustup/downloads/*.partial` file and fail with
          # "could not rename ... No such file or directory". Fetching it once here
          # removes the race. (Was failing every Build & Test job.)
          components: rust-src${{ runner.os == 'macOS' && ', llvm-tools' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          # A later step failing (an advisory, a flaky test) must not throw away
          # the artifacts the earlier steps spent minutes compiling.
          cache-on-failure: true
          # Suffix bumped to evict caches that held 1.83.0 / <unknown rustc>
          # artifacts produced before RUSTUP_TOOLCHAIN=stable pinned the job.
          key: ${{ matrix.os }}-stablepin

      # The wrapper is set once for the whole job, before the first cargo call,
      # so every compile in this job (release build, test compile, e2e, the
      # SDK parity test and the macOS warning budget) shares one fingerprint.
      # A run that wrapped only one step emitted `<unknown rustc version>`
      # artifacts that the next unwrapped compile rejected with E0514,
      # "compiled by an incompatible version of rustc" (run 42373575639).
      #
      # CARGO_INCREMENTAL=0 is required: sccache cannot cache incremental
      # units and both profiles this job builds ([profile.dev] and
      # [profile.release]) set incremental = true in Cargo.toml, so leaving
      # incremental on would mean zero cache hits.
      #
      # Hosted runners only. The self-hosted runner is a persistent machine
      # whose caches belong to its owner, and a fork pull request must not
      # install or start a cache on it.
      - name: Setup sccache
        if: runner.environment == 'github-hosted'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          disable_annotations: true
        continue-on-error: true

      - name: Enable sccache
        # Nothing is written unless `sccache --start-server` succeeds, so a
        # runner without a working sccache builds the entire job without a
        # wrapper rather than mixing wrapped and unwrapped cargo calls.
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "sccache is not available; this job builds without a wrapper"
            exit 0
          fi
          if sccache --start-server; then
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "CARGO_INCREMENTAL=0"
            } >> "$GITHUB_ENV"
          else
            echo "sccache failed to start; this job builds without a wrapper"
          fi

      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: |
          # clang is the linker driver named in .cargo/config.toml below; the
          # image ships it, but not as a documented contract, so install it
          # explicitly rather than depending on an image update's default.
          # A mirror hiccup is the usual failure here, so retry before failing.
          installed=0
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq clang mold; then
              installed=1
              break
            fi
            sleep $((attempt * 10))
          done
          [ "$installed" = 1 ]

      - name: Build
        shell: bash
        run: |
          mkdir -p .cargo
          if [ "$RUNNER_OS" = "Linux" ]; then
            cat > .cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=mold"]
          EOF
          fi
          # The sccache wrapper is not set here: the job-wide `Enable sccache`
          # step above sets it for every cargo call, which is what keeps the
          # artifacts of this build and the later test compiles consistent.
          RUSTC="$(rustup which rustc)"
          export RUSTC
          CARGO_BIN="$(rustup which cargo)"
          "$CARGO_BIN" build --locked --release --target ${{ matrix.target }}
          # Separate invocation: `-p horon-tui` must not unify features with the
          # headless package. The headless graph gate proves the two never meet;
          # this proves the separate interactive binary actually links on this
          # target, which is the only place crossterm's platform backends are
          # exercised.
          "$CARGO_BIN" build --locked --target ${{ matrix.target }} -p horon-tui

      - name: TUI PTY smoke (Linux, macOS)
        # The bare command hands a terminal launch to the sibling `horon-tui`
        # binary, and nothing else in this workflow drives that handoff or the
        # terminal client's screen: the build above only proves the two binaries
        # link. This runs both through a real PTY against the mock model server
        # and checks the first screen, a streamed reply, the approval prompt, the
        # retried tool call, `/quit`, and the three headless fallbacks. The
        # client is built without `--release` above, next to the release daemon.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/test/tui_pty_smoke.py \
            --agent target/${{ matrix.target }}/release/horon-agent \
            --tui target/${{ matrix.target }}/debug/horon-tui \
            --transcript "$RUNNER_TEMP/tui-pty-transcript.txt"
          echo "--- transcript ---"
          cat "$RUNNER_TEMP/tui-pty-transcript.txt"

      - name: Installed layout TUI smoke
        # Release packaging runs only in the release workflow, after the change
        # is on `main`, so nothing on a pull request ever drove
        # `install-release --assets` or the layout it leaves behind. This
        # packages the binaries built above under the release asset names for
        # this platform, installs them into a throwaway HORON_HOME, and drives
        # the launcher symlink the terminal client starts from.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/test/install_release_layout_smoke.sh \
            "target/${{ matrix.target }}/release/horon-agent" \
            "target/${{ matrix.target }}/debug/horon-tui" \
            "$RUNNER_TEMP/installed-layout"
          python3 scripts/test/tui_pty_smoke.py \
            --layout installed \
            --layout-root "$RUNNER_TEMP/installed-layout/home" \
            --transcript "$RUNNER_TEMP/tui-installed-transcript.txt"
          echo "--- transcript ---"
          cat "$RUNNER_TEMP/tui-installed-transcript.txt"

      - name: Release rehearsal installs the optional client
        # The update path takes the same asset directory over HTTP, and the
        # client is optional there: a release that publishes it must install
        # both binaries with no client warning, and an older agent-only release
        # must still install with exactly one warning naming the missing asset.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/release/rehearse_update.py --headless-check --rate 0 --no-strip \
            --root "$RUNNER_TEMP/update-rehearsal-tui" \
            --binary "target/${{ matrix.target }}/release/horon-agent" \
            --tui-binary "target/${{ matrix.target }}/debug/horon-tui"
          python3 scripts/release/rehearse_update.py --headless-check --rate 0 --no-strip \
            --root "$RUNNER_TEMP/update-rehearsal-agent-only" \
            --binary "target/${{ matrix.target }}/release/horon-agent"

      - name: npm install smoke
        # The publish workflow is the only place the seven packages are built
        # from the real archives, and it cannot run before it is on `main`. This
        # installs the same two tarballs a user does, so an archive shape, a
        # bin layout or a launcher regression fails on the pull request.
        shell: bash
        run: |
          bash scripts/npm/smoke_npm_install.sh \
            "target/${{ matrix.target }}/release/horon-agent" \
            "target/${{ matrix.target }}/debug/horon-tui"

      - name: Benchmark script smoke
        # The benchmark workflow runs on demand and after a push to `main`, so
        # nothing on a pull request started the daemon-backed suites: a renamed
        # home variable broke three of them unnoticed. This runs tools, reload
        # and compare once each against the binary built above and reads their
        # reports, because a suite exits 0 even when its daemon never came up.
        # Timings are discarded.
        shell: bash
        run: python3 scripts/perf/bench_smoke.py --binary target/${{ matrix.target }}/release/horon-agent

      - name: Bare Linux runtime smoke (Linux)
        # A hosted ubuntu image ships libssl, a CA bundle, a TTY, and
        # XDG_RUNTIME_DIR, so a release binary that linked OpenSSL dynamically
        # (and could not load on a bare Debian server at all) passed every test
        # here. This runs the real binary in a Debian container with OpenSSL and
        # the CA store removed. Linux only: with CI_SELF_HOSTED the matrix keeps
        # just the macOS entry, and this guard is about the Linux artifact.
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/ci/check_linux_bare_runtime.sh target/${{ matrix.target }}/release/horon-agent

      - name: Compile library and binary tests
        shell: bash
        # One call compiles the lib and bin tests of every package the cohorts
        # below use. Selecting a different `-p` set per cohort unifies features
        # differently, so each of those calls recompiled dozens of workspace
        # crates (#19). `--message-format=json-render-diagnostics` keeps rendered
        # diagnostics on stderr and writes only JSON messages to stdout, which
        # records each test executable for the cohort steps. The cohort steps
        # run those executables instead of invoking cargo again (#19): a
        # per-cohort `cargo test -p <crate>` unifies features over only that
        # crate, so every workspace crate recompiles with a different
        # fingerprint. The artifacts file lives in `$RUNNER_TEMP`; the JSON is
        # build output, not a test result.
        run: |
          set -euo pipefail
          TEST_ARTIFACTS="$RUNNER_TEMP/test-artifacts.jsonl"
          echo "TEST_ARTIFACTS=$TEST_ARTIFACTS" >> "$GITHUB_ENV"
          packages=(-p horon-agent -p horon-agent-app-core -p horon-agent-base -p horon-agent-irc-core -p horon-agent-todo-policy -p horon-tui)
          if [ "$RUNNER_OS" = "Linux" ]; then
            packages+=(-p horon-agent-embedding)
          fi
          python3 .github/scripts/run_with_timeout.py 1800 \
            "$(rustup which cargo)" test --locked --target ${{ matrix.target }} \
            "${packages[@]}" --lib --bins --test e2e --no-run \
            --message-format=json-render-diagnostics \
            > "$TEST_ARTIFACTS"

      - name: Run horon-tui tests
        shell: bash
        # No filter: the whole crate is the surface under test. `--min-passed 1`
        # is the guard against a libtest run that silently matched nothing and
        # reported `0 passed` with exit 0.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-tui \
            --min-passed 1 --timeout 600

      - name: Run CLI handoff cohort
        shell: bash
        # The bare command's handoff decision is the only thing that sends a
        # terminal launch into `horon-tui`, and no other step runs `horon-agent`
        # lib tests at all, so a filter that matched nothing would look green.
        # `--min-passed 1` fails the step when the filter selects no test.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent \
            --timeout 600 --min-passed 1 \
            -- tui_handoff --nocapture

      - name: Run deterministic retention-readiness cohort
        shell: bash
        # The helper runs the already compiled lib test executable, so this
        # cohort cannot recompile anything; its budget only covers execution.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 \
            -- retention_readiness --nocapture

      - name: Run secrets cohort
        if: runner.os != 'Windows'
        shell: bash
        # The credential-masking tests live in `crates/base/src/secrets.rs`
        # `mod tests` (11 tests): placeholder shapes, restore, owner-only key
        # files, vault persistence across restarts, and the block/off modes.
        # Nothing else in this workflow runs them on Linux or macOS: the build
        # step compiles `horon-agent-base` lib tests but every other filtered
        # step only selects its own prefix, so a real credential reaching the
        # model or session history had no CI check. The step previously ran a
        # filter inherited from upstream CI that matched nothing in this tree,
        # the looks-green-but-never-ran shape the warning budget and the stdin
        # detector had (#651), so it now requires at least one pass
        # (`--min-passed 1`), which fails the step when a filter selects no
        # test instead of reporting a green `0 passed`. The Windows groups stay
        # out of scope: this step keeps `runner.os != 'Windows'`.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- secrets:: --nocapture

      - name: Run IRC cohorts
        shell: bash
        # Nothing else in this workflow runs `horon-agent-irc-core` tests: the
        # build step has no `--workspace`, and the `horon-agent-base` /
        # `horon-agent-app-core` IRC tests sit behind a filter no other step
        # uses. A filter that matches nothing makes libtest report "0 passed"
        # and exit 0, the looks-green-but-never-ran shape the warning budget and
        # the stdin detector both had, so each cohort must report at least one
        # pass (`--min-passed 1`).
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-irc-core \
            --timeout 600 --min-passed 1 \
            -- --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- irc --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- irc --nocapture

      - name: Run embedding numeric-stability cohort (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        # `minilm_embedding_is_numerically_stable_across_inference_engines` pins
        # the model's actual output, which is the only thing that can catch an
        # inference-engine upgrade silently changing embeddings: persisted
        # memories are keyed by model_id, which does not change across a tract
        # bump, so the stale-embedding filter cannot notice (#657).
        #
        # That test skips itself when the model is absent, and horon-agent-embedding
        # tests are not otherwise run here at all, so without this step it would
        # never execute. Fetch the model first (~87MB) so the cohort is real
        # rather than a silent skip.
        run: |
          set -euo pipefail
          model_dir="$HOME/.horon/models/all-MiniLM-L6-v2"
          mkdir -p "$model_dir"
          base="https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main"
          curl -sSfL --retry 5 --retry-all-errors -o "$model_dir/model.onnx" "$base/onnx/model.onnx"
          curl -sSfL --retry 5 --retry-all-errors -o "$model_dir/tokenizer.json" "$base/tokenizer.json"
          # Fail loudly if the fetch produced something unusable, so this cannot
          # degrade back into a silent skip.
          test -s "$model_dir/model.onnx"
          test -s "$model_dir/tokenizer.json"
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-embedding \
            --timeout 600 --log /tmp/embedding-cohort.log \
            -- --nocapture
          # The test is present and the harness ran it (rather than the binary
          # failing to build).
          grep -q "minilm_embedding_is_numerically_stable_across_inference_engines ... ok" \
            /tmp/embedding-cohort.log
          # This is the check that matters. A skipped test still reports "ok",
          # so the reported result alone cannot distinguish "verified" from
          # "silently did nothing"; only the skip message can.
          if grep -q "skip: MiniLM model not present" /tmp/embedding-cohort.log; then
            echo "::error::embedding cohort skipped despite fetching the model"
            exit 1
          fi

      - name: Run stdin-forwarding cohort (all platforms)
        shell: bash
        # These tests exercise the per-platform stdin detector, whose
        # implementations are entirely separate (`/proc/PID/syscall` on Linux,
        # `proc_pidinfo` + thread state on macOS). They were never gated: the
        # only `horon-agent-app-core --lib` run above is filtered to
        # `retention_readiness`, and the broader suite is Linux-only, so the
        # macOS detector had no coverage at all. `TH_STATE_WAITING` was defined
        # as 2 (`TH_STATE_STOPPED`) rather than 3, which silently disabled
        # macOS stdin forwarding entirely until #651.
        #
        # Deliberately not Linux-gated: running this on both Unix platforms is
        # the whole point. Windows is a separate job and is not covered here,
        # because these tests drive `head -n1`, which stock Windows does not
        # provide; the Windows detector still has no test coverage.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 \
            -- tool::bash::tests::test_stdin_forwarding --nocapture

      - name: Run skill_manage cohort
        shell: bash
        # The `horon-agent-app-core` lib suite only ever runs through filtered
        # cohorts in this workflow, so a new `skill_manage` action would compile
        # without its tests ever executing. `skill_delete` covers the
        # managed-only refusal with its source, the not-found answer, and the
        # symlink unlink that keeps its target; the symlink test is Unix-only,
        # which is why the floor is one pass rather than the full count.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- skill_delete --nocapture

      - name: Run context_import cohort
        shell: bash
        # `horon-agent-base` lib tests are compiled by the step above but only
        # executed by filtered cohorts, so the `@path` import expansion would
        # compile without a single test running. The 14 `context_import_*`
        # tests are platform-neutral (relative, absolute, `~/`, fenced-code and
        # hop-limit cases over temp directories), so the floor is the full
        # count rather than one: a filter that matches nothing would otherwise
        # report a green `0 passed`.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 14 \
            -- context_import --nocapture

      - name: Run todo blocked and write shebang cohort (todo blocked)
        shell: bash
        # Same gap as `skill_manage`: the `horon-agent-app-core` lib suite only
        # runs through filtered cohorts here, so the `blocked` todo status would
        # compile without its tests ever executing. `todo_blocked` covers the
        # blocker note being required, capped and dropped off a non-blocked item,
        # the note showing up in the tool result, the ACP plan downgrading the
        # item to pending, and a blocked list counting as unfinished.
        # `run_lib_tests.py` forwards its arguments to libtest, which accepts a
        # single filter, so this needs one step per filter.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- todo_blocked --nocapture

      - name: Run todo blocked and write shebang cohort (write shebang)
        shell: bash
        # `write_shebang` covers the execute bit a newly created `#!` file gets,
        # an overwrite keeping its mode, and a plain file keeping the default.
        # Those tests are Unix-only, hence the one-pass floor rather than the
        # full count.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- write_shebang --nocapture

      - name: Run todo blocked policy cohort
        shell: bash
        # The shared policy crate owns `is_incomplete_todo`, so its blocked test
        # is where "not done, not in progress" is pinned. It lives in a package
        # the compile step used to skip, which is why the compile and e2e `-p`
        # sets now name `horon-agent-todo-policy`.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-todo-policy \
            --timeout 600 --min-passed 1 \
            -- todo_blocked --nocapture

      - name: Run hooks cohort
        shell: bash
        # The `horon-agent-base` and `horon-agent-app-core` lib suites only run
        # through filtered cohorts here, so a lifecycle hook that compiles is
        # not a hook that was tested. `hooks::pre_request::tests` covers the
        # request rewrite (replacement, empty stdout, fail-open, system-prompt
        # refusal, chained commands, stdin payload, recursion guard) and
        # `hooks::post_tool_feedback::tests` covers the feedback envelope and
        # the text it appends. The hook cases write small /bin/sh scripts, so
        # each filter carries `--min-passed 1` while still reporting a pass on
        # Windows, where only the platform-neutral cases run.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- hooks::pre_request::tests --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- hooks::post_tool_feedback::tests --nocapture

      - name: Run hooks cohort (Unix)
        if: runner.os != 'Windows'
        shell: bash
        # The end-to-end hook cases run a real hook script, which these tests
        # write with /bin/sh, so they are Unix-only: a turn whose request the
        # hook rewrote while the stored transcript stayed put, the same request
        # left byte-identical by an empty or failing hook, and the structural
        # probe behind the `hooks` section of the perf gate.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- agent::request_messages::tests --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- agent::post_tool_feedback_replace_tests --nocapture

      - name: Run memory record cohort
        shell: bash
        # `memory` update and `read memory://` both live in the
        # `horon-agent-app-core` lib suite, which this workflow only ever runs
        # through filtered cohorts. Without a step naming their prefixes the
        # tests would compile and never execute, so each filter must report at
        # least one pass (`--min-passed 1`): `memory_update` covers the in-place
        # update (id, links and created_at kept, secret redaction, unknown id,
        # empty update refused) and `memory_url` covers the full-record read,
        # the newest-first listing, not-found and out-of-scope refusal.
        # `run_lib_tests.py` forwards its arguments to libtest, which accepts a
        # single filter, so each filter needs its own call. The store-side
        # helpers (tag normalization, the one-line preview) sit in the
        # `horon-agent-base` suite.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- memory_update --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- memory_url --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- memory_update --nocapture

      - name: Run bg wait sources cohort
        shell: bash
        # `bg action=wait` gained two event sources, child agents and queued
        # peer messages, and their tests live in the `horon-agent-app-core` lib
        # suite, which this workflow only runs through filtered cohorts. The
        # filter `wait_tool_` names all six, so a change that quietly stops
        # running them fails on the pass count instead of passing vacuously.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 6 \
            -- wait_tool_ --nocapture

      - name: Run session durability cohort
        shell: bash
        # The fsync reductions change which originals a session flushes, and
        # none of the session or runtime-journal tests ran in this workflow
        # before. `durable_runtime::` covers the runtime journal, including the
        # entry flush of every directory level an open creates (the record of
        # a confirmed journal must survive a power loss with its directory);
        # `session::session_tests::` covers the event store and its local head
        # files (no explicit-head flag for a session that never selected one);
        # `session_replication` covers what a replica reads from those files.
        # `session::tests::durability::` covers the close at the end of a run
        # publishing only the runtime binding, with nothing appended to the log.
        # The other `session` modules are left out: two of their tests fail on
        # `dev` itself and are outside this change.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- durable_runtime:: --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- session::session_tests:: --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- session::tests::durability:: --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- session_replication --nocapture

      - name: Run session id prefix cohort
        shell: bash
        # Both suites only run through filters, so a prefix resolver that
        # compiles would ship untested: `horon-agent-base` and
        # `horon-agent-app-core` lib tests are never run whole here. The base
        # half covers the matcher itself (exact id wins, duplicates do not
        # ambiguate, ten-candidate cap, a five-character match refused);
        # the app-core half covers the Subscribe path that resolves a stored
        # or live session, and the refusals an operator sees.
        run: |
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-base \
            --timeout 600 --min-passed 1 \
            -- session_prefix:: --nocapture
          python3 scripts/ci/run_lib_tests.py \
            --artifacts "$TEST_ARTIFACTS" --package horon-agent-app-core \
            --timeout 600 --min-passed 1 \
            -- subscribe_prefix --nocapture

      - name: Run e2e tests
        shell: bash
        # Same `-p` set and target as the compile step so cargo reuses the
        # already built e2e binary instead of rebuilding the selection set.
        run: |
          # e2e is fast (~1-2 min of execution); the generous budget only guards
          # against an occasional slow hosted runner. Compilation is already done
          # in the dedicated compile step above.
          set -euo pipefail
          packages=(-p horon-agent -p horon-agent-app-core -p horon-agent-base -p horon-agent-irc-core -p horon-agent-todo-policy)
          if [ "$RUNNER_OS" = "Linux" ]; then
            packages+=(-p horon-agent-embedding)
          fi
          python3 .github/scripts/run_with_timeout.py 600 \
            "$(rustup which cargo)" test --locked --target ${{ matrix.target }} \
            "${packages[@]}" --test e2e

      # macOS only: the quality job already runs the same gate on Linux, and a
      # second whole-workspace `cargo check` on the ubuntu matrix entry is a
      # second full compile of a release build that is already on disk. macOS is
      # the only place this gate sees Apple-specific warnings. Windows still has
      # its own cfg-gated surface and is not yet warning-clean, so it stays out
      # (#1177).
      - name: Enforce warning budget (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/ci/check_warnings.sh

      - name: Install cargo-audit
        if: runner.os == 'Linux'
        # Pre-built binary: building cargo-audit from source costs 5-10 minutes
        # on a job that already has a full target dir.
        uses: taiki-e/install-action@c5695724643db014337e10f479712023ee658d78 # cargo-audit
        with:
          tool: cargo-audit

      - name: Security preflight (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/ci/check_security.sh --strict

      - name: sccache stats
        # Runs even after a failed gate so the cache state is visible in the
        # log, but only when the wrapper was really enabled.
        if: ${{ always() && env.RUSTC_WRAPPER == 'sccache' }}
        shell: bash
        run: sccache --show-stats

  windows-build-test:
    name: Build & Test (windows-latest)
    needs: changes
    runs-on: windows-latest
    if: ${{ needs.changes.outputs.code == 'true' && !(vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    timeout-minutes: 75
    steps:
      - name: Report free disk space
        # D: carries the workspace and target dir on the Windows image. Logged,
        # not gated: the image has room, but a target dir of this size makes the
        # number worth having when a run fails.
        shell: pwsh
        run: Get-PSDrive D | Format-Table -AutoSize

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/msvc-dev-cmd
        with:
          arch: amd64

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Job-wide, before the first cargo call: a wrapper applied to one step
      # only left `<unknown rustc version>` artifacts that the next unwrapped
      # compile rejected with E0514 ("compiled by an incompatible version of
      # rustc", run 42373575639). Every cargo call in this job must share the
      # same wrapper.
      #
      # CARGO_INCREMENTAL=0 is required, not a speed tweak: sccache cannot
      # cache incremental units, and both [profile.dev] and [profile.release]
      # in Cargo.toml set incremental = true, so nothing would be cached.
      #
      # This job runs on a GitHub-hosted Windows image only; the guard keeps
      # the step out of any other environment.
      - name: Setup sccache
        if: runner.environment == 'github-hosted'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          disable_annotations: true
        continue-on-error: true

      - name: Enable sccache
        # The wrapper is written only when the server actually starts, so a
        # runner without a working sccache runs every cargo call unwrapped
        # instead of mixing wrapped and unwrapped builds.
        if: runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) {
            Write-Host 'sccache is not available; this job builds without a wrapper'
            exit 0
          }
          sccache --start-server
          if ($LASTEXITCODE -eq 0) {
            "RUSTC_WRAPPER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CARGO_INCREMENTAL=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host 'sccache failed to start; this job builds without a wrapper'
          }

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          # A later step failing (an advisory, a flaky test) must not throw away
          # the artifacts the earlier steps spent minutes compiling.
          cache-on-failure: true
          key: windows-latest
          cache-all-crates: "true"

      - name: Build release binary
        shell: pwsh
        run: |
          & cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows release build failed'
          }

      - name: Build horon-tui binary
        shell: pwsh
        # A separate package from the headless binary on purpose: the graph gate
        # forbids any path from `horon-agent` to a terminal library, so the two
        # are built by separate cargo invocations.
        run: |
          & cargo build --locked --target x86_64-pc-windows-msvc -p horon-tui
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows horon-tui build failed'
          }

      - name: npm install smoke
        # The Windows archive is the one shape the other two jobs never produce:
        # a `.exe` entry with no shell wrapper, which `npm install -g` shims as
        # a `.cmd`. Git Bash runs the script so it shares one implementation
        # with the Linux and macOS jobs.
        shell: bash
        run: |
          bash scripts/npm/smoke_npm_install.sh \
            target/x86_64-pc-windows-msvc/release/horon-agent.exe \
            target/x86_64-pc-windows-msvc/debug/horon-tui.exe

      - name: Compile library and binary tests
        shell: pwsh
        run: |
          & cargo test --locked --target x86_64-pc-windows-msvc --lib --bins --no-run
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows library/binary test compilation failed'
          }

      - name: Run horon-tui tests
        shell: pwsh
        # No filter: the whole crate runs. The Linux and macOS jobs additionally
        # go through `run_lib_tests.py --min-passed 1`, which is what catches a
        # libtest run that matched nothing; here the count is read back from the
        # run so a silently empty executable still fails.
        run: |
          # The compile runs under the timeout wrapper: it is the expensive part
          # of this step, and an unwrapped hang would sit here until the job
          # limit. Afterwards the executable exists, so the `--list` call below
          # only starts it and is safe to run outside the wrapper.
          & ./scripts/ci/cargo_with_timeout.ps1 `
            -Name 'compile horon-tui tests' `
            -TimeoutSeconds 600 `
            -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '-p', 'horon-tui', '--lib', '--no-run')
          # The timeout helper launches cargo as a child process, so its output
          # never reaches a captured variable. The count therefore comes from a
          # separate `--list` invocation of the same already-compiled test
          # binary, and the run itself is only checked for its exit code.
          $list = & cargo test --locked --target x86_64-pc-windows-msvc -p horon-tui --lib -- --list 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw 'could not list horon-tui tests'
          }
          $compiled = ($list | Select-String -Pattern ': test$').Count
          if ($compiled -lt 1) {
            throw 'horon-tui compiled no tests'
          }
          Write-Host "horon-tui tests compiled: $compiled"
          & ./scripts/ci/cargo_with_timeout.ps1 `
            -Name 'horon-tui tests' `
            -TimeoutSeconds 600 `
            -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '-p', 'horon-tui', '--lib')

      - name: Run targeted Windows validation tests
        shell: pwsh
        run: |
          # Each test lives in a specific crate, so every group names its
          # package. A filter that matches nothing makes libtest report
          # "0 passed" and exit 0, so each name is checked against the crate's
          # test list before the run and a missing name fails the step.
          $groups = [ordered]@{
            'horon-agent-platform-windows' = @(
              'is_process_running_reports_exited_children_as_stopped',
              'spawn_replacement_process_returns_without_waiting_for_child_exit',
              'pipe_name_is_stable_and_normalizes_case_and_separators',
              'pipe_name_falls_back_when_stem_is_empty',
              'busy_pipe_is_reported_as_a_live_socket_path',
              'stream_pair_round_trips_bytes',
              'split_stream_supports_concurrent_read_and_write',
              'directory_sync_is_not_effective_on_windows'
            )
            'horon-agent-app-core' = @(
              'sibling_socket_path_roundtrip',
              'cleanup_socket_pair_removes_main_and_debug_files',
              'build_shell_command_uses_cmd_and_executes_command'
            )
            'horon-agent-irc-core' = @(
              'send_orders_same_millisecond_messages_by_seq',
              'mailbox_drops_oldest_beyond_cap',
              'mutual_wait_returns_unanswerable'
            )
          }

          foreach ($package in $groups.Keys) {
            $names = $groups[$package]
            $listed = & cargo test --locked --target x86_64-pc-windows-msvc -p $package --lib -- --list 2>&1 | ForEach-Object { "$_" }
            if ($LASTEXITCODE -ne 0) {
              $listed | ForEach-Object { Write-Host $_ }
              throw "listing tests of $package failed with exit code $LASTEXITCODE"
            }
            foreach ($testName in $names) {
              if (-not ($listed | Where-Object { $_ -match "(^|::)$([regex]::Escape($testName)): test$" })) {
                throw "Windows targeted test $testName is not in the $package lib tests"
              }
            }

            & ./scripts/ci/cargo_with_timeout.ps1 `
              -Name "Windows targeted tests: $package" `
              -TimeoutSeconds 600 `
              -CargoArgs (@('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '-p', $package, '--lib', '--') + $names + @('--nocapture'))
          }

      - name: Run Windows power tests
        shell: pwsh
        run: |
          & ./scripts/ci/cargo_with_timeout.ps1 `
            -Name 'Windows power-inhibit tests' `
            -TimeoutSeconds 900 `
            -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '-p', 'horon-agent-platform-windows', '--lib', 'power::tests::', '--', '--nocapture')

      - name: Run Windows e2e smoke tests
        shell: pwsh
        run: |
          $tests = @(
            'provider_behavior::test_socket_model_cycle_supported_models',
            'provider_behavior::test_model_switch_resets_provider_session'
          )

          foreach ($testName in $tests) {
            & ./scripts/ci/cargo_with_timeout.ps1 `
              -Name "Windows e2e smoke test: $testName" `
              -TimeoutSeconds 420 `
              -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '--test', 'e2e', $testName, '--', '--exact', '--nocapture')
          }

      - name: Run Windows lifecycle e2e tests
        shell: pwsh
        env:
          HORON_AGENT_E2E_ARTIFACT_DIR: ${{ runner.temp }}/horon-agent-windows-e2e-logs
        run: |
          New-Item -ItemType Directory -Force -Path $env:HORON_AGENT_E2E_ARTIFACT_DIR | Out-Null
          $tests = @(
            'windows_lifecycle::windows_binary_server_accepts_clients_and_debug_cli',
            'windows_lifecycle::windows_binary_server_rebinds_named_pipe_after_exit'
          )
          foreach ($testName in $tests) {
            & ./scripts/ci/cargo_with_timeout.ps1 `
              -Name "Windows lifecycle e2e test: $testName" `
              -TimeoutSeconds 420 `
              -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '--test', 'e2e', $testName, '--', '--exact', '--nocapture')
          }

      - name: Upload Windows e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-e2e-diagnostics
          path: ${{ runner.temp }}/horon-agent-windows-e2e-logs
          if-no-files-found: ignore

      - name: Verify built binary launches
        shell: pwsh
        run: |
          & "target/x86_64-pc-windows-msvc/release/horon-agent.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Built Windows binary failed to run --version'
          }

      - name: Run Windows installer lifecycle tests
        shell: pwsh
        run: |
          & ./scripts/install/test_install_windows_launcher.ps1
          & ./scripts/install/test_windows_setup.ps1

      - name: sccache stats
        # Runs even after a failed test so the cache state is in the log, and
        # only when the wrapper was enabled for this job.
        if: ${{ always() && env.RUSTC_WRAPPER == 'sccache' }}
        shell: pwsh
        run: sccache --show-stats

  fmt:
    name: Format
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","horon-agent"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned toolchain
        # `cargo fmt` runs under the toolchain rust-toolchain.toml pins. Installing
        # it here, with its listed components, replaces rustup's automatic install,
        # which prints a warning on first use.
        run: rustup toolchain install --profile minimal

      - name: Check module declarations resolve
        # A `mod x;` with no file makes rustfmt fail with "Error writing files:
        # failed to resolve mod", which reads like a formatting problem and hides
        # every gate behind it. Naming the real cause first (221159294).
        run: python3 scripts/ci/check_module_files.py

      - name: Check formatting
        run: bash scripts/ci/check_format.sh

  typescript-sdk:
    name: TypeScript SDK
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","horon-agent"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `scripts/sdk/test_package.sh` packs and installs the tarball with npm,
      # so the npm major decides what a consumer receives. Pin Node instead of
      # inheriting whatever the image ships that week.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      # The SDK mirrors crates/harness-api by hand. Without this job the
      # only guard that runs on a change is the Rust-side variant check, and a
      # typo in the TypeScript itself (or a broken client) reaches consumers.
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: sdk/typescript

      - name: Typecheck, build, and test
        run: bun run check
        working-directory: sdk/typescript

      # `npm run check` proves the source compiles; it says nothing about what
      # a consumer actually receives. The published tarball is a separate
      # artifact (`files`, `exports`, `prepack`), and getting it wrong ships a
      # package that installs but cannot be imported. Install it as a real
      # dependency and import it the way a consumer would.
      - name: Published tarball installs and imports
        run: bash scripts/sdk/test_package.sh

  python-sdk:
    name: Python SDK (${{ matrix.python }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the newest stable one.
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}

      # Like the TypeScript job: the SDK mirrors crates/harness-api by hand,
      # and the Rust-side parity test only proves the method names exist.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

  setup-friction:
    name: Setup Friction Eval (Linux installer)
    needs: changes
    runs-on: ubuntu-24.04
    if: ${{ needs.changes.outputs.code == 'true' && !(vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install probe shells
        run: sudo apt-get update && sudo apt-get install -y fish zsh

      - name: Installer conversion telemetry tests
        run: bash scripts/install/test_install.sh

      - name: Setup friction scorecard
        run: bash scripts/install/eval_setup_friction.sh

  powershell-syntax:
    name: PowerShell Syntax
    needs: changes
    runs-on: windows-latest
    if: ${{ needs.changes.outputs.code == 'true' && !(vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check PowerShell script syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          & ./scripts/ci/check_powershell.ps1

      - name: Check PowerShell script syntax (PowerShell 7)
        shell: pwsh
        run: |
          & ./scripts/ci/check_powershell.ps1

  windows-arm64-check:
    name: Windows ARM64 Release Configuration
    needs: changes
    runs-on: windows-latest
    if: ${{ needs.changes.outputs.code == 'true' && !(vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    timeout-minutes: 30
    env:
      # `dtolnay/rust-toolchain` installs components into the `stable` toolchain
      # by name, while anything run inside the checkout resolves the repository's
      # rust-toolchain.toml pin to a separate toolchain directory. Without this,
      # the aarch64 target is installed for a toolchain the build never uses and
      # `justrust check` fails with "target may not be installed". Same cure as
      # the `build` job.
      RUSTUP_TOOLCHAIN: stable
      # Native Windows hosted routing is unsupported. Keep execution on the
      # runner and bypass alpha.17's sampler until a fixed client is validated.
      JUSTRUST_TOOLCHAIN: system
      JUSTRUST_SLOTS: "0"
      JUSTRUST_NO_TELEMETRY: "1"
      JUSTRUST_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/msvc-dev-cmd
        with:
          arch: amd64_arm64

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          # A later step failing (an advisory, a flaky test) must not throw away
          # the artifacts the earlier steps spent minutes compiling.
          cache-on-failure: true
          key: windows-arm64-release-check
          cache-all-crates: "true"

      - name: Install pinned justrust
        shell: bash
        env:
          # Only for the release API fallback when the download URL fails.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/install_justrust.sh

      - name: Check full Windows ARM64 release configuration
        shell: pwsh
        # Unlike the advisory Linux cross-check, this uses the native MSVC
        # toolchain and the release feature graph, including the companion.
        run: |
          & justrust check --local --locked -p horon-agent --bins --target aarch64-pc-windows-msvc --no-default-features --features pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-cross-check:
    name: Windows Cross-Target Check (Linux)
    needs: changes
    runs-on: ubuntu-24.04
    if: ${{ needs.changes.outputs.code == 'true' && !(vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    timeout-minutes: 30
    env:
      # The two Windows targets are installed into `stable`; the same pin makes
      # `cargo xwin` resolve that toolchain instead of rust-toolchain.toml's.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Free disk space
        # cargo-xwin unpacks the Windows SDK and CRT into the target dir on top
        # of a workspace build; the hosted image's 14 GB is not enough with the
        # pre-installed toolchains still there. The shared script sits in the
        # repository, so it runs after checkout and deletes in the background
        # (#21).
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        shell: bash
        run: bash scripts/ci/free_disk_space.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          # A later step failing (an advisory, a flaky test) must not throw away
          # the artifacts the earlier steps spent minutes compiling.
          cache-on-failure: true
          key: windows-cross-check
          cache-all-crates: "true"

      - name: Install LLVM toolchain for cargo-xwin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm ninja-build

      - name: Install cargo-xwin
        # Pre-built release binary; building it from the git source cost several
        # minutes on every run.
        uses: taiki-e/install-action@c5695724643db014337e10f479712023ee658d78 # cargo-xwin
        with:
          tool: cargo-xwin

      - name: Resolve cargo-xwin version and cache directory
        # XWIN_CACHE_DIR is the environment form of `--xwin-cache-dir`, "xwin
        # cache directory to put CRT and SDK files" (cargo-xwin README, option
        # table). The download is the bulk of this job's 14.5 minutes in run
        # 42373575639. The directory sits outside the checkout and `target/`, so
        # Swatinem/rust-cache does not store it, and it is resolved to an
        # absolute path without `..` here: actions/cache rejects `..` in `path`
        # and skipped the save in run 42387478682.
        id: xwin
        shell: bash
        run: |
          version=$(cargo xwin --version | head -n1 | tr -d '\n' | tr -c 'A-Za-z0-9._-' '-')
          dir="$HOME/.cache/cargo-xwin"
          mkdir -p "$dir"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "XWIN_CACHE_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        # The CRT and SDK archives are the 14.5 minutes of run 42373575639. The
        # key carries the cargo-xwin version and both cross targets because the
        # cached files are version-pinned and target-pinned.
        with:
          path: ${{ steps.xwin.outputs.dir }}
          key: cargo-xwin-${{ runner.os }}-${{ steps.xwin.outputs.version }}-x86_64-pc-windows-msvc-aarch64-pc-windows-msvc

      # Only x64 is cross-checked here. The Windows ARM64 target is checked
      # natively by "Windows ARM64 Release Configuration": a cross-check of it
      # failed on every run because cargo-xwin feeds clang-style ring builds MSVC
      # /imsvc flags, and an advisory step that always fails only adds warnings.
      - name: Check Windows x64 target
        shell: bash
        run: |
          cargo xwin check --locked --target x86_64-pc-windows-msvc
          # Shows the CRT and SDK landed in the cached directory.
          du -sh "$XWIN_CACHE_DIR"

  # Documentation-only pull requests and `dev` pushes run this instead of the
  # code gates.
  docs:
    name: Documentation Checks
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check relative links and UTF-8
        run: python3 scripts/ci/check_docs_links.py

      - name: Check English/Korean documentation pairs
        # Present once the bilingual documentation lands; until then there is no
        # pair set to check.
        if: ${{ !cancelled() && hashFiles('scripts/ci/check_docs_pairs.py') != '' }}
        run: python3 scripts/ci/check_docs_pairs.py

      - name: Documentation benchmark block contract
        if: ${{ !cancelled() }}
        run: python3 -m unittest -v scripts/perf/test_bench_docs.py

  # `docs/` and README.md are compiled into the binary (crates/app-core/build.rs)
  # and the `horon_agent_docs` tests read them, so a documentation-only change
  # still proves the corpus builds and those tests pass, without the release
  # build, the cross-platform matrix or the structural performance run.
  docs-corpus:
    name: Documentation Corpus Test
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Free disk space
        if: ${{ !cancelled() && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: bash scripts/ci/free_disk_space.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ubuntu-latest-stablepin
          save-if: false

      - name: Run the embedded documentation tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p horon-agent-app-core --lib horon_agent_docs 2>&1 | tee "$RUNNER_TEMP/docs-corpus.log"
          # A filter that matches nothing reports a green "0 passed".
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/docs-corpus.log"

  workflow-lint:
    name: Workflow Lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image's preinstalled Go can be older than actionlint's go.mod
      # requirement, and the automatic toolchain switch then fails on a
      # toolchain version the module proxy does not serve. Pin Go here and keep
      # it from fetching another toolchain so the job depends only on these pins.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.x'
          cache: false

      - name: Run actionlint
        # Pinned to a release; actionlint also runs the preinstalled shellcheck
        # over every `run:` script. Zero findings is the standing requirement.
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  # The one check a branch rule needs. Gates that a documentation-only pull
  # request or `dev` push skips by design stay "skipped" and would leave a
  # required check pending; this job always finishes and fails only when a gate
  # failed, was cancelled, or the path classification broke or came back empty.
  ci-required:
    name: CI Required
    if: ${{ always() }}
    needs:
      - changes
      - quality
      - release-automation
      - build
      - windows-build-test
      - fmt
      - typescript-sdk
      - python-sdk
      - setup-friction
      - powershell-syntax
      - windows-arm64-check
      - windows-cross-check
      - docs
      - docs-corpus
      - workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate that ran to have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          if [ "$(echo "$NEEDS" | jq -r '.changes.result')" != success ]; then
            echo "::error::path classification did not succeed"
            exit 1
          fi
          code="$(echo "$NEEDS" | jq -r '.changes.outputs.code // ""')"
          docs_only="$(echo "$NEEDS" | jq -r '.changes.outputs.docs_only // ""')"
          if [ "$code" != true ] && [ "$code" != false ]; then
            echo "::error::Changed Paths gave code='$code'; expected true or false"
            exit 1
          fi
          if [ "$code" != true ] && [ "$docs_only" != true ]; then
            echo "::error::Changed Paths skipped the code gates without a documentation-only result"
            exit 1
          fi
          failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$failed" ]; then
            echo "::error::failed or cancelled: $failed"
            exit 1
          fi
