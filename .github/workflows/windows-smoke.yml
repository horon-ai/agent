name: Windows Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: Windows target to verify
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64
          - both

# Manual smoke run: build, test, and upload diagnostics only.
permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.ref }}-${{ inputs.target || 'x64' }}
  cancel-in-progress: true

env:
  HORON_AGENT_CI: "1"
  # CI builds without the local parallel-frontend rustc wrapper from
  # .cargo/config.toml (a POSIX shell script; see scripts/dev/rustc_parallel_frontend).
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  # dtolnay/rust-toolchain installs the matrix target into `stable`. Use that
  # same toolchain for the build; otherwise rust-toolchain.toml wins inside the
  # checkout and `--target` fails with a missing target.
  RUSTUP_TOOLCHAIN: stable

jobs:
  smoke-x64:
    name: Windows Smoke (x64)
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'x64' || inputs.target == 'both')
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/msvc-dev-cmd
        with:
          arch: amd64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          disable_annotations: true
        continue-on-error: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-smoke-x64
          cache-all-crates: "true"

      - name: Build release binary
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --start-server *> $null
            if ($LASTEXITCODE -eq 0) {
              $env:RUSTC_WRAPPER = 'sccache'
            }
          }

          & cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Compile library and binary tests
        shell: pwsh
        run: |
          & cargo test --locked --target x86_64-pc-windows-msvc --lib --bins --no-run
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows library/binary test compilation failed'
          }

      - name: Run targeted Windows validation tests
        shell: pwsh
        run: |
          $tests = @(
            'sibling_socket_path_roundtrip',
            'cleanup_socket_pair_removes_main_and_debug_files',
            'is_process_running_reports_exited_children_as_stopped',
            'spawn_replacement_process_returns_without_waiting_for_child_exit',
            'build_shell_command_uses_cmd_and_executes_command',
            'pipe_name_is_stable_and_normalizes_case_and_separators',
            'pipe_name_falls_back_when_stem_is_empty',
            'busy_pipe_is_reported_as_a_live_socket_path',
            'stream_pair_round_trips_bytes',
            'split_stream_supports_concurrent_read_and_write'
          )

          foreach ($testName in $tests) {
            & ./scripts/ci/cargo_with_timeout.ps1 `
              -Name "Windows targeted test: $testName" `
              -TimeoutSeconds 300 `
              -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '--lib', $testName, '--', '--nocapture')
          }

      - name: Run Windows smoke tests
        shell: pwsh
        run: |
          $tests = @(
            'provider_behavior::test_socket_model_cycle_supported_models',
            'provider_behavior::test_model_switch_resets_provider_session'
          )

          foreach ($testName in $tests) {
            & ./scripts/ci/cargo_with_timeout.ps1 `
              -Name "Windows e2e smoke test: $testName" `
              -TimeoutSeconds 420 `
              -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '--test', 'e2e', $testName, '--', '--exact', '--nocapture')
          }

      - name: Run Windows lifecycle e2e tests
        shell: pwsh
        env:
          HORON_AGENT_E2E_ARTIFACT_DIR: ${{ runner.temp }}/horon-agent-windows-e2e-logs
        run: |
          New-Item -ItemType Directory -Force -Path $env:HORON_AGENT_E2E_ARTIFACT_DIR | Out-Null
          $tests = @(
            'windows_lifecycle::windows_binary_server_accepts_clients_and_debug_cli',
            'windows_lifecycle::windows_binary_server_rebinds_named_pipe_after_exit'
          )
          foreach ($testName in $tests) {
            & ./scripts/ci/cargo_with_timeout.ps1 `
              -Name "Windows lifecycle e2e test: $testName" `
              -TimeoutSeconds 420 `
              -CargoArgs @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '--test', 'e2e', $testName, '--', '--exact', '--nocapture')
          }

      - name: Upload Windows e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-e2e-diagnostics-x64
          path: ${{ runner.temp }}/horon-agent-windows-e2e-logs
          if-no-files-found: ignore

      - name: Verify built binary launches
        shell: pwsh
        run: |
          & "target/x86_64-pc-windows-msvc/release/horon-agent.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Built Windows binary failed to run --version'
          }

  smoke-arm64:
    name: Windows Smoke (ARM64)
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'arm64' || inputs.target == 'both')
    runs-on: windows-11-arm
    # Release builds of the full CLI on a cold hosted ARM64 runner also need the
    # MSVC setup; 35 minutes left no headroom for a slow compile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/msvc-dev-cmd
        with:
          arch: amd64_arm64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          disable_annotations: true
        continue-on-error: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-smoke-arm64
          cache-all-crates: "true"

      - name: Build release binary
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --start-server *> $null
            if ($LASTEXITCODE -eq 0) {
              $env:RUSTC_WRAPPER = 'sccache'
            }
          }

          & cargo build --locked --release --target aarch64-pc-windows-msvc --no-default-features --features pdf

      - name: Verify built binary launches
        shell: pwsh
        run: |
          & "target/aarch64-pc-windows-msvc/release/horon-agent.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Built Windows ARM64 binary failed to run --version'
          }
