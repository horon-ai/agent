name: Benchmark

# Two entry points, never push, pull_request, or a schedule directly: it installs
# third-party agent CLIs, builds a release binary, and spends tens of minutes of
# runner time on each OS.
#
#   gh workflow run benchmark.yml --ref <branch> -f os=all -f suites=all
#   gh workflow run benchmark.yml --ref <branch> -f os=windows -f suites=tools
#
#   # Before/after on one runner: build `dev`'s merge base beside the branch.
#   gh workflow run benchmark.yml --ref <branch> -f os=all -f suites=compare \
#     -f sessions="1 10 100" -f baseline_ref=<merge-base sha>
#
#   # Daemon CPU per tool call, branch against `dev`, both daemons in one job.
#   gh workflow run benchmark.yml --ref <branch> -f os=linux -f suites=tools \
#     -f baseline_ref=dev
#
#   # Install time of the pinned release and of the npm competitors, cold and
#   # warm, on every OS and architecture (benchmark-install.yml). `install` is
#   # opt-in: `suites=all` never selects it. `os` also accepts `freebsd` here.
#   gh workflow run benchmark.yml --ref <branch> -f os=all -f suites=install \
#     -f oneshot_runs=5 -f competitors=jcode,claude_code,codex,opencode,pi
#
# and `workflow_call` from benchmark-docs.yml, which runs every suite on every OS
# for a `main` commit after its CI passed and writes the result into
# docs/performance/RESULTS.md.
#
# Each OS runs on its own GitHub-hosted runners (Linux ubuntu-24.04, macOS
# macos-latest, Windows windows-latest) through one call of benchmark-os.yml,
# which builds once, measures each suite unit in its own job, and uploads the
# artifact `benchmark-<os>-<run_id>`. Each OS fails or succeeds alone.
#
# No secrets and no real model calls. Every suite that needs a model talks to
# scripts/perf/mock_llm_server.py on localhost, so a run costs no API credit and
# every tool sees the same deterministic replies.
#
# Results are reports, not gates. Wall-clock and RSS on a shared runner move with
# the machine, so nothing here fails on a threshold (docs/performance/BENCHMARK.md).
# A suite fails only when its script itself errors; a missing competitor is
# listed as skipped.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check out and measure (default: the triggering commit)"
        type: string
        required: false
        default: ""
      os:
        description: "Comma-separated OSes; the install suite additionally accepts freebsd and expands each OS to its architectures"
        type: string
        required: false
        default: all
      suites:
        description: "Comma-separated suites; `all` means every regular suite and never install, which must be named explicitly. `compare` also measures `packages`, the cost of no package, an installed one and one call"
        type: string
        required: false
        default: all
      competitors:
        description: "Comma-separated tools to compare with horon: jcode, claude_code, codex, opencode, pi, omp (oh-my-pi), omo (oh-my-openagent)"
        type: string
        required: false
        default: jcode,claude_code,codex,opencode,pi,omp,omo
      sessions:
        type: string
        required: false
        default: "1 5 10"
      turns:
        type: string
        required: false
        default: "3"
      oneshot_runs:
        type: string
        required: false
        default: "5"
      baseline_ref:
        description: "Optional ref built beside the measured commit and compared as a second horon row (compare), run through the same package scenarios (packages) or started as a second daemon (tools)"
        type: string
        required: false
        default: ""
      features:
        description: "Cargo features added to the candidate release build only, e.g. jemalloc (empty builds exactly what ships)"
        type: string
        required: false
        default: ""
      jcode_version:
        description: "Optional published jcode tag (vX.Y.Z) to pin; empty resolves the newest stable release once for every OS and suite"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      install_ref:
        description: "Installer branch or commit for the install suite (defaults to the dispatch commit)"
        required: false
        default: ""
      os:
        description: "Comma-separated OSes, each measured in its own job: linux, macos, windows, or all. The opt-in install suite also accepts freebsd and expands each OS to its architectures"
        required: false
        default: all
      suites:
        description: "Comma-separated suites: compare, packages, startup, loading, tools, reload, tui, compile, install, or all. `all` covers every regular suite and never install; name install to opt in. compare measures packages too"
        required: false
        default: all
      competitors:
        description: "Comma-separated tools to compare with horon: jcode, claude_code, codex, opencode, pi, omp (oh-my-pi), omo (oh-my-openagent)"
        required: false
        default: jcode,claude_code,codex,opencode,pi,omp,omo
      sessions:
        description: "Concurrent session counts for the memory comparison (space-separated); wider spreads such as '1 10 100' make the per-session slope measurable"
        required: false
        default: "1 5 10"
      turns:
        description: "Turns per session for the memory comparison"
        required: false
        default: "3"
      oneshot_runs:
        description: "Samples per build for the one-shot, skill and MCP cells; the median needs at least 5 to separate two builds"
        required: false
        default: "5"
      baseline_ref:
        description: "Optional ref (usually the merge base with dev) built beside the measured commit and compared as a second horon row (compare), run through the same package scenarios (packages) or started as a second daemon (tools); empty measures one build"
        required: false
        default: ""
      features:
        description: "Cargo features added to the candidate release build only, e.g. jemalloc (empty builds exactly what ships; the baseline never gets them)"
        required: false
        default: ""
      jcode_version:
        description: "Optional published jcode tag (vX.Y.Z) to pin; empty resolves the newest stable release once for every OS and suite"
        required: false
        default: ""

permissions:
  contents: read

env:
  # `actions/checkout` runs `git init` on a fresh runner and git prints a hint
  # about the default branch name. Naming it removes the cause of the message.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  HORON_AGENT_CI: "1"
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  # Relative to the workspace, so the same path works in Git Bash on Windows.
  RESULTS: bench-results
  # Windows consoles default to a legacy code page; the reports carry "—" and "×".
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  plan:
    name: Select OSes and suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      suites: ${{ steps.plan.outputs.suites }}
      install: ${{ steps.plan.outputs.install }}
      run: ${{ steps.plan.outputs.run }}
      jcode: ${{ steps.plan.outputs.jcode }}
      jcode_platforms: ${{ steps.plan.outputs.jcode_platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: scripts/perf

      - name: Split the suites input and map the host OSes
        # `install` is opt-in and stays out of `all`. The regular suites run only
        # on linux, macos and windows; `freebsd` belongs to the install suite.
        # Every remaining name goes to bench_select.py, so an unknown suite or OS
        # still fails the dispatch there.
        id: plan
        shell: bash
        env:
          SUITES_INPUT: ${{ inputs.suites }}
          OS_INPUT: ${{ inputs.os }}
          COMPETITORS: ${{ inputs.competitors }}
        run: |
          set -euo pipefail
          strip() { sed -E 's/^,//; s/,$//; s/,,+/,/g; s/^,//; s/,$//'; }
          raw="${SUITES_INPUT//[[:space:]]/}"
          [ -n "$raw" ] || raw=all
          install=false
          [[ ",$raw," != *,install,* ]] || install=true
          suites=",$raw,"
          suites="$(printf '%s' "$suites" | sed -E 's/,install,/,/' | strip)"
          all_os="$(printf '%s' ",${OS_INPUT:-all}," | tr -d '[:space:]' | strip)"
          hosts="$(printf '%s' ",$all_os," | sed -E 's/,freebsd,/,/' | strip)"
          echo "install=$install" >> "$GITHUB_OUTPUT"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          if [ "$install" = true ]; then
            jcode_platforms="${all_os:-all}"
          else
            jcode_platforms="$hosts"
          fi
          echo "jcode_platforms=$jcode_platforms" >> "$GITHUB_OUTPUT"
          competitors=",${COMPETITORS//[[:space:]]/},"
          compare=false
          if [[ -n "${hosts//,/}" && ( ",$suites," == *,all,* || ",$suites," == *,compare,* ) ]]; then
            compare=true
          fi
          if [[ "$competitors" == *,jcode,* && ( "$install" == true || "$compare" == true ) ]]; then
            echo "jcode=true" >> "$GITHUB_OUTPUT"
          fi
          # A matrix cannot be expanded from an empty include, so a skipped
          # selection hands over one placeholder that the job's `if` skips.
          placeholder='matrix={"include":[{"os":"none","runner":"ubuntu-24.04"}]}'
          if [ -z "$suites" ] || [ -z "${hosts//,/}" ]; then
            echo "::notice::the regular suites are skipped; only the install suite runs"
            echo "$placeholder" >> "$GITHUB_OUTPUT"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/perf/bench_select.py --platforms "$hosts" | tee -a "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

  resolve:
    name: Resolve jcode release
    # One resolution per benchmark round, shared by the regular suites and the
    # install matrix: picking the release inside each OS job would let runners
    # race a publish and measure two different releases in one round.
    needs: plan
    if: ${{ needs.plan.outputs.jcode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      selection: ${{ steps.resolve.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: scripts/perf

      - name: Resolve the newest stable release (or the pin)
        id: resolve
        shell: bash
        env:
          # The API call is rate-limited per IP; the job token raises the limit
          # and never reaches a downloaded binary.
          GH_TOKEN: ${{ github.token }}
          JCODE_VERSION: ${{ inputs.jcode_version }}
          JCODE_PLATFORMS: ${{ needs.plan.outputs.jcode_platforms }}
          JCODE_INSTALL_SUITE: ${{ needs.plan.outputs.install }}
        run: |
          set -euo pipefail
          args=(resolve --metadata jcode-release.json --github-output "$GITHUB_OUTPUT")
          [ -z "${JCODE_PLATFORMS:-}" ] || args+=(--platforms "$JCODE_PLATFORMS")
          [ "${JCODE_INSTALL_SUITE:-false}" != "true" ] || args+=(--install-suite)
          python3 scripts/perf/jcode_release.py "${args[@]}"
          # The resolver writes only validated values; re-check before they are
          # handed to other jobs as shell-visible inputs.
          python3 - jcode-release.json <<'PY'
          import json, re, sys
          record = json.load(open(sys.argv[1], encoding="utf-8"))
          if not re.fullmatch(r"v\d+\.\d+\.\d+", record.get("tag", "")):
              raise SystemExit(f"invalid resolved tag: {record.get('tag')!r}")
          if not re.fullmatch(r"[0-9a-f]{40,64}", record.get("commit", "")):
              raise SystemExit(f"invalid resolved commit: {record.get('commit')!r}")
          PY
          cat jcode-release.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jcode-release-${{ github.run_id }}
          path: jcode-release.json
          retention-days: 30

  benchmark:
    name: Benchmark (${{ matrix.os }})
    needs: [plan, resolve]
    # A failed resolution must not be papered over: the resolve job is red and
    # these jobs wait for a re-run instead of measuring another release.
    # `!cancelled()` is explicit because a skipped `resolve` (jcode not in the
    # competitor list) would otherwise suppress this job through GitHub's
    # implicit success() check.
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/benchmark-os.yml
    with:
      ref: ${{ inputs.ref }}
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      # `install` is removed here so bench_select.py never sees a name it does
      # not measure; benchmark-install.yml owns that suite.
      suites: ${{ needs.plan.outputs.suites }}
      competitors: ${{ inputs.competitors }}
      sessions: ${{ inputs.sessions }}
      turns: ${{ inputs.turns }}
      oneshot_runs: ${{ inputs.oneshot_runs }}
      baseline_ref: ${{ inputs.baseline_ref }}
      features: ${{ inputs.features }}
      jcode_version: ${{ needs.resolve.outputs.tag }}
      jcode_release_commit: ${{ needs.resolve.outputs.commit }}
      jcode_release_source: ${{ needs.resolve.outputs.selection }}

  install:
    name: Install benchmark
    needs: [plan, resolve]
    # Opt-in only. This job installs the published release and the npm
    # competitors over the real internet on seven OS/architecture targets, so it
    # never rides along with an `all` run.
    if: ${{ !cancelled() && needs.plan.outputs.install == 'true' && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped') }}
    uses: ./.github/workflows/benchmark-install.yml
    with:
      ref: ${{ inputs.install_ref || inputs.ref }}
      os: ${{ inputs.os }}
      competitors: ${{ inputs.competitors }}
      # The install suite takes its sample count from oneshot_runs: five cold
      # and five warm installs per tool.
      runs: ${{ inputs.oneshot_runs }}
      baseline_ref: ${{ inputs.baseline_ref }}
      jcode_version: ${{ needs.resolve.outputs.tag }}
      jcode_release_commit: ${{ needs.resolve.outputs.commit }}
      jcode_release_source: ${{ needs.resolve.outputs.selection }}
