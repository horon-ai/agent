name: Benchmark

# Two entry points, never push, pull_request, or a schedule directly: it installs
# third-party agent CLIs, builds a release binary, and spends tens of minutes of
# runner time on each OS.
#
#   gh workflow run benchmark.yml --ref <branch> -f os=all -f suites=all
#   gh workflow run benchmark.yml --ref <branch> -f os=windows -f suites=tools
#
#   # Before/after on one runner: build `dev`'s merge base beside the branch.
#   gh workflow run benchmark.yml --ref <branch> -f os=all -f suites=compare \
#     -f sessions="1 10 100" -f baseline_ref=<merge-base sha>
#
#   # Daemon CPU per tool call, branch against `dev`, both daemons in one job.
#   gh workflow run benchmark.yml --ref <branch> -f os=linux -f suites=tools \
#     -f baseline_ref=dev
#
#   # Install time of the pinned release and of the npm competitors, cold and
#   # warm, on every OS and architecture (benchmark-install.yml). `install` is
#   # opt-in: `suites=all` never selects it. `os` also accepts `freebsd` here.
#   gh workflow run benchmark.yml --ref <branch> -f os=all -f suites=install \
#     -f oneshot_runs=5 -f competitors=jcode,claude_code,codex,opencode,pi
#
# and `workflow_call` from benchmark-docs.yml, which runs every suite on every OS
# for a `main` commit after its CI passed and writes the result into
# docs/performance/RESULTS.md.
#
# Each OS runs on its own GitHub-hosted runners (Linux ubuntu-24.04, macOS
# macos-latest, Windows windows-latest) through one call of benchmark-os.yml,
# which builds once, measures each suite unit in its own job, and uploads the
# artifact `benchmark-<os>-<run_id>`. Each OS fails or succeeds alone.
#
# No secrets and no real model calls. Every suite that needs a model talks to
# scripts/perf/mock_llm_server.py on localhost, so a run costs no API credit and
# every tool sees the same deterministic replies.
#
# Results are reports, not gates. Wall-clock and RSS on a shared runner move with
# the machine, so nothing here fails on a threshold (docs/performance/BENCHMARK.md).
# A suite fails only when its script itself errors; a missing competitor is
# listed as skipped.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check out and measure (default: the triggering commit)"
        type: string
        required: false
        default: ""
      os:
        description: "Comma-separated OSes; the install suite additionally accepts freebsd and expands each OS to its architectures"
        type: string
        required: false
        default: all
      suites:
        description: "Comma-separated suites; `all` means every regular suite and never install, which must be named explicitly"
        type: string
        required: false
        default: all
      competitors:
        description: "Comma-separated tools to compare with horon: jcode, claude_code, codex, opencode, pi, omp (oh-my-pi), omo (oh-my-openagent)"
        type: string
        required: false
        default: jcode,claude_code,codex,opencode,pi,omp,omo
      sessions:
        type: string
        required: false
        default: "1 5 10"
      turns:
        type: string
        required: false
        default: "3"
      oneshot_runs:
        type: string
        required: false
        default: "5"
      baseline_ref:
        description: "Optional ref built beside the measured commit and compared as a second horon row (compare) or a second daemon (tools)"
        type: string
        required: false
        default: ""
      features:
        description: "Cargo features added to the candidate release build only, e.g. jemalloc (empty builds exactly what ships)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      os:
        description: "Comma-separated OSes, each measured in its own job: linux, macos, windows, or all. The opt-in install suite also accepts freebsd and expands each OS to its architectures"
        required: false
        default: all
      suites:
        description: "Comma-separated suites: compare, startup, loading, tools, reload, tui, compile, install, or all. `all` covers every regular suite and never install; name install to opt in"
        required: false
        default: all
      competitors:
        description: "Comma-separated tools to compare with horon: jcode, claude_code, codex, opencode, pi, omp (oh-my-pi), omo (oh-my-openagent)"
        required: false
        default: jcode,claude_code,codex,opencode,pi,omp,omo
      sessions:
        description: "Concurrent session counts for the memory comparison (space-separated); wider spreads such as '1 10 100' make the per-session slope measurable"
        required: false
        default: "1 5 10"
      turns:
        description: "Turns per session for the memory comparison"
        required: false
        default: "3"
      oneshot_runs:
        description: "Samples per build for the one-shot, skill and MCP cells; the median needs at least 5 to separate two builds"
        required: false
        default: "5"
      baseline_ref:
        description: "Optional ref (usually the merge base with dev) built beside the measured commit and compared as a second horon row (compare) or a second daemon (tools); empty measures one build"
        required: false
        default: ""
      features:
        description: "Cargo features added to the candidate release build only, e.g. jemalloc (empty builds exactly what ships; the baseline never gets them)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # `actions/checkout` runs `git init` on a fresh runner and git prints a hint
  # about the default branch name. Naming it removes the cause of the message.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  HORON_AGENT_CI: "1"
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  # Relative to the workspace, so the same path works in Git Bash on Windows.
  RESULTS: bench-results
  # Windows consoles default to a legacy code page; the reports carry "—" and "×".
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  plan:
    name: Select OSes and suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      suites: ${{ steps.plan.outputs.suites }}
      install: ${{ steps.plan.outputs.install }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: scripts/perf

      - name: Split the suites input and map the host OSes
        # `install` is opt-in and stays out of `all`. The regular suites run only
        # on linux, macos and windows; `freebsd` belongs to the install suite.
        # Every remaining name goes to bench_select.py, so an unknown suite or OS
        # still fails the dispatch there.
        id: plan
        shell: bash
        env:
          SUITES_INPUT: ${{ inputs.suites }}
          OS_INPUT: ${{ inputs.os }}
        run: |
          set -euo pipefail
          strip() { sed -E 's/^,//; s/,$//; s/,,+/,/g; s/^,//; s/,$//'; }
          raw="${SUITES_INPUT//[[:space:]]/}"
          [ -n "$raw" ] || raw=all
          install=false
          [[ ",$raw," != *,install,* ]] || install=true
          suites=",$raw,"
          suites="$(printf '%s' "$suites" | sed -E 's/,install,/,/' | strip)"
          hosts=",${OS_INPUT:-all},"
          hosts="$(printf '%s' "$hosts" | tr -d '[:space:]' | sed -E 's/,freebsd,/,/' | strip)"
          echo "install=$install" >> "$GITHUB_OUTPUT"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          # A matrix cannot be expanded from an empty include, so a skipped
          # selection hands over one placeholder that the job's `if` skips.
          placeholder='matrix={"include":[{"os":"none","runner":"ubuntu-24.04"}]}'
          if [ -z "$suites" ] || [ -z "${hosts//,/}" ]; then
            echo "::notice::the regular suites are skipped; only the install suite runs"
            echo "$placeholder" >> "$GITHUB_OUTPUT"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/perf/bench_select.py --platforms "$hosts" | tee -a "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

  benchmark:
    name: Benchmark (${{ matrix.os }})
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/benchmark-os.yml
    with:
      ref: ${{ inputs.ref }}
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      # `install` is removed here so bench_select.py never sees a name it does
      # not measure; benchmark-install.yml owns that suite.
      suites: ${{ needs.plan.outputs.suites }}
      competitors: ${{ inputs.competitors }}
      sessions: ${{ inputs.sessions }}
      turns: ${{ inputs.turns }}
      oneshot_runs: ${{ inputs.oneshot_runs }}
      baseline_ref: ${{ inputs.baseline_ref }}
      features: ${{ inputs.features }}

  install:
    name: Install benchmark
    needs: plan
    # Opt-in only. This job installs the published release and the npm
    # competitors over the real internet on seven OS/architecture targets, so it
    # never rides along with an `all` run.
    if: ${{ needs.plan.outputs.install == 'true' }}
    uses: ./.github/workflows/benchmark-install.yml
    with:
      ref: ${{ inputs.ref }}
      os: ${{ inputs.os }}
      competitors: ${{ inputs.competitors }}
      # The install suite takes its sample count from oneshot_runs: five cold
      # and five warm installs per tool.
      runs: ${{ inputs.oneshot_runs }}
      baseline_ref: ${{ inputs.baseline_ref }}
