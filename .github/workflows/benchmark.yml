name: Benchmark

# Two entry points, never push, pull_request, or a schedule directly: it installs
# third-party agent CLIs, builds a release binary, and spends tens of minutes of
# runner time.
#
#   gh workflow run benchmark.yml --ref <branch> -f suites=all
#
# and `workflow_call` from benchmark-docs.yml, which runs every suite on a `main`
# commit after its CI passed and writes the result into docs/performance/RESULTS.md.
#
# No secrets and no real model calls. Every suite that needs a model talks to
# scripts/perf/mock_llm_server.py on localhost, so a run costs no API credit and
# every tool sees the same deterministic replies.
#
# Results are reports, not gates. Wall-clock and RSS on a shared runner move with
# the machine, so nothing here fails on a threshold (docs/performance/BENCHMARK.md,
# "하지 않는 것"). A suite fails only when its script itself errors; a missing
# competitor is listed as skipped.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check out and measure (default: the triggering commit)"
        type: string
        required: false
        default: ""
      suites:
        type: string
        required: false
        default: all
      competitors:
        type: string
        required: false
        default: jcode,claude_code,codex,opencode,pi
      sessions:
        type: string
        required: false
        default: "1 5 10"
      turns:
        type: string
        required: false
        default: "3"
      runner:
        type: string
        required: false
        default: ubuntu-latest
  workflow_dispatch:
    inputs:
      suites:
        description: "Comma-separated suites: compare, startup, loading, tools, reload, compile, or all"
        required: false
        default: all
      competitors:
        description: "Comma-separated tools to compare with horon: jcode, claude_code, codex, opencode, pi"
        required: false
        default: jcode,claude_code,codex,opencode,pi
      sessions:
        description: "Concurrent session counts for the memory comparison (space-separated)"
        required: false
        default: "1 5 10"
      turns:
        description: "Turns per session for the memory comparison"
        required: false
        default: "3"
      runner:
        description: "ubuntu-latest, or macos-persistent for the repository's persistent macOS runner (quieter numbers)"
        type: choice
        required: false
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-persistent

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  HORON_AGENT_CI: "1"
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  RESULTS: ${{ github.workspace }}/bench-results

jobs:
  benchmark:
    name: Benchmark (${{ inputs.suites }})
    # Every suite runs in one job on one machine, so the comparison rows share the
    # same CPU, disk, and load. Only users with write access can dispatch, and the
    # first-party guard below keeps the persistent macOS runner off fork code.
    runs-on: ${{ inputs.runner == 'macos-persistent' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","horon-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: stable
      SUITES: ${{ inputs.suites }}
      COMPETITORS: ${{ inputs.competitors }}
      SESSIONS: ${{ inputs.sessions }}
      TURNS: ${{ inputs.turns }}
    steps:
      - name: Free disk space
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7
        with:
          # Empty for a dispatch, so the dispatched ref's commit is measured.
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-${{ runner.os }}

      - name: Select suites
        id: sel
        shell: bash
        run: python3 scripts/perf/bench_select.py "$SUITES" >> "$GITHUB_OUTPUT"

      - name: Install strace
        # The compare suite counts fsync/fdatasync calls with --syscalls. On a
        # runner without strace (macOS) the script records that as skipped and
        # still exits 0, so this step is Linux-only.
        if: ${{ steps.sel.outputs.compare == 'true' && runner.os == 'Linux' }}
        shell: bash
        run: |
          if command -v strace >/dev/null 2>&1; then
            strace --version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq strace
          fi

      - name: Build release binary and probes
        shell: bash
        run: |
          cargo build --release --locked -p horon-agent
          if [[ "${{ steps.sel.outputs.loading }}" == "true" ]]; then
            cargo build --release --locked -p horon-agent-base --example loading_probe
          fi
          mkdir -p "$RESULTS"
          git rev-parse HEAD > "$RESULTS/commit.txt"
          ./target/release/horon-agent --version | tee "$RESULTS/horon-version.txt"

      - uses: actions/setup-node@v7
        if: ${{ steps.sel.outputs.compare == 'true' }}
        with:
          node-version: "24"

      - name: Install competitor CLIs
        if: ${{ steps.sel.outputs.compare == 'true' }}
        shell: bash
        run: bash scripts/perf/install_competitors.sh "$RUNNER_TEMP/bench-tools" "$COMPETITORS" | tee "$RESULTS/competitors.txt"

      - name: "Suite: compare (horon vs other agents)"
        if: ${{ !cancelled() && steps.sel.outputs.compare == 'true' }}
        shell: bash
        run: |
          bins_args=""
          [[ -f "$RUNNER_TEMP/bench-tools/bins.args" ]] && bins_args=$(cat "$RUNNER_TEMP/bench-tools/bins.args")
          # shellcheck disable=SC2086
          python3 scripts/perf/bench_compare.py \
            --bin horon=./target/release/horon-agent $bins_args \
            --sessions $SESSIONS --turns "$TURNS" --syscalls \
            --json-out "$RESULTS/compare.json" --markdown-out "$RESULTS/compare.md"

      - name: "Suite: startup"
        if: ${{ !cancelled() && steps.sel.outputs.startup == 'true' }}
        shell: bash
        run: python3 scripts/perf/bench_startup.py ./target/release/horon-agent --runs 10 | tee "$RESULTS/startup.txt"

      - name: "Suite: loading (cold and warm)"
        if: ${{ !cancelled() && steps.sel.outputs.loading == 'true' }}
        shell: bash
        run: |
          for mode in cold warm; do
            python3 scripts/perf/bench_loading.py \
              --binary ./target/release/examples/loading_probe \
              --mode "$mode" --events 0,1000,10000 --skills 0,200 --iterations 10 \
              --emit "$RESULTS/loading-$mode.json" | tee "$RESULTS/loading-$mode.txt"
          done

      - name: "Suite: tools"
        if: ${{ !cancelled() && steps.sel.outputs.tools == 'true' }}
        shell: bash
        run: |
          python3 scripts/perf/bench_tools.py --binary ./target/release/horon-agent \
            --json-out "$RESULTS/tools.json" --markdown-out "$RESULTS/tools.md"

      - name: "Suite: reload storm"
        if: ${{ !cancelled() && steps.sel.outputs.reload == 'true' }}
        shell: bash
        run: |
          python3 scripts/perf/bench_reload_storm.py --binary ./target/release/horon-agent \
            --json-out "$RESULTS/reload.json" --markdown-out "$RESULTS/reload.md"

      - name: "Suite: compile"
        # Last: it touches source mtimes and rebuilds, so nothing measured above
        # shares the machine with it.
        if: ${{ !cancelled() && steps.sel.outputs.compile == 'true' }}
        shell: bash
        run: |
          python3 scripts/perf/bench_compile.py \
            --json-out "$RESULTS/compile.json" --markdown-out "$RESULTS/compile.md"

      - name: Write job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "## Benchmark"
            echo
            echo "- commit: \`$(cat "$RESULTS/commit.txt")\`, runner: \`${{ runner.os }}/${{ runner.arch }}\` (${{ runner.environment }})"
            echo "- suites: \`$SUITES\`"
            echo
            for f in compare tools reload compile; do
              if [[ -f "$RESULTS/$f.md" ]]; then cat "$RESULTS/$f.md"; echo; fi
            done
            for f in startup loading-cold loading-warm; do
              if [[ -f "$RESULTS/$f.txt" ]]; then
                echo "### $f"; echo; echo '```'; cat "$RESULTS/$f.txt"; echo '```'; echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: benchmark-${{ github.run_id }}
          path: bench-results/
          retention-days: 30
