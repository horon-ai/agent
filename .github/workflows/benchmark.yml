name: Benchmark

# Two entry points, never push, pull_request, or a schedule directly: it installs
# third-party agent CLIs, builds a release binary, and spends tens of minutes of
# runner time on each OS.
#
#   gh workflow run benchmark.yml --ref <branch> -f os=all -f suites=all
#   gh workflow run benchmark.yml --ref <branch> -f os=windows -f suites=tools
#
#   # Before/after on one runner: build `dev`'s merge base beside the branch.
#   gh workflow run benchmark.yml --ref <branch> -f os=all -f suites=compare \
#     -f sessions="1 10 100" -f baseline_ref=<merge-base sha>
#
# and `workflow_call` from benchmark-docs.yml, which runs every suite on every OS
# for a `main` commit after its CI passed and writes the result into
# docs/performance/RESULTS.md.
#
# Each OS runs on its own GitHub-hosted runners (Linux ubuntu-24.04, macOS
# macos-latest, Windows windows-latest) through one call of benchmark-os.yml,
# which builds once, measures each suite unit in its own job, and uploads the
# artifact `benchmark-<os>-<run_id>`. Each OS fails or succeeds alone.
#
# No secrets and no real model calls. Every suite that needs a model talks to
# scripts/perf/mock_llm_server.py on localhost, so a run costs no API credit and
# every tool sees the same deterministic replies.
#
# Results are reports, not gates. Wall-clock and RSS on a shared runner move with
# the machine, so nothing here fails on a threshold (docs/performance/BENCHMARK.md).
# A suite fails only when its script itself errors; a missing competitor is
# listed as skipped.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check out and measure (default: the triggering commit)"
        type: string
        required: false
        default: ""
      os:
        type: string
        required: false
        default: all
      suites:
        type: string
        required: false
        default: all
      competitors:
        description: "Comma-separated tools to compare with horon: jcode, claude_code, codex, opencode, pi, omp (oh-my-pi), omo (oh-my-openagent)"
        type: string
        required: false
        default: jcode,claude_code,codex,opencode,pi,omp,omo
      sessions:
        type: string
        required: false
        default: "1 5 10"
      turns:
        type: string
        required: false
        default: "3"
      oneshot_runs:
        type: string
        required: false
        default: "5"
      baseline_ref:
        description: "Optional ref built beside the measured commit and compared as a second horon row"
        type: string
        required: false
        default: ""
      features:
        description: "Cargo features added to the candidate release build only, e.g. jemalloc (empty builds exactly what ships)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      os:
        description: "Comma-separated OSes, each measured in its own job: linux, macos, windows, or all"
        required: false
        default: all
      suites:
        description: "Comma-separated suites: compare, startup, loading, tools, reload, compile, or all"
        required: false
        default: all
      competitors:
        description: "Comma-separated tools to compare with horon: jcode, claude_code, codex, opencode, pi, omp (oh-my-pi), omo (oh-my-openagent)"
        required: false
        default: jcode,claude_code,codex,opencode,pi,omp,omo
      sessions:
        description: "Concurrent session counts for the memory comparison (space-separated); wider spreads such as '1 10 100' make the per-session slope measurable"
        required: false
        default: "1 5 10"
      turns:
        description: "Turns per session for the memory comparison"
        required: false
        default: "3"
      oneshot_runs:
        description: "Samples per build for the one-shot, skill and MCP cells; the median needs at least 5 to separate two builds"
        required: false
        default: "5"
      baseline_ref:
        description: "Optional ref (usually the merge base with dev) built beside the measured commit and compared as a second horon row; empty measures one build"
        required: false
        default: ""
      features:
        description: "Cargo features added to the candidate release build only, e.g. jemalloc (empty builds exactly what ships; the baseline never gets them)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # `actions/checkout` runs `git init` on a fresh runner and git prints a hint
  # about the default branch name. Naming it removes the cause of the message.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  HORON_AGENT_CI: "1"
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  # Relative to the workspace, so the same path works in Git Bash on Windows.
  RESULTS: bench-results
  # Windows consoles default to a legacy code page; the reports carry "—" and "×".
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  plan:
    name: Select OSes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.os.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: scripts/perf

      - name: Turn the os input into a job matrix
        id: os
        shell: bash
        env:
          OS_INPUT: ${{ inputs.os }}
        run: python3 scripts/perf/bench_select.py --platforms "$OS_INPUT" | tee -a "$GITHUB_OUTPUT"

  benchmark:
    name: Benchmark (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/benchmark-os.yml
    with:
      ref: ${{ inputs.ref }}
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      suites: ${{ inputs.suites }}
      competitors: ${{ inputs.competitors }}
      sessions: ${{ inputs.sessions }}
      turns: ${{ inputs.turns }}
      oneshot_runs: ${{ inputs.oneshot_runs }}
      baseline_ref: ${{ inputs.baseline_ref }}
      features: ${{ inputs.features }}
