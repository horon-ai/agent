name: Benchmark one OS

# Called once per OS by benchmark.yml, never directly. Each OS is its own call,
# so its measure jobs start as soon as that OS's build is done instead of
# waiting for the slowest OS's build (run 42387481942 held every Linux
# measurement 7 minutes behind the Windows build).
#
# Per OS: `build` compiles the release binaries once, one `measure` job per
# suite unit runs that unit against them, `compile` rebuilds from source in a
# job of its own, and `merge` joins the parts into `benchmark-<os>-<run_id>`
# (#22). Intermediate artifacts are named `bench-bin-*` and `bench-part-*`, so
# benchmark-docs.yml, which downloads `benchmark-*-<run_id>`, never sees them.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      os:
        type: string
        required: true
      runner:
        type: string
        required: true
      suites:
        type: string
        required: true
      competitors:
        type: string
        required: true
      sessions:
        type: string
        required: true
      turns:
        type: string
        required: true
      oneshot_runs:
        type: string
        required: false
        default: "3"
      baseline_ref:
        description: "Optional ref built in the build job beside the measured commit; the compare unit measures it as a second horon row"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  HORON_AGENT_CI: "1"
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  # Relative to the workspace, so the same path works in Git Bash on Windows.
  RESULTS: bench-results
  # Windows consoles default to a legacy code page; the reports carry "—" and "×".
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  plan:
    name: Select suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      measure_matrix: ${{ steps.sel.outputs.measure_matrix }}
      has_measure: ${{ steps.sel.outputs.measure_has_jobs }}
      has_compile: ${{ steps.sel.outputs.compile_has_jobs }}
      units: ${{ steps.sel.outputs.units }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: scripts/perf

      - name: Turn the suites input into the measure matrix
        id: sel
        shell: bash
        env:
          OS_INPUT: ${{ inputs.os }}
          SUITES_INPUT: ${{ inputs.suites }}
        run: |
          set -euo pipefail
          {
            python3 scripts/perf/bench_select.py --jobs "$OS_INPUT" "$SUITES_INPUT" | sed 's/^/measure_/'
            python3 scripts/perf/bench_select.py --compile "$OS_INPUT" "$SUITES_INPUT" | sed 's/^/compile_/'
            python3 scripts/perf/bench_select.py --expect "$SUITES_INPUT"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    runs-on: ${{ inputs.runner }}
    # Two release builds when a baseline_ref is set: the candidate and the
    # baseline tree, each in its own target directory.
    timeout-minutes: 150
    concurrency:
      group: benchmark-${{ github.ref }}-${{ inputs.os }}-build
      cancel-in-progress: false
    env:
      RUSTUP_TOOLCHAIN: stable
      SUITES: ${{ inputs.suites }}
      # The baseline checkout lives inside the workspace because actions/checkout
      # only writes below $GITHUB_WORKSPACE. It is a sibling tree with its own
      # target directory, so neither build reuses the other's artifacts.
      BASELINE_DIR: .bench-baseline
      # The measured binary is built the way release.yml builds the shipped one:
      # the workspace's [profile.release] is tuned for fast local rebuilds
      # (opt-level 1, incremental), and the competitors are measured from their
      # own published release builds. Both horon builds here use these values.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty for a dispatch, so the dispatched ref's commit is measured.
          ref: ${{ inputs.ref }}

      - name: Free disk space
        # The shared script renames the unused hosted toolchains and returns at
        # once; the deletion continues while the toolchain installs (#21). This
        # job measures nothing, so it never waits for the deletion.
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        shell: bash
        run: bash scripts/ci/free_disk_space.sh

      - name: Free disk space (macOS)
        # A hosted macOS runner has the least free space of the three, and this
        # job can build two release trees when a baseline_ref is set. Skipped on
        # any self-hosted machine: its caches and toolchains are its owner's.
        if: ${{ !cancelled() && runner.os == 'macOS' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          sudo rm -rf /Users/runner/Library/Android /usr/local/share/dotnet \
            "$HOME/Library/Caches/Homebrew"
          df -h /

      - uses: ./.github/actions/msvc-dev-cmd
        if: ${{ runner.os == 'Windows' }}
        with:
          arch: amd64

      - name: Use the MSVC linker from bash
        # Every later step runs in Git Bash, whose /usr/bin/link.exe (coreutils)
        # comes before MSVC's in PATH, so cargo would call the wrong `link.exe`.
        # Naming the MSVC linker by its full path makes the PATH order irrelevant.
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $link = (Get-Command link.exe -All | Where-Object { $_.Source -like '*\MSVC\*' } | Select-Object -First 1).Source
          if (-not $link) { throw 'MSVC link.exe not found on PATH after msvc-dev-cmd' }
          Write-Output "MSVC linker: $link"
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-${{ runner.os }}
          # Save the dependency build even when a later step fails, so a rerun
          # does not rebuild every crate from scratch.
          cache-on-failure: "true"

      - name: Select suites
        id: sel
        shell: bash
        run: python3 scripts/perf/bench_select.py "$SUITES" >> "$GITHUB_OUTPUT"

      - name: Check out the baseline ref beside the measured commit
        # After the rust-cache step on purpose: rust-cache hashes every
        # .cargo/config.toml and rust-toolchain file under the workspace, and a
        # second tree there would fold the baseline commit into the candidate's
        # cache key. A before/after pair has to be measured on one machine in
        # one job, so the second tree appears only once that key is settled.
        if: ${{ inputs.baseline_ref != '' && steps.sel.outputs.compare == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref }}
          path: .bench-baseline

      - name: Hide the baseline tree from the candidate's git status
        # build-meta marks a build dirty when `git status --porcelain` is not
        # empty, so an untracked second checkout would label the measured
        # candidate "dirty" in its own --version output. `.git/info/exclude` is
        # local to this checkout, so no tracked file changes.
        if: ${{ inputs.baseline_ref != '' && steps.sel.outputs.compare == 'true' }}
        shell: bash
        run: |
          printf '/%s/\n' "$BASELINE_DIR" >> .git/info/exclude
          git status --porcelain
          test -z "$(git status --porcelain)"

      - uses: Swatinem/rust-cache@v2
        # The baseline tree gets its own cache entry and its own target
        # directory. Adding it as a second workspace to the step above would
        # fold its Cargo.lock into one key, so every baseline bump would
        # invalidate the candidate's cached artifacts too. Two separate steps
        # rather than two restores inside one: the action keeps its config in
        # per-step state, so only the second step's post would save anything.
        if: ${{ inputs.baseline_ref != '' && steps.sel.outputs.compare == 'true' }}
        with:
          key: benchmark-baseline-${{ runner.os }}
          workspaces: ".bench-baseline -> target"
          # ~/.cargo is shared with the candidate build, and this step's post
          # runs first. Trimming the registry to the baseline's dependency set
          # would then leave the candidate's own cache entry incomplete.
          cache-all-crates: "true"
          cache-on-failure: "true"

      - name: Build the baseline release binary
        # The same profile as the candidate step below, from its own checkout
        # and its own target directory, so neither build reuses the other's
        # artifacts and the two rows stay comparable. Only the compare unit
        # consumes this row, so nothing else pays for the second build. The
        # binary travels to the compare job inside bench-bin.tar as baseline/.
        if: ${{ !cancelled() && inputs.baseline_ref != '' && steps.sel.outputs.compare == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"
          git -C "$BASELINE_DIR" rev-parse HEAD > "$RESULTS/baseline-commit.txt"
          (
            cd "$BASELINE_DIR" || exit
            cargo build --release --locked -p horon-agent
          )
          exe=""
          [[ "$RUNNER_OS" == "Windows" ]] && exe=".exe"
          mkdir -p target/release/baseline
          cp "$BASELINE_DIR/target/release/horon-agent$exe" "target/release/baseline/horon-agent$exe"
          "./target/release/baseline/horon-agent$exe" --version | tee "$RESULTS/baseline-version.txt"

      - name: Build release binary and probes
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p horon-agent
          if [[ "${{ steps.sel.outputs.loading }}" == "true" ]]; then
            cargo build --release --locked -p horon-agent-base --example loading_probe
          fi
          exe=""
          [[ "$RUNNER_OS" == "Windows" ]] && exe=".exe"
          files=("horon-agent$exe")
          [[ -f "target/release/examples/loading_probe$exe" ]] && files+=("examples/loading_probe$exe")
          [[ -f "target/release/baseline/horon-agent$exe" ]] && files+=("baseline/horon-agent$exe")
          # A tar keeps the executable bit, which upload-artifact drops. The
          # archive path stays relative: Git Bash's tar reads `D:\...` as a
          # remote host (run 42387481942).
          tar -cf bench-bin.tar -C target/release "${files[@]}"
          mkdir -p "$RESULTS"
          git rev-parse HEAD > "$RESULTS/commit.txt"
          "./target/release/horon-agent$exe" --version | tee "$RESULTS/horon-version.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: bench-bin-${{ inputs.os }}-${{ github.run_id }}
          path: bench-bin.tar
          retention-days: 1

      - name: Record job outcome
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "$RESULTS"
          echo "${{ job.status }}" > "$RESULTS/status.txt"

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: bench-part-${{ inputs.os }}-build-${{ github.run_id }}
          path: bench-results/
          retention-days: 1

  measure:
    name: Measure (${{ matrix.unit }})
    needs: [plan, build]
    # One suite unit per job on its own machine. The rows of one suite's table
    # (horon against each competitor, each event count) still share one CPU,
    # disk, and load, which is the comparison that matters; different suites
    # and different OSes never compare numbers with each other.
    if: ${{ !cancelled() && needs.plan.outputs.has_measure == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    concurrency:
      group: benchmark-${{ github.ref }}-${{ inputs.os }}-measure-${{ matrix.unit }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.measure_matrix) }}
    env:
      COMPETITORS: ${{ inputs.competitors }}
      SESSIONS: ${{ inputs.sessions }}
      TURNS: ${{ inputs.turns }}
      ONESHOT_RUNS: ${{ inputs.oneshot_runs }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: bench-bin-${{ inputs.os }}-${{ github.run_id }}
          path: bench-bin-download

      - name: Unpack the release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-bin
          tar -xf bench-bin-download/bench-bin.tar -C bench-bin
          # Absolute paths in C:/... form on Windows, so Python can open them
          # from any working directory.
          root="$PWD"
          exe=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            root="$(cygpath -m "$PWD")"
            exe=".exe"
          fi
          echo "HORON_BIN=$root/bench-bin/horon-agent$exe" >> "$GITHUB_ENV"
          echo "PROBE_BIN=$root/bench-bin/examples/loading_probe$exe" >> "$GITHUB_ENV"
          if [[ -f "bench-bin/baseline/horon-agent$exe" ]]; then
            echo "BASELINE_BIN=$root/bench-bin/baseline/horon-agent$exe" >> "$GITHUB_ENV"
          fi
          mkdir -p "$RESULTS"

      - name: Install strace
        # The compare suite counts fsync/fdatasync calls with --syscalls. On a
        # runner without strace (macOS, Windows) the script records that as
        # skipped and still exits 0, so this step is Linux-only.
        if: ${{ matrix.unit == 'compare' && runner.os == 'Linux' }}
        shell: bash
        run: |
          if command -v strace >/dev/null 2>&1; then
            strace --version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq strace
          fi

      - name: Allow the Codex sandbox (bubblewrap) on Ubuntu 24.04
        # Codex runs its shell tool inside bubblewrap. On ubuntu-24.04 the
        # AppArmor user-namespace restriction leaves the new namespace without
        # capabilities, so every command fails with `bwrap: loopback: Failed
        # RTM_NEWADDR: Operation not permitted` and the skill scenario never
        # reads its SKILL.md. This is the setup Codex documents for 24.04
        # (developers.openai.com/codex/concepts/sandboxing): install bubblewrap
        # and load the `bwrap-userns-restrict` profile. The sandbox stays on.
        if: ${{ matrix.unit == 'compare' && runner.os == 'Linux' && contains(env.COMPETITORS, 'codex') }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
          # A failing check is reported, not fatal: the other rows still run,
          # and the Codex skill row then records the sandbox error it saw.
          if bwrap --unshare-all --ro-bind / / true; then
            echo "bwrap: namespace sandbox works"
          else
            echo "::warning::bwrap still cannot create its sandbox; the Codex skill row will show the error"
          fi

      - uses: actions/setup-node@v7
        if: ${{ matrix.unit == 'compare' }}
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        # omp's npm CLI is a Bun script and declares engines bun>=1.4.4; omo
        # prefers Bun when it is present. Both are optional competitors, so a
        # missing Bun only removes them (installer records a reason), but the
        # step itself must not fail the job.
        if: ${{ matrix.unit == 'compare' }}
        continue-on-error: true

      - name: Install competitor CLIs
        if: ${{ matrix.unit == 'compare' }}
        shell: bash
        env:
          # The jcode fallback calls the release API; a token avoids the shared
          # anonymous rate limit of the runner's IP.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/perf/install_competitors.sh "$RUNNER_TEMP/bench-tools" "$COMPETITORS" | tee "$RESULTS/competitors.txt"

      - name: "Suite: compare (horon vs other agents)"
        if: ${{ matrix.unit == 'compare' }}
        shell: bash
        run: |
          bins_args=""
          [[ -f "$RUNNER_TEMP/bench-tools/bins.args" ]] && bins_args=$(cat "$RUNNER_TEMP/bench-tools/bins.args")
          # The baseline build is a second horon row, measured in this same job
          # alternating with the candidate. --syscalls therefore counts fsync
          # for both builds under one strace-capable runner.
          baseline_args=()
          if [[ -n "${BASELINE_BIN:-}" ]]; then
            baseline_args=(--bin "horon-base=$BASELINE_BIN")
          else
            echo "baseline_ref not set: measuring one build only" | tee "$RESULTS/baseline-absent.txt"
          fi
          install_failures=()
          [[ -f "$RUNNER_TEMP/bench-tools/failures.txt" ]] && install_failures=(--install-failures "$RUNNER_TEMP/bench-tools/failures.txt")
          # The dispatched list decides what is measured. Without --tools the
          # script's default set would skip a competitor whose binary is
          # installed but whose name is not a default.
          tools="horon"
          IFS=',' read -r -a wanted <<<"$COMPETITORS"
          for tool in "${wanted[@]}"; do
            tool="$(echo "$tool" | tr -d '[:space:]')"
            [ -z "$tool" ] && continue
            [ "$tool" = "horon" ] && continue
            # The installer also accepts `claude`; the harness names that row claude_code.
            [ "$tool" = "claude" ] && tool=claude_code
            tools="$tools $tool"
          done
          # This step also measures the skill and MCP scenarios: the script's
          # default --scenarios is oneshot,sessions,skill,mcp.
          # shellcheck disable=SC2086
          python scripts/perf/bench_compare.py \
            --bin "horon=$HORON_BIN" ${baseline_args[@]+"${baseline_args[@]}"} $bins_args --tools $tools \
            ${install_failures[@]+"${install_failures[@]}"} \
            --sessions $SESSIONS --turns "$TURNS" --oneshot-runs "$ONESHOT_RUNS" --syscalls \
            --json-out "$RESULTS/compare.json" --markdown-out "$RESULTS/compare.md"

      - name: "Suite: startup"
        if: ${{ matrix.unit == 'startup' }}
        shell: bash
        run: python scripts/perf/bench_startup.py "$HORON_BIN" --runs 10 | tee "$RESULTS/startup.txt"

      - name: "Suite: loading (cold or warm)"
        if: ${{ matrix.unit == 'loading-cold' || matrix.unit == 'loading-warm' }}
        shell: bash
        env:
          MODE: ${{ matrix.unit == 'loading-cold' && 'cold' || 'warm' }}
        run: |
          python scripts/perf/bench_loading.py \
            --binary "$PROBE_BIN" \
            --mode "$MODE" --events 0,1000,10000 --skills 0,200 --iterations 10 \
            --emit "$RESULTS/loading-$MODE.json" | tee "$RESULTS/loading-$MODE.txt"

      - name: "Suite: tools"
        if: ${{ matrix.unit == 'tools' }}
        shell: bash
        run: |
          python scripts/perf/bench_tools.py --binary "$HORON_BIN" \
            --json-out "$RESULTS/tools.json" --markdown-out "$RESULTS/tools.md"

      - name: "Suite: reload storm"
        if: ${{ matrix.unit == 'reload' }}
        shell: bash
        run: |
          python scripts/perf/bench_reload_storm.py --binary "$HORON_BIN" \
            --json-out "$RESULTS/reload.json" --markdown-out "$RESULTS/reload.md"

      - name: Record job outcome
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "$RESULTS"
          echo "${{ job.status }}" > "$RESULTS/status.txt"

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: bench-part-${{ inputs.os }}-${{ matrix.unit }}-${{ github.run_id }}
          path: bench-results/
          retention-days: 1

  compile:
    name: Measure (compile)
    needs: plan
    # Its own job: it touches source mtimes and rebuilds, so no other suite
    # shares the machine with it.
    if: ${{ needs.plan.outputs.has_compile == 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    concurrency:
      group: benchmark-${{ github.ref }}-${{ inputs.os }}-compile
      cancel-in-progress: false
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Free disk space
        # Same script as the build job; `--wait` below keeps the deletion IO
        # off the measurement (#21).
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        shell: bash
        run: bash scripts/ci/free_disk_space.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: ./.github/actions/msvc-dev-cmd
        if: ${{ runner.os == 'Windows' }}
        with:
          arch: amd64

      - name: Use the MSVC linker from bash
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $link = (Get-Command link.exe -All | Where-Object { $_.Source -like '*\MSVC\*' } | Select-Object -First 1).Source
          if (-not $link) { throw 'MSVC link.exe not found on PATH after msvc-dev-cmd' }
          Write-Output "MSVC linker: $link"
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate from the build job's key: this job builds the dev profile
          # for `cargo check`, the build job the release profile.
          key: benchmark-compile-${{ runner.os }}
          cache-on-failure: "true"

      - name: Wait for free disk space deletion
        if: ${{ !cancelled() && runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        shell: bash
        run: bash scripts/ci/free_disk_space.sh --wait

      - name: "Suite: compile"
        shell: bash
        run: |
          mkdir -p "$RESULTS"
          python scripts/perf/bench_compile.py \
            --json-out "$RESULTS/compile.json" --markdown-out "$RESULTS/compile.md"

      - name: Record job outcome
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "$RESULTS"
          echo "${{ job.status }}" > "$RESULTS/status.txt"

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: bench-part-${{ inputs.os }}-compile-${{ github.run_id }}
          path: bench-results/
          retention-days: 1

  merge:
    name: Merge
    needs: [plan, build, measure, compile]
    # Runs even when a part failed or was skipped: the merged status.txt is
    # what tells bench_docs.py the OS did not finish cleanly.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: benchmark-${{ github.ref }}-${{ inputs.os }}-merge
      cancel-in-progress: false
    env:
      SUITES: ${{ inputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: scripts/perf

      - uses: actions/download-artifact@v8
        # A part that never uploaded is reported as missing by bench_merge.py,
        # so an empty match must not end the job before the merge runs.
        continue-on-error: true
        with:
          pattern: bench-part-${{ inputs.os }}-*-${{ github.run_id }}
          path: ${{ runner.temp }}/parts

      - name: Merge the parts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/parts"
          python3 scripts/perf/bench_merge.py --parts "$RUNNER_TEMP/parts" --out "$RESULTS" \
            --os "${{ inputs.os }}" --runner "${{ inputs.runner }}" \
            --expect "${{ needs.plan.outputs.units }}"

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Benchmark (${{ inputs.os }})"
            echo
            echo "- commit: \`$(cat "$RESULTS/commit.txt" 2>/dev/null)\`, runner: \`${{ inputs.runner }}\`"
            if [[ -s "$RESULTS/baseline-commit.txt" ]]; then
              echo "- baseline commit: \`$(cat "$RESULTS/baseline-commit.txt")\` (measured beside the commit above)"
            fi
            echo "- suites: \`$SUITES\`, status: \`$(cat "$RESULTS/status.txt")\`"
            echo
            for f in compare tools reload compile; do
              if [[ -f "$RESULTS/$f.md" ]]; then cat "$RESULTS/$f.md"; echo; fi
            done
            for f in startup loading-cold loading-warm; do
              if [[ -f "$RESULTS/$f.txt" ]]; then
                echo "### $f"; echo; echo '```'; cat "$RESULTS/$f.txt"; echo '```'; echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ inputs.os }}-${{ github.run_id }}
          path: bench-results/
          retention-days: 30

      - name: Fail when a part did not succeed
        # Same workflow result as the single-job layout: an OS with a failed or
        # missing part is a failed job, after its partial results are uploaded.
        shell: bash
        run: test "$(cat "$RESULTS/status.txt")" = success
