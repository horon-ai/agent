name: Release Recovery Validation

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-recovery.yml'
      - '.github/workflows/release-tag.yml'
      - 'scripts/release/**'
      - 'tests/*release*.py'
      - 'scripts/install/install.sh'
      - 'scripts/ci/install_justrust.sh'
      - 'scripts/release/build_linux_compat.sh'
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-recovery.yml'
      - '.github/workflows/release-tag.yml'
      - 'scripts/release/**'
      - 'tests/*release*.py'
      - 'scripts/install/install.sh'
      - 'scripts/ci/install_justrust.sh'
      - 'scripts/release/build_linux_compat.sh'
  workflow_dispatch:

env:
  # `actions/checkout` runs `git init` on a fresh runner and git prints a hint
  # about the default branch name. Naming it removes the cause of the message.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

permissions:
  contents: read

concurrency:
  group: release-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Preparation regressions exercise historical tags in isolated clones.
          fetch-depth: 0
      - name: Test release source preparation, exact-commit authorization, public assets and watcher
        run: python3 -m unittest discover -s tests -p '*release*.py'
      - name: Test release preparation
        run: python3 -m unittest discover -s scripts/release -p 'test_*release*.py'
      - name: Test installer release metadata validation
        run: bash scripts/install/test_install_from_source.sh
