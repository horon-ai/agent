name: Install benchmark

# Called by benchmark.yml when `suites` names `install`, never directly. On a
# disposable GitHub-hosted machine with a real internet connection it measures
# installing horon beside installing the competing tools, cold and warm, per OS
# and architecture, and reports the total from the first install starting to the
# first version call finishing with its two parts, install_ms and
# first_version_ms.
#
# RELEASE_TAG pins one public release: install-release verifies, extracts and
# activates those bytes from any tree, so the tree contributes only the install
# path and a baseline_ref checkout is measured against the same assets in the
# same job. Nothing compiles Rust or writes a release. A failed horon install
# writes its report and fails the job; a competitor with no install path on the
# platform is recorded as skipped. The Windows installer edits the per-user
# PATH, so these jobs run only on disposable runners.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      os:
        description: "Comma-separated OS groups: linux, macos, windows, freebsd, or all"
        type: string
        required: true
      competitors:
        description: "Comma-separated tools installed beside horon: jcode, claude_code, codex, opencode, pi, omp, omo"
        type: string
        required: true
      runs:
        type: string
        default: "5"
      baseline_ref:
        type: string
        default: ""
      jcode_version:
        description: "Published jcode tag resolved once by benchmark.yml; empty lets each job resolve the newest stable release"
        type: string
        default: ""
      jcode_release_commit:
        description: "Commit the resolved jcode tag peeled to; the installer refuses a tag that has moved"
        type: string
        default: ""
      jcode_release_source:
        description: "How benchmark.yml chose the tag: latest (newest stable release) or pin (explicit jcode_version)"
        type: string
        default: ""

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  RESULTS: install-results
  # One public release for every platform of this round; another release is a
  # one-line edit here, never an implicit lookup.
  RELEASE_TAG: v0.1.14

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.map.outputs.matrix }}
    steps:
      - name: Map the os input to one job per OS and architecture
        id: map
        shell: bash
        env:
          OS_INPUT: ${{ inputs.os }}
          RUNS: ${{ inputs.runs }}
          COMPETITORS: ${{ inputs.competitors }}
          JCODE_VERSION: ${{ inputs.jcode_version }}
          JCODE_RELEASE_COMMIT: ${{ inputs.jcode_release_commit }}
          JCODE_RELEASE_SOURCE: ${{ inputs.jcode_release_source }}
        run: |
          set -euo pipefail
          if [[ ! "$RUNS" =~ ^[0-9]+$ ]] || [ "$RUNS" -lt 5 ]; then
            echo '::error::runs must be an integer of at least 5'; exit 1
          fi
          # The value reaches the FreeBSD guest's shell word for word.
          if [[ -n "$COMPETITORS" && ! "$COMPETITORS" =~ ^[a-z0-9_,.-]+$ ]]; then
            echo '::error::invalid competitor list'; exit 1
          fi
          # benchmark.yml resolves these; reject anything that could change the
          # shell meaning of a value the guest receives.
          if [[ -n "$JCODE_VERSION" && ! "$JCODE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::jcode_version must be a published vX.Y.Z tag'; exit 1
          fi
          if [[ -n "$JCODE_RELEASE_COMMIT" && ! "$JCODE_RELEASE_COMMIT" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo '::error::jcode_release_commit must be a hex commit'; exit 1
          fi
          if [[ -n "$JCODE_RELEASE_SOURCE" && ! "$JCODE_RELEASE_SOURCE" =~ ^(latest|pin)$ ]]; then
            echo '::error::jcode_release_source must be latest or pin'; exit 1
          fi
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, os
          # OS group -> one entry per architecture; the platform label names the
          # report and the artifact. FreeBSD runs in a VM on an Ubuntu machine.
          GROUPS = {
              "linux": [("linux-x86_64", "ubuntu-24.04"), ("linux-aarch64", "ubuntu-24.04-arm")],
              "macos": [("macos-aarch64", "macos-latest"), ("macos-x86_64", "macos-15-intel")],
              "windows": [("windows-x86_64", "windows-latest"), ("windows-aarch64", "windows-11-arm")],
              "freebsd": [("freebsd-x86_64", "ubuntu-24.04")],
          }
          tokens = [p.strip().lower() for p in os.environ["OS_INPUT"].replace(" ", ",").split(",") if p.strip()]
          tokens = list(GROUPS) if not tokens or "all" in tokens else tokens
          unknown = sorted(set(tokens) - set(GROUPS))
          if unknown:
              raise SystemExit(f"unknown OS group(s): {', '.join(unknown)}; known: all, {', '.join(GROUPS)}")
          entries = [{"platform": name, "runner": runner}
                     for key in GROUPS if key in tokens for name, runner in GROUPS[key]]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps({"include": entries}, separators=(",", ":")) + "\n")
          PY

  measure:
    name: Install (${{ matrix.platform }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Cold and warm installs of up to seven tools, each a real download and
    # checksum verification; the long bound also covers the FreeBSD VM boot.
    timeout-minutes: 180
    env:
      COMPETITORS: ${{ inputs.competitors }}
      RUNS: ${{ inputs.runs }}
      PLATFORM: ${{ matrix.platform }}
      CANDIDATE_DIR: ${{ inputs.ref != '' && '.bench-candidate' || '' }}
      BASELINE_DIR: ${{ inputs.baseline_ref != '' && '.bench-baseline' || '' }}
      # The tag resolved once for this round. Every cold and warm sample installs
      # and verifies this release instead of asking GitHub for "latest" again.
      JCODE_VERSION: ${{ inputs.jcode_version }}
      JCODE_RELEASE_COMMIT: ${{ inputs.jcode_release_commit }}
      JCODE_RELEASE_SOURCE: ${{ inputs.jcode_release_source }}
      # bench_install.py hands this only to the installer subprocess, never to an
      # installed binary or an npm script: verification needs the API rate limit,
      # a measured tool does not need the credential.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: harness
        with:
          # Native installers and npm run third-party code here; the token stays
          # out of the checkout's git config.
          persist-credentials: false

      - name: Check out the candidate install path
        id: candidate
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          path: .bench-candidate
          persist-credentials: false

      - name: Check out the baseline install path
        id: baseline
        if: ${{ inputs.baseline_ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.baseline_ref }}
          path: .bench-baseline
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: ${{ matrix.platform != 'freebsd-x86_64' }}
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ matrix.platform != 'freebsd-x86_64' }}
        with:
          node-version: "24"

      - name: Measure install and first version (Unix shell)
        if: ${{ matrix.platform != 'freebsd-x86_64' && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"
          args=(scripts/perf/bench_install.py --tag "$RELEASE_TAG" --runs "$RUNS"
                --competitors "$COMPETITORS" --output "$RESULTS/install-${PLATFORM}.json")
          [ -z "${BASELINE_DIR:-}" ] || args+=(--baseline-dir "$BASELINE_DIR")
          python3 "${args[@]}" | tee "$RESULTS/install-${PLATFORM}.txt"

      - name: Measure install and first version (Windows PowerShell)
        if: ${{ matrix.platform != 'freebsd-x86_64' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path $env:RESULTS | Out-Null
          $installArgs = @('scripts/perf/bench_install.py', '--tag', $env:RELEASE_TAG,
            '--runs', $env:RUNS, '--competitors', $env:COMPETITORS,
            '--output', "$env:RESULTS/install-$env:PLATFORM.json")
          if ($env:BASELINE_DIR) { $installArgs += @('--baseline-dir', $env:BASELINE_DIR) }
          & python @installArgs *>&1 | Tee-Object -FilePath "$env:RESULTS/install-$env:PLATFORM.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure install and first version in the FreeBSD VM
        if: ${{ matrix.platform == 'freebsd-x86_64' }}
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        env:
          INSTALL_CANDIDATE_HEAD: ${{ steps.candidate.outputs.commit || steps.harness.outputs.commit }}
          INSTALL_BASELINE_HEAD: ${{ steps.baseline.outputs.commit }}
        with:
          release: "15.1"
          usesh: true
          mem: 4096
          cpu: 2
          envs: RELEASE_TAG RUNS COMPETITORS CANDIDATE_DIR BASELINE_DIR GITHUB_ACTIONS RUNNER_ENVIRONMENT INSTALL_CANDIDATE_HEAD INSTALL_BASELINE_HEAD JCODE_VERSION JCODE_RELEASE_COMMIT JCODE_RELEASE_SOURCE GH_TOKEN
          # Python drives the harness, bash runs the installer, coreutils
          # supplies the GNU tools the checksum probes look for, and Node plus
          # npm are what the npm competitors install through.
          prepare: |
            pkg install -y python3 bash curl coreutils node npm git
          run: |
            set -e -o pipefail
            mkdir -p install-results
            set -- --tag "$RELEASE_TAG" --runs "$RUNS" --competitors "$COMPETITORS" \
              --output install-results/install-freebsd-x86_64.json
            if [ -n "${BASELINE_DIR:-}" ]; then set -- "$@" --baseline-dir "$BASELINE_DIR"; fi
            rc=0
            python3 scripts/perf/bench_install.py "$@" >install-results/install-freebsd-x86_64.txt 2>&1 || rc=$?
            cat install-results/install-freebsd-x86_64.txt
            # Copy the guest's JSON back before turning a failed sample into a failed job.
            echo "$rc" >install-results/freebsd-exit.txt

      - name: Check FreeBSD samples
        if: ${{ matrix.platform == 'freebsd-x86_64' }}
        shell: bash
        run: test "$(cat install-results/freebsd-exit.txt)" = 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        # Uploaded even when the measurement failed, so failed horon data stays
        # beside the job's failing exit status.
        if: ${{ always() }}
        with:
          name: install-${{ matrix.platform }}-${{ github.run_id }}
          path: install-results/
          retention-days: 30

  summarize:
    name: Install results
    needs: [plan, measure]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/perf
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: install-*-${{ github.run_id }}
          path: collected
          merge-multiple: true

      - name: Write the installation table
        if: ${{ always() }}
        shell: bash
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RUNS: ${{ inputs.runs }}
          COMPETITORS: ${{ inputs.competitors }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          python3 scripts/perf/install_summary.py --reports collected --matrix "$MATRIX" \
            --runs "$RUNS" --competitors "$COMPETITORS" --baseline-ref "$BASELINE_REF" \
            | tee install-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: install-summary-${{ github.run_id }}
          path: install-summary.md
          retention-days: 30
          overwrite: true
