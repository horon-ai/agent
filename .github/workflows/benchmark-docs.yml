name: Benchmark docs

# After a push to `main` passes CI, measure the commit with every benchmark suite
# on Linux, macOS and Windows (one job each) and write the result into the
# generated blocks of the documentation site's results page
# (packages/docs-site/reference/performance/results.mdx and its Korean pair) on
# both `main` and `dev`, one section per OS. A branch that still keeps the page at
# docs/performance/RESULTS.md (a `main` before the release that moved it) is
# written there instead.
#
# The run is skipped unless the agent code changed since the commit the block
# last recorded (paths in `CODE_PATHS`), so a docs-only push costs nothing. The
# structural performance gate for the same commit must also have succeeded: "all
# tests passed" means CI and that gate, which carries its own `on:` block.
#
# The docs commits are pushed with a Horon AI Bot installation token: the
# repository ruleset requires `CI Required` and `Structural performance required`
# on `main` and `dev`, and the bot is on its bypass list (GITHUB_TOKEN cannot be).
# A push made with an app token would start workflows, so each commit message
# carries `[skip ci]`: no CI run, no `release-tag.yml`, no new run of this file.
# Even without it, a docs-only diff fails the code-change gate above.
#
# `workflow_run` only fires from the copy of this file on the default branch, so
# the automation starts once this file is on `main`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Measure main HEAD and rewrite RESULTS/README even if CODE_PATHS did not change"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  # One measurement at a time; a newer main commit waits instead of cancelling
  # the run that is already writing docs.
  group: benchmark-docs
  cancel-in-progress: false

env:
  # `actions/checkout` runs `git init` on a fresh runner and git prints a hint
  # about the default branch name. Naming it removes the cause of the message.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  DOC: packages/docs-site/reference/performance/results.mdx
  DOC_KO: packages/docs-site/ko/reference/performance/results.mdx
  # SVG charts bench_docs.py draws for the site page (bench_charts.py).
  CHARTS: packages/docs-site/images/reference/performance/charts
  # Where a branch that predates the move keeps the same page and charts.
  OLD_DOC: docs/performance/RESULTS.md
  OLD_DOC_KO: docs/performance/RESULTS.ko.md
  OLD_CHARTS: docs/performance/charts
  CODE_PATHS: src crates Cargo.toml Cargo.lock .cargo rust-toolchain.toml scripts/perf

jobs:
  gate:
    name: Gate (CI passed, code changed)
    # A first-party push to main whose CI run succeeded, or a manual dispatch
    # directly on main. Fork code never reaches this point.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
      sha: ${{ steps.changed.outputs.sha }}
    env:
      SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Did the agent code change since the last measurement?
        id: changed
        shell: bash
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [[ "${FORCE_RUN:-false}" == "true" ]]; then
            echo "workflow_dispatch (force=true): measuring $SHA"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          doc="$DOC"; [[ -f "$doc" ]] || doc="$OLD_DOC"
          base=$(python3 scripts/perf/bench_docs.py last-commit --doc "$doc")
          if [[ -n "$base" ]] && git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
            echo "last measured commit: $base"
          else
            # No measurement yet, or it is not in this history: compare with the
            # parent, which is the previous main commit for a squash or merge push.
            base=$(git rev-parse --verify --quiet HEAD^1 || true)
            echo "no usable recorded commit; comparing with parent ${base:-<none>}"
          fi
          if [[ -z "$base" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # shellcheck disable=SC2086
          changed=$(git diff --name-only "$base" HEAD -- $CODE_PATHS)
          if [[ -n "$changed" ]]; then
            printf 'changed agent code:\n%s\n' "$changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no agent code change since $base; nothing to measure"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the structural performance gate on the same commit
        if: steps.changed.outputs.run == 'true' && github.event_name == 'workflow_run'
        shell: bash
        run: |
          for _ in $(seq 1 80); do
            state=$(gh run list -R "$GITHUB_REPOSITORY" --workflow structural-perf.yml \
              --commit "$SHA" --event push --limit 1 --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion)"' || true)
            echo "structural-perf: ${state:-not started}"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "::error::structural performance gate did not succeed for $SHA"; exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::structural performance gate did not finish for $SHA within 80 minutes"
          exit 1

  benchmark:
    name: Benchmark
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/benchmark.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      harness_ref: ${{ needs.gate.outputs.sha }}
      os: all
      suites: all
      competitors: jcode,claude_code,codex,opencode,pi,omp,omo

  docs:
    name: Write RESULTS.md on main and dev
    needs: [gate, benchmark]
    # An OS whose job failed still uploads what it measured and is marked as
    # failed in its section, so one OS never hides the other two. Nothing is
    # written when the whole benchmark was cancelled or never ran.
    if: >-
      !cancelled() && needs.gate.outputs.run == 'true' &&
      (needs.benchmark.result == 'success' || needs.benchmark.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SHA: ${{ needs.gate.outputs.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PYTHONUTF8: "1"
    steps:
      - name: Mint the Horon AI Bot token
        id: bot
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.HORON_AI_BOT_APP_ID }}
          private-key: ${{ secrets.HORON_AI_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          # The pushes below use this token, so the ruleset lets them through.
          token: ${{ steps.bot.outputs.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # One sub-directory per OS job; bench_docs.py finds each by platform.txt.
          pattern: benchmark-*-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-results

      - name: Commit the measurement to main and dev
        shell: bash
        run: |
          # Use the renderer and its dependencies from the measured commit,
          # even when the target branch carries older copies of the scripts.
          cp scripts/perf/*.py "$RUNNER_TEMP/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --quiet origin main:refs/remotes/origin/main
          short=$(git rev-parse --short "$SHA")
          failed=()
          for branch in main dev; do
            ok=false
            # Retry when someone pushes to the branch between fetch and push.
            for attempt in 1 2 3; do
              git fetch --quiet origin "$branch"
              git switch --quiet -C "$branch" "origin/$branch"
              rendered=true
              doc="$DOC" doc_ko="$DOC_KO" charts="$CHARTS"
              if [[ ! -f "$doc" ]]; then
                doc="$OLD_DOC" doc_ko="$OLD_DOC_KO" charts="$OLD_CHARTS"
              fi
              # RESULTS mixes every suite, so it is replaced only when this run
              # measured each suite group; the README summary is compare-derived
              # and is safe to refresh from a compare-only artifact set too.
              for pair in "$doc:en" "$doc_ko:ko"; do
                if ! python3 "$RUNNER_TEMP/bench_docs.py" render --doc "${pair%:*}" \
                    --results "$RUNNER_TEMP/bench-results" --commit "$SHA" \
                    --run-url "$RUN_URL" --lang "${pair#*:}" --require-complete \
                    --require-all-competitors --require-main-commit --main-ref origin/main; then
                  echo "::error::$branch: ${pair%:*} has no usable bench-auto block"
                  rendered=false
                fi
              done
              for pair in "README.md:en" "README.ko.md:ko"; do
                if ! python3 "$RUNNER_TEMP/bench_docs.py" render --doc "${pair%:*}" \
                    --results "$RUNNER_TEMP/bench-results" --commit "$SHA" \
                    --run-url "$RUN_URL" --lang "${pair#*:}" --require-all-competitors \
                    --require-main-commit --main-ref origin/main; then
                  echo "::error::$branch: ${pair%:*} has no usable bench-summary block"
                  rendered=false
                fi
              done
              [[ "$rendered" == true ]] || break
              # A branch that still keeps the page under docs/ mirrors it into the
              # site with its own generator; on the site layout the page is the
              # source and there is nothing to mirror.
              mirror=false
              if [[ "$doc" == "$OLD_DOC" && -f scripts/ci/sync_docs_site.py ]]; then
                mirror=true
                python3 scripts/ci/sync_docs_site.py || {
                  echo "::error::$branch: docs site mirror could not be regenerated"
                  break
                }
              fi
              # Stage first so charts drawn for the first time are seen as changes.
              git add -A -- "$doc" "$doc_ko" "$charts" README.md README.ko.md
              if [[ "$mirror" == true ]]; then
                git add -A -- packages/docs-site/reference packages/docs-site/ko/reference \
                  packages/docs-site/images/reference
              fi
              if git diff --cached --quiet; then
                echo "$branch: already up to date"; ok=true; break
              fi
              git commit --quiet -m "docs(perf): record benchmark for $short [skip ci]"
              if git push --quiet origin "HEAD:$branch"; then
                echo "$branch: pushed $(git rev-parse --short HEAD)"; ok=true; break
              fi
              echo "$branch: push rejected (attempt $attempt), refetching"
            done
            [[ "$ok" == true ]] || failed+=("$branch")
          done
          if (( ${#failed[@]} )); then
            echo "::error::benchmark docs not written to: ${failed[*]}"
            exit 1
          fi
