name: Benchmark docs

# After a push to `main` passes CI, measure the commit with every benchmark suite
# and write the result into the generated block of docs/performance/RESULTS.md on
# both `main` and `dev`.
#
# The run is skipped unless the agent code changed since the commit the block
# last recorded (paths in `CODE_PATHS`), so a docs-only push costs nothing. The
# structural performance gate for the same commit must also have succeeded: "all
# tests passed" means CI and that gate, which carries its own `on:` block.
#
# The docs commits are pushed with GITHUB_TOKEN. GitHub does not start workflows
# for those pushes, so this never feeds itself; even if it did, a docs-only diff
# fails the code-change gate above.
#
# `workflow_run` only fires from the copy of this file on the default branch, so
# the automation starts once this file is on `main`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # One measurement at a time; a newer main commit waits instead of cancelling
  # the run that is already writing docs.
  group: benchmark-docs
  cancel-in-progress: false

env:
  DOC: docs/performance/RESULTS.md
  CODE_PATHS: src crates Cargo.toml Cargo.lock .cargo rust-toolchain.toml scripts/perf

jobs:
  gate:
    name: Gate (CI passed, code changed)
    # A first-party push to main whose CI run succeeded. Fork code never reaches
    # this point: workflow_run on `branches: [main]` with event `push` is a push
    # to this repository's main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
      sha: ${{ github.event.workflow_run.head_sha }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Did the agent code change since the last measurement?
        id: changed
        shell: bash
        run: |
          base=$(python3 scripts/perf/bench_docs.py last-commit --doc "$DOC")
          if [[ -n "$base" ]] && git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
            echo "last measured commit: $base"
          else
            # No measurement yet, or it is not in this history: compare with the
            # parent, which is the previous main commit for a squash or merge push.
            base=$(git rev-parse --verify --quiet HEAD^1 || true)
            echo "no usable recorded commit; comparing with parent ${base:-<none>}"
          fi
          if [[ -z "$base" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # shellcheck disable=SC2086
          changed=$(git diff --name-only "$base" HEAD -- $CODE_PATHS)
          if [[ -n "$changed" ]]; then
            printf 'changed agent code:\n%s\n' "$changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no agent code change since $base; nothing to measure"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the structural performance gate on the same commit
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          for _ in $(seq 1 80); do
            state=$(gh run list -R "$GITHUB_REPOSITORY" --workflow structural-perf.yml \
              --commit "$SHA" --event push --limit 1 --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion)"' || true)
            echo "structural-perf: ${state:-not started}"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "::error::structural performance gate did not succeed for $SHA"; exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::structural performance gate did not finish for $SHA within 80 minutes"
          exit 1

  benchmark:
    name: Benchmark
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/benchmark.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      suites: all
      # Repository variable BENCHMARK_RUNNER=macos-persistent moves the
      # measurement to the quieter self-hosted machine.
      runner: ${{ vars.BENCHMARK_RUNNER || 'ubuntu-24.04' }}

  docs:
    name: Write RESULTS.md on main and dev
    needs: [gate, benchmark]
    if: needs.gate.outputs.run == 'true' && needs.benchmark.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SHA: ${{ needs.gate.outputs.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUNNER_LABEL: ${{ vars.BENCHMARK_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-results

      - name: Commit the measurement to main and dev
        shell: bash
        run: |
          # The renderer comes from the measured commit; each branch's own copy
          # of the script may be older.
          cp scripts/perf/bench_docs.py "$RUNNER_TEMP/bench_docs.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          short=$(git rev-parse --short "$SHA")
          failed=()
          for branch in main dev; do
            ok=false
            # Retry when someone pushes to the branch between fetch and push.
            for attempt in 1 2 3; do
              git fetch --quiet origin "$branch"
              git switch --quiet -C "$branch" "origin/$branch"
              if ! python3 "$RUNNER_TEMP/bench_docs.py" render --doc "$DOC" \
                  --results "$RUNNER_TEMP/bench-results" --commit "$SHA" \
                  --run-url "$RUN_URL" --runner "$RUNNER_LABEL"; then
                echo "::error::$branch: $DOC has no usable bench-auto block"
                break
              fi
              if git diff --quiet -- "$DOC"; then
                echo "$branch: already up to date"; ok=true; break
              fi
              git commit --quiet -m "docs(perf): record benchmark for $short" -- "$DOC"
              if git push --quiet origin "HEAD:$branch"; then
                echo "$branch: pushed $(git rev-parse --short HEAD)"; ok=true; break
              fi
              echo "$branch: push rejected (attempt $attempt), refetching"
            done
            [[ "$ok" == true ]] || failed+=("$branch")
          done
          if (( ${#failed[@]} )); then
            echo "::error::benchmark docs not written to: ${failed[*]}"
            exit 1
          fi
