name: Publish Python SDK

env:
  # `actions/checkout` runs `git init` on a fresh runner and git prints a hint
  # about the default branch name. Naming it removes the cause of the message.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  HORON_AGENT_CI: "1"
  # CI builds without the local parallel-frontend rustc wrapper from
  # .cargo/config.toml (a POSIX shell script; see scripts/dev/rustc_parallel_frontend).
  CARGO_BUILD_RUSTC_WRAPPER: ""

on:
  workflow_dispatch:
    inputs:
      horon_agent_release_tag:
        description: Released horon-agent tag whose binaries should be bundled
        required: true

permissions:
  contents: read

# Two dispatches for the same tag would race to upload one version.
concurrency:
  group: publish-python-${{ inputs.horon_agent_release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish horon-agent-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: pypi
    env:
      # The pinned 1.99.1 toolchain would otherwise shadow the installed stable
      # toolchain and download it a second time.
      RUSTUP_TOOLCHAIN: stable
    permissions:
      contents: read
      # PyPI trusted publishing: no long-lived token is stored in the repository.
      id-token: write
    defaults:
      run:
        working-directory: packages/sdk/python
    steps:
      # PyPI only accepts a trusted publish from a registered publisher, and the
      # rejection otherwise appears at the very last step after a full build.
      # Exchange the OIDC token up front so a missing pending publisher fails
      # here with the exact setup the owner must perform.
      - name: Verify PyPI trusted publishing is configured
        working-directory: ${{ github.workspace }}
        env:
          PYPI_PROJECT: horon-agent-sdk
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::PyPI trusted publishing needs a GitHub OIDC token, but this job received none. Add 'permissions: id-token: write' to the publish job."
            exit 1
          fi

          if ! audience="$(curl -fsS https://pypi.org/_/oidc/audience \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["audience"])')"; then
            echo "::error::Could not read the trusted-publishing audience from https://pypi.org/_/oidc/audience. Check network access to PyPI."
            exit 1
          fi
          if ! oidc_token="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')"; then
            echo "::error::Could not obtain a GitHub OIDC token for PyPI. Confirm 'permissions: id-token: write' on the publish job."
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data-binary "{\"token\": \"${oidc_token}\"}" \
            https://pypi.org/_/oidc/mint-token)"

          if [ "${status}" != "200" ]; then
            echo "::error::PyPI rejected the trusted-publisher exchange (HTTP ${status}). On PyPI, add a pending trusted publisher under Your account -> Publishing: project '${PYPI_PROJECT}', owner 'horon-ai', repository 'agent', workflow 'publish-python-sdk.yml', environment 'pypi'."
            exit 1
          fi
          echo "::notice::PyPI trusted publisher accepted the OIDC exchange for ${PYPI_PROJECT}."

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enforce Rust, TypeScript, and Python SDK surface parity
        working-directory: ${{ github.workspace }}
        run: cargo test -p horon-agent-sdk parity -- --nocapture

      - name: Validate SDK
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest

      - name: Download released horon-agent runtimes
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sdk-runtime-assets
          gh release download "${{ inputs.horon_agent_release_tag }}" --dir sdk-runtime-assets \
            --pattern 'horon-agent-linux-x86_64.tar.gz' \
            --pattern 'horon-agent-linux-aarch64.tar.gz' \
            --pattern 'horon-agent-macos-x86_64.tar.gz' \
            --pattern 'horon-agent-macos-aarch64.tar.gz' \
            --pattern 'horon-agent-windows-x86_64.tar.gz' \
            --pattern 'horon-agent-windows-aarch64.tar.gz'

      # One pure wheel (no runtime, falls back to PATH), the sdist, and six
      # platform wheels with the runtime under horon_agent_sdk/_bin/. pip and uv
      # pick the platform wheel matching the consumer's machine.
      - name: Build sdist and wheels
        working-directory: ${{ github.workspace }}
        run: bash scripts/sdk/build_python_wheels.sh sdk-runtime-assets sdk-python-dist

      - name: Publish to PyPI
        working-directory: ${{ github.workspace }}
        run: uv publish --trusted-publishing always sdk-python-dist/*
