name: FreeBSD Smoke

env:
  # `actions/checkout` runs `git init` on a fresh runner and git prints a hint
  # about the default branch name. Naming it removes the cause of the message.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  HORON_AGENT_CI: "1"
  # CI builds without the local parallel-frontend rustc wrapper from
  # .cargo/config.toml (a POSIX shell script; see scripts/dev/rustc_parallel_frontend).
  CARGO_BUILD_RUSTC_WRAPPER: ""

# Builds and smoke-tests horon-agent inside a real FreeBSD VM.
#
# GitHub does not offer native FreeBSD runners, so we boot a FreeBSD guest
# (via QEMU) on a standard Ubuntu runner using vmactions/freebsd-vm. This runs
# the actual FreeBSD kernel and userland, giving a true build + run check
# instead of a cross-compile that can never link platform C dependencies
# (e.g. aws-lc-sys). See issue #416.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Build in release mode (slower, matches shipping binary)
        required: false
        default: false
        type: boolean
  # A branch that edits this workflow is checked with
  # `gh workflow run freebsd-smoke.yml --ref <branch>`; `main` is covered by the
  # weekly schedule below, so a push only runs here on `dev`.
  push:
    branches: [dev]
    paths:
      - '.github/workflows/freebsd-smoke.yml'
  schedule:
    # Weekly drift check so FreeBSD breakage is caught even without a push.
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: freebsd-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: FreeBSD Smoke (x86_64)
    runs-on: ubuntu-24.04
    # QEMU with 3 cargo jobs compiles the binary plus the platform test harness;
    # 120 minutes left no headroom on a cold hosted runner.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The QEMU guest disk image plus the in-VM build needs more room than a
      # stock hosted runner has free on /.
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: "15.1"
          usesh: true
          # Give the build VM enough room: aws-lc-sys + tract pull in heavy C/Rust.
          mem: 6144
          cpu: 4
          # Install the toolchain horon-agent needs. The project is OpenSSL-free
          # (rustls + aws-lc-rs), so we only need a C/C++ toolchain, cmake, perl
          # (aws-lc-sys CMake probes) and rust. pkgconf is handy for any
          # transitive pkg-config probes.
          prepare: |
            pkg install -y rust cmake gmake pkgconf bash git perl5
          # CARGO_BUILD_JOBS keeps memory in check; aws-lc-sys is memory hungry.
          run: |
            set -e
            echo "::group::Toolchain versions"
            uname -a
            cc --version | head -1
            cargo --version
            rustc --version
            echo "::endgroup::"

            # Cargo.toml requires rustc 1.99. The FreeBSD package is 1.99.1
            # today, but detect a lagging port here instead of failing deep in
            # cargo with an opaque MSRV error.
            rust_version="$(rustc --version | awk '{print $2}')"
            rust_major="${rust_version%%.*}"
            rust_minor="${rust_version#*.}"
            rust_minor="${rust_minor%%.*}"
            if [ "$rust_major" -lt 1 ] || { [ "$rust_major" -eq 1 ] && [ "$rust_minor" -lt 99 ]; }; then
              echo "::error::FreeBSD rustc ${rust_version} is older than the 1.99 required by Cargo.toml; install a newer rust port (or rustup 1.99.1) in the VM."
              exit 1
            fi

            export CARGO_TERM_COLOR=always
            export CARGO_INCREMENTAL=0
            export CARGO_BUILD_JOBS=3

            if [ "${{ inputs.release }}" = "true" ]; then
              PROFILE_FLAG="--release"
              TARGET_DIR="release"
            else
              PROFILE_FLAG=""
              TARGET_DIR="debug"
            fi

            echo "::group::cargo build (horon-agent binary)"
            cargo build --locked $PROFILE_FLAG -p horon-agent --bin horon-agent
            echo "::endgroup::"

            echo "::group::Verify binary launches"
            ./target/$TARGET_DIR/horon-agent --version
            echo "::endgroup::"

            echo "::group::Compile platform unit tests"
            cargo test --locked $PROFILE_FLAG -p horon-agent-base --lib --no-run
            echo "::endgroup::"

            echo "::group::Run platform unit tests"
            cargo test --locked $PROFILE_FLAG -p horon-agent-base --lib -- --nocapture platform
            echo "::endgroup::"
