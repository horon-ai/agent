<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="t d">
<title id="t">브랜치, CI, 릴리스 흐름</title><desc id="d">작업은 dev에 쌓이고 main이 출하한다. 변경 브랜치를 dev에서 잘라 dev로 풀 리퀘스트를 연다. require-issue.yml은 본문이나 제목에 이 저장소의 실제 이슈를 연결하지 않으면 실패시키고 Dependabot만 예외다. ci.yml과 structural-perf.yml은 먼저 scripts/ci/classify_changes.py로 Changed Paths를 계산한다. 문서만 바꾼 변경은 Documentation Checks와 Documentation Corpus Test만 돌고 릴리스 빌드, 세 OS 시험 행렬, SDK 작업, 구조 게이트를 건너뛴다. 그 밖의 변경은 모든 게이트를 돌며 packages/docs-site 아래 변경도 코드로 센다. CI Required와 Structural performance required는 항상 끝까지 돌고 게이트가 실패하거나 취소됐을 때만 실패하므로 필수 검사로 쓸 수 있다. 풀 리퀘스트는 dev로 squash 병합되고 그 푸시가 CI를 다시 돌린다. 릴리스는 base가 main이고 head가 dev인 Release: dev into main 풀 리퀘스트이며 merge 커밋으로 병합하고 squash하지 않는다. 그 병합의 main 푸시 실행이 scripts/release/check_ci.py가 받아들이는 릴리스 증거이고, 전부 성공한 푸시 실행이어야 하며 문서만 바꾼 실행은 안 된다. 그 실행이 통과하면 release-tag.yml이 scripts/release/next_version.py에게 다음 패치 태그를 물어 태그를 만들고 release.yml로 바이너리를 만들며 ghcr.io/horon-ai/agent 이미지를 민다. [skip ci]를 단 문서 전용 main 푸시는 CI를 돌리지 않고 태그도 만들지 않는다. 릴리스 뒤 main에서 dev로 가는 동기화 풀 리퀘스트를 merge 커밋으로 병합해 dev가 main의 모든 커밋을 가진다. benchmark-docs.yml은 CI가 통과한 main 푸시를 측정해 docs(perf) 커밋을 [skip ci]로 양쪽 브랜치의 결과 블록에 넣는다. 동기화가 양쪽에 빠진 커밋 0을 남긴다는 서술은 AGENTS.md 확인 절차를 그대로 그린 것이며 이 그림에서 다시 재지 않았다.</desc>
<style>
