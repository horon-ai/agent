<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d">
<title id="t">프로바이더 회선과 자격 증명</title><desc id="d">모델 호출은 프로필을 고른 뒤 그 type이 가리키는 엔드포인트로 POST한다. openai-compatible은 /chat/completions, openai-responses는 /responses, anthropic-compatible은 /messages, gemini-compatible은 /models/{model}:streamGenerateContent?alt=sse다. 자격 증명은 api_key_env 환경 변수, env_file 키 파일 순서로 찾고 auth가 헤더를 정한다. OpenAI 회선 둘은 Authorization Bearer, Anthropic은 x-api-key, Gemini는 x-goog-api-key이고 none은 키를 보내지 않는다. 모델은 default에서 상속하는 역할로 정하고, 그다음 프로필과 [provider] default_model을 보고, fallback_models는 역할이 고른 모델에 적용된다. generate_image는 같은 프로필의 /images/generations와 /images/edits를 쓰는 유일한 추가 경로이며 roles.image가 있고 [tools] generate_image가 참일 때만 존재한다. 프로필이 없으면 네트워크에 나가기 전에 멈추고 추가할 프로필을 알려 준다.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--a:#0b6bcb;--b:#c2410c;--ok:#1a7f37}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--a:#58a6ff;--b:#ffa657;--ok:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect width="960" height="720" rx="14" fill="var(--bg)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>

<text x="30" y="28" font-size="12.5" class="m">프로필과 호출</text>
<text x="330" y="28" font-size="12.5" class="m">프로필 type이 고르는 회선</text>

<rect x="30" y="44" width="270" height="152" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="42" y="64" font-size="12.5" font-weight="600">어느 프로필인가</text>
<text x="42" y="84" font-size="11" class="m mono">[provider] default_provider</text>
<text x="42" y="101" font-size="11" class="m mono">--provider-profile &lt;name&gt;</text>
<text x="42" y="126" font-size="11" class="m">프로필도 default_provider도</text>
<text x="42" y="142" font-size="11" class="m">없으면 네트워크에 나가기 전에</text>
<text x="42" y="158" font-size="11" class="m">멈추고 추가할 프로필을</text>
<text x="42" y="174" font-size="11" class="m">알려 준다</text>

<line x1="300" y1="110" x2="326" y2="110" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="330" y="44" width="600" height="64" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="344" y="65" font-size="12" font-weight="600" class="mono">openai-compatible</text>
<text x="344" y="84" font-size="11" class="m mono">POST {base_url}/chat/completions</text>
<text x="344" y="100" font-size="10.5" class="m">Chat Completions, 기본값</text>
<text x="616" y="76" font-size="10.5" class="m mono">Authorization: Bearer</text>
<text x="616" y="94" font-size="10.5" class="m">OpenAI 회선 둘의 기본값</text>

<rect x="330" y="118" width="600" height="64" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="344" y="139" font-size="12" font-weight="600" class="mono">openai-responses</text>
<text x="344" y="158" font-size="11" class="m mono">POST {base_url}/responses</text>
<text x="344" y="174" font-size="10.5" class="m">OpenAI Responses</text>
<text x="616" y="150" font-size="10.5" class="m mono">Authorization: Bearer</text>
<text x="616" y="168" font-size="10.5" class="m mono">reasoning.effort</text>

<rect x="330" y="192" width="600" height="64" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="344" y="213" font-size="12" font-weight="600" class="mono">anthropic-compatible</text>
<text x="344" y="232" font-size="11" class="m mono">POST {base_url}/messages</text>
<text x="344" y="248" font-size="10.5" class="m">Anthropic Messages</text>
<text x="616" y="224" font-size="10.5" class="m mono">x-api-key</text>
<text x="616" y="242" font-size="10.5" class="m mono">anthropic-version: 2023-06-01</text>

<rect x="330" y="266" width="600" height="64" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="344" y="287" font-size="12" font-weight="600" class="mono">gemini-compatible</text>
<text x="344" y="306" font-size="11" class="m mono">POST {base_url}/models/{model}</text>
<text x="344" y="322" font-size="11" class="m mono">:streamGenerateContent?alt=sse</text>
<text x="616" y="298" font-size="10.5" class="m mono">x-goog-api-key</text>
<text x="616" y="316" font-size="10.5" class="m mono">generationConfig.thinkingConfig</text>

<text x="330" y="352" font-size="11" class="m">base_url이 이미 회선 경로로 끝나면 그대로 쓴다. auth = "none"이면 키를 아예 보내지 않는다.</text>

<rect x="30" y="374" width="270" height="130" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="42" y="394" font-size="12.5" font-weight="600">자격 증명 출처</text>
<text x="42" y="414" font-size="11" class="m">1. api_key_env 환경 변수</text>
<text x="42" y="431" font-size="11" class="m">2. env_file 키 파일</text>
<text x="42" y="448" font-size="11" class="m">3. 내장 프로필의 자체 키</text>
<text x="42" y="472" font-size="11" class="m mono">auth = bearer | header | none</text>
<text x="42" y="492" font-size="11" class="m">명시한 auth가 항상 이긴다</text>

<rect x="330" y="374" width="290" height="130" rx="10" fill="var(--panel)" stroke="var(--a)" stroke-width="1.5"/>
<text x="342" y="394" font-size="12.5" font-weight="600">모델과 역할</text>
<text x="342" y="414" font-size="11" class="m">실행 인자, roles.&lt;role&gt;,</text>
<text x="342" y="431" font-size="11" class="m">그다음 상속 역할 순서</text>
<text x="342" y="450" font-size="11" class="m mono">plan, aux → default</text>
<text x="342" y="467" font-size="11" class="m mono">judge → aux → default</text>
<text x="342" y="486" font-size="11" class="m">그다음 프로필과 [provider] default_model</text>

<rect x="640" y="374" width="290" height="130" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="652" y="394" font-size="12.5" font-weight="600">폴백과 페일오버</text>
<text x="652" y="414" font-size="11" class="m mono">fallback_models = ["m2", "m3"]</text>
<text x="652" y="433" font-size="11" class="m">1. 다음 폴백 항목, 각 한 번</text>
<text x="652" y="450" font-size="11" class="m">2. 같은 프로바이더의 다른 계정</text>
<text x="652" y="467" font-size="11" class="m">3. 다른 프로바이더</text>
<text x="652" y="486" font-size="11" class="m">목록은 역할이 아니라 프로필에 있다</text>

<rect x="30" y="522" width="600" height="120" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="42" y="542" font-size="12.5" font-weight="600">generate_image, 유일한 추가 경로</text>
<text x="42" y="562" font-size="11" class="m">같은 프로필의 base URL, 자격 증명, auth, extra_body를 그대로 쓴다</text>
<text x="42" y="583" font-size="11" class="m mono">POST {base_url}/images/generations</text>
<text x="42" y="600" font-size="11" class="m mono">POST {base_url}/images/edits</text>
<text x="42" y="620" font-size="11" class="m">OpenAI 회선 둘만 이 경로를 갖고, 모델은 roles.image에서 온다.</text>
<text x="42" y="635" font-size="11" class="m">이 역할은 텍스트 모델이 답할 수 없으므로 상속 폴백을 두지 않는다.</text>

<line x1="630" y1="582" x2="662" y2="582" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="664" y="522" width="266" height="120" rx="10" fill="var(--panel)" stroke="var(--b)" stroke-width="1.5"/>
<text x="676" y="542" font-size="12.5" font-weight="600">둘 다 참일 때만 등록</text>
<text x="676" y="566" font-size="11" class="m mono">[tools] generate_image = true</text>
<text x="676" y="586" font-size="11" class="m mono">roles.image = "&lt;model&gt;"</text>
<text x="676" y="610" font-size="11" class="m">기본 설정에서는 꺼져 있어 도구가</text>
<text x="676" y="626" font-size="11" class="m">모델에 아예 알려지지 않는다</text>

<text x="30" y="646" font-size="11" class="m">프로필마다 여러 세션이 동시에 보내는 모델·이미지 요청 수를 제한할 수 있다.</text>
<text x="30" y="660" font-size="11" class="m">네 가지 요청 방식 모두 프로필에서 첫 응답과 응답 도중 대기 시간을 따로 제한할 수 있다.</text>
<text x="30" y="680" font-size="11" class="m">모델 경로는 하나다. 공급자 런타임은 프로필의 자격 증명으로 해당 type의 엔드포인트에 바로 POST한다.</text>
<text x="30" y="700" font-size="11" class="m">회선마다 model routes에 자기 api_method를 보고하지만, 저장되는 프로바이더 정체성은 openai-compatible로 같다.</text>
</svg>
