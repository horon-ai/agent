<rect x="353.6" y="162.0" width="438.3" height="18" rx="3" fill="#d3d9e1"/>
<rect x="353.6" y="162.0" width="423.9" height="18" rx="3" fill="#0b84de"/>
<text x="805.9" y="175.0" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">1,367 → 1,322 B</text>
<text x="341.6" y="205.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="normal">`# Additional tools` 색인</text>
