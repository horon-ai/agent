<text x="32.0" y="232.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">행마다 이전 값을 기준으로 크기를 맞췄습니다. 막대 길이가 아니라 수치를 읽습니다.</text>
<text x="32.0" y="258.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">출처: docs/performance/RESULTS.md · 프롬프트 표면과 세션 문맥</text>
