<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 392" width="780" height="392" role="img" aria-labelledby="t d">
<title id="t">One-shot time, horon-agent versus jcode</title><desc id="d">Median one-shot headless prompt time in milliseconds. Linux: horon 69.8, jcode 149.4. macOS: horon 104.7, jcode 361.6. Windows: horon 189.0, jcode 112.9, where jcode is faster.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--a:#0b6bcb;--b:#c2410c;--ok:#1a7f37}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--a:#58a6ff;--b:#ffa657;--ok:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect width="780" height="392" rx="14" fill="var(--bg)"/>
<text x="30" y="36" font-size="18" font-weight="600">One-shot headless prompt, median time (ms, lower is better)</text><text x="30" y="56" font-size="12" class="m">Mock model, one ls tool call, GitHub-hosted runners, horon-agent 2a4027c vs jcode v0.99.1.</text><text x="30" y="74" font-size="12" class="m">Each OS is a different runner: compare within a row only.</text><text x="30" y="118" font-size="15" font-weight="600">Linux</text><rect x="120" y="100" width="66.3" height="22" rx="4" fill="var(--a)"/><text x="194.3" y="116" font-size="13" class="mono">horon 69.8</text><rect x="120" y="130" width="141.9" height="22" rx="4" fill="var(--b)"/><text x="269.9" y="146" font-size="13" class="mono">jcode 149.4</text><text x="30" y="202" font-size="15" font-weight="600">macOS</text><rect x="120" y="184" width="99.5" height="22" rx="4" fill="var(--a)"/><text x="227.5" y="200" font-size="13" class="mono">horon 104.7</text><rect x="120" y="214" width="343.5" height="22" rx="4" fill="var(--b)"/><text x="471.5" y="230" font-size="13" class="mono">jcode 361.6</text><text x="30" y="286" font-size="15" font-weight="600">Windows</text><rect x="120" y="268" width="179.6" height="22" rx="4" fill="var(--a)"/><text x="307.6" y="284" font-size="13" class="mono">horon 189.0</text><rect x="120" y="298" width="107.3" height="22" rx="4" fill="var(--b)"/><text x="235.3" y="314" font-size="13" class="mono">jcode 112.9</text><line x1="120" y1="84" x2="120" y2="336" stroke="var(--line)"/><text x="30" y="372" font-size="12" class="m">Source: docs/performance/RESULTS.md, automatic measurement section. On Windows jcode is faster.</text>
</svg>
