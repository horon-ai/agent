<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t d">
<title id="t">horon-agent</title><desc id="d">horon-agent: a coding agent for OpenAI-compatible endpoints. A terminal client, ACP v1 and v2 over stdio, one Rust binary.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--a:#0b6bcb;--b:#c2410c;--ok:#1a7f37}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--a:#58a6ff;--b:#ffa657;--ok:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect width="900" height="260" rx="14" fill="var(--bg)"/>

<rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="var(--line)"/>
<text x="450" y="100" text-anchor="middle" font-size="64" font-weight="700" class="mono">horon-agent</text>
<text x="450" y="146" text-anchor="middle" font-size="24" class="m">A coding agent for OpenAI-compatible endpoints.</text>
<g font-size="16" text-anchor="middle">
<rect x="150" y="180" width="160" height="40" rx="20" fill="var(--panel)" stroke="var(--line)"/><text x="230" y="205">TUI client</text>
<rect x="330" y="180" width="240" height="40" rx="20" fill="var(--panel)" stroke="var(--line)"/><text x="450" y="205">ACP v1 + v2 over stdio</text>
<rect x="590" y="180" width="160" height="40" rx="20" fill="var(--panel)" stroke="var(--line)"/><text x="670" y="205">one Rust binary</text>
</g>

</svg>
