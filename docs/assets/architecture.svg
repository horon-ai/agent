<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-labelledby="t d">
<title id="t">horon-agent architecture</title><desc id="d">SDKs and editors over ACP reach the agent daemon through the harness API and the ACP adapter, and the terminal client horon-tui attaches the same way while a bare run hosts the agent in-process. The daemon keeps sessions in an append-only event store and calls an OpenAI-compatible /chat/completions endpoint directly.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--a:#0b6bcb;--b:#c2410c;--ok:#1a7f37}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--a:#58a6ff;--b:#ffa657;--ok:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect width="920" height="330" rx="14" fill="var(--bg)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><text x="30" y="34" font-size="13" class="m">Clients</text><text x="370" y="34" font-size="13" class="m">horon-agent (one process)</text><text x="730" y="34" font-size="13" class="m">Model</text><rect x="30" y="56" width="260" height="64" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="160.0" y="84.0" text-anchor="middle" font-size="16" font-weight="600">TypeScript / Python SDK</text><text x="160.0" y="104.0" text-anchor="middle" font-size="12" class="m mono">harness API, NDJSON</text><rect x="30" y="146" width="260" height="64" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="160.0" y="174.0" text-anchor="middle" font-size="16" font-weight="600">Editor (Zed, JetBrains)</text><text x="160.0" y="194.0" text-anchor="middle" font-size="12" class="m mono">ACP v1 / v2, stdio</text><rect x="30" y="236" width="260" height="64" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="160.0" y="264.0" text-anchor="middle" font-size="16" font-weight="600">Terminal</text><text x="160.0" y="284.0" text-anchor="middle" font-size="12" class="m mono">horon-tui, run</text><rect x="340" y="50" width="330" height="262" rx="12" fill="none" stroke="var(--line)" stroke-dasharray="5 4"/><rect x="360" y="72" width="290" height="60" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="505.0" y="98.0" text-anchor="middle" font-size="16" font-weight="600">api-bridge / acp / run</text><text x="505.0" y="118.0" text-anchor="middle" font-size="12" class="m mono">front doors</text><rect x="360" y="150" width="290" height="60" rx="10" fill="var(--panel)" stroke="var(--a)" stroke-width="2"/><text x="505.0" y="176.0" text-anchor="middle" font-size="16" font-weight="600">Agent daemon</text><text x="505.0" y="196.0" text-anchor="middle" font-size="12" class="m mono">sessions, tools, MCP</text><rect x="360" y="228" width="290" height="60" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="505.0" y="254.0" text-anchor="middle" font-size="16" font-weight="600">Session store</text><text x="505.0" y="274.0" text-anchor="middle" font-size="12" class="m mono">events.jsonl + blobs</text><rect x="710" y="140" width="170" height="80" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="795.0" y="176.0" text-anchor="middle" font-size="16" font-weight="600">OpenAI-compatible</text><text x="795.0" y="196.0" text-anchor="middle" font-size="12" class="m mono">POST /chat/completions</text><line x1="290" y1="88" x2="358" y2="100" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/><line x1="290" y1="178" x2="358" y2="110" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/><line x1="290" y1="268" x2="358" y2="120" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/><line x1="505" y1="132" x2="505" y2="148" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/><line x1="505" y1="210" x2="505" y2="226" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/><line x1="650" y1="180" x2="708" y2="180" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
