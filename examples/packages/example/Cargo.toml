[package]
name = "horon-package-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "The worked example of a user-installed horon Rust package, served as a standalone extension and as a plugin"

[[bin]]
name = "horon-package-example"
path = "src/main.rs"

[dependencies]
horon-agent-extension-sdk = { path = "../../../crates/extension-sdk" }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
