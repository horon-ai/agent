[package]
name = "horon-agent-provider-openai"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
horon-agent-core = { path = "../core" }
horon-agent-logging = { path = "../logging" }
horon-agent-message-types = { path = "../message-types" }
horon-agent-provider-core = { path = "../provider-core" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
