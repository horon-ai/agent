[package]
name = "horon-agent-sdk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust SDK for the horon-agent harness API: connect, drive sessions, stream events"

[dependencies]
anyhow = "1"
horon-agent-base = { path = "../base", default-features = false }
horon-agent-harness-api = { path = "../harness-api" }
horon-agent-todo-policy = { path = "../todo-policy" }
horon-agent-provider-metadata = { path = "../provider-metadata" }
horon-agent-transport = { path = "../transport" }
jsonschema = { version = "0.49.3", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
