[package]
name = "horon-agent-transport"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local IPC transport: Unix sockets, or Windows named pipes behind the same API"

# Deliberately tiny. This exists so the harness API bridge can speak the
# platform's local IPC without depending on `horon-agent-base`: the bridge is meant to
# stay free of the application foundation, and duplicating 450 lines of named
# pipe handling into it would have been the other way to get there. The
# mechanism itself moved into the platform adapter's `ipc` module, which is the
# only crate allowed to name an operating system's local IPC.
[dependencies]
horon-agent-platform = { path = "../platform" }
