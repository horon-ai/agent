[package]
name = "horon-agent-protocol"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
horon-agent-batch-types = { path = "../batch-types" }
horon-agent-config-types = { path = "../config-types" }
# The package-management contract is shared with the daemon, the bridge and the
# CLI, so the wire enum carries it instead of copying its shape.
horon-agent-extension-types = { path = "../extension-types" }
horon-agent-message-types = { path = "../message-types" }
horon-agent-plan = { path = "../plan" }
horon-agent-provider-core = { path = "../provider-core" }
horon-agent-session-types = { path = "../session-types" }
horon-agent-tool-types = { path = "../tool-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
anyhow = "1"
rand = "0.9"
