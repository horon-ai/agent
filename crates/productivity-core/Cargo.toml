[package]
name = "horon-agent-productivity-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
horon-agent-time = { path = "../time-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
horon-agent-storage = { path = "../storage" }
horon-agent-platform = { path = "../platform" }

# Dashboard rendering (SVG -> PNG)
resvg = "0.48.1"
usvg = "0.48.1"

[dev-dependencies]
tempfile = "3"
