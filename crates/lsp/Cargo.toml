[package]
name = "horon-agent-lsp"
version = "0.1.0"
edition = "2024"
publish = false
description = "Minimal Language Server Protocol client used by the `lsp` tool"

[lib]
name = "horon_agent_lsp"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
lsp-types = "0.97"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
url = "2"
horon-agent-logging = { path = "../logging" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
