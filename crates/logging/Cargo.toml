[package]
name = "horon-agent-logging"
version = "0.1.0"
edition = "2024"
description = "File logging, structured events, and thread/task-local logging context for horon-agent"

[lib]
name = "horon_agent_logging"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt"] }
horon-agent-core = { path = "../core" }
horon-agent-platform-api = { path = "../platform-api" }
horon-agent-storage = { path = "../storage" }

[dev-dependencies]
# The lib tests spawn tasks on a multi-thread runtime, so `#[tokio::test]` and
# `tokio::spawn` need the macros and the runtime builder. Without these the lib
# test target did not compile at all; nothing built it until #226 put every
# compiled lib target under a cohort.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
