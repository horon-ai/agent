[package]
name = "horon-agent-edit-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Edit benchmark: generate single-line-bug fixtures from a source tree, run agent arms against them, and compare results"

[lib]
name = "horon_agent_edit_bench"
path = "src/lib.rs"

[[bin]]
name = "edit-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
