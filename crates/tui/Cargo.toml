[package]
name = "horon-tui"
version = "0.1.0"
description = "Terminal client for the horon-agent harness, built on the agent SDK"
edition = "2024"
publish = false
autobins = false

[lib]
name = "horon_tui"
path = "src/lib.rs"

[[bin]]
name = "horon-tui"
path = "src/main.rs"

[dependencies]
horon-agent-sdk = { path = "../agent-sdk" }
# The ask tool's question shape crosses the harness API inside
# `ApiEvent::AskRequested`, but the API crate only imports it privately, so a
# client that answers questions names the type from its own crate.
horon-agent-tool-types = { path = "../tool-types" }
# Default features are off so the binary pulls only the widgets and backend it
# uses: the crossterm 0.29 backend (matching the direct dependency below) and
# the layout cache. `all-widgets` would add the calendar widget and its date
# stack to every build for nothing.
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29"
toml = "0.8"
# The settings screen edits `tui.toml` in place: `toml_edit` keeps the comments
# and layout of a hand-written file, which `toml` cannot when it re-serializes.
# The version matches the one `toml` already pulls in, so no new package.
toml_edit = "0.20"
# Cell width of a character, for wrapping the transcript and scrolling the
# input. `ratatui` already depends on the same version.
unicode-width = "0.2"
# Grapheme cluster boundaries per UAX #29, so the cursor, deletion and a click
# stop on a whole character (a flag, an Indic conjunct, jamo or a mark) rather
# than a hand-written subset. `ratatui` already pulls the same package in, so
# the lockfile gains no new version.
unicode-segmentation = "1"
serde_json = "1"
# `/links` shows an http(s) URL from an assistant answer and hands the chosen
# one to the desktop. `url` reads the scheme, authority and port the same way
# the harness does, and `open` is the launcher the login flow already uses: it
# passes the URL as one argument and returns once the handler was started. Both
# are already in the workspace's lock file, so this adds no package.
url = "2"
open = "5"
# The `time` segment shows local wall-clock time. The client reaches no
# workspace crate except the SDK and the tool contract crate, so it reads the
# clock it already gets from `time` through the SDK's dependency graph and asks
# for the local offset itself; the epoch-to-local conversion is this crate's.
time = { version = "0.3.55", default-features = false, features = ["local-offset", "std"] }
# The draft handed to the editor lives in a file only this user can read: the
# crate makes a 0700 directory and a 0600 file in it and removes both on drop,
# which is one place to get that right. The agent binary already depends on it,
# so the workspace builds it in either case.
tempfile = "3"
# An editor value is a command line, and `shlex` is its POSIX word syntax:
# quotes and escapes are read, nothing is expanded, and no value can run a
# second command. It is already in the lock for the build scripts' `cc`.
shlex = "2"

# Restoring the terminal from a signal handler (#431) needs the C library's
# `signal`, `pipe` and `write`: the client reaches no platform crate, so the
# POSIX calls come from libc directly. Windows installs nothing here.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
