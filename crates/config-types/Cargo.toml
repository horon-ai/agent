[package]
name = "horon-agent-config-types"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The role table is written as `[providers.<name>.roles]`, so its round-trip
# test parses the real TOML shape rather than a JSON approximation of it.
toml = "0.8"
