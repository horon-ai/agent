[package]
name = "horon-agent-notify-email"
version = "0.1.0"
edition = "2024"

[lib]
name = "horon_agent_notify_email"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
imap = { version = "3.0.0-alpha.15", default-features = false }
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mail-parser = "0.9"
pulldown-cmark = "0.12"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
urlencoding = "2"
webpki-roots = "1"
