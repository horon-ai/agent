[package]
name = "horon-agent-platform-macos"
version = "0.1.0"
edition = "2024"
publish = false
description = "macOS platform adapter: F_FULLFSYNC and plain fsync for durable writes, and the system certificate verifier for TLS"

[lib]
name = "horon_agent_platform_macos"
path = "src/lib.rs"

[dependencies]
horon-agent-logging = { path = "../logging" }
horon-agent-platform-api = { path = "../platform-api" }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-platform-verifier = "0.7"
webpki-root-certs = "1"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
