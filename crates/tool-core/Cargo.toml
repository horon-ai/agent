[package]
name = "horon-agent-tool-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "horon_agent_tool_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
horon-agent-agent-runtime = { path = "../agent-runtime" }
horon-agent-message-types = { path = "../message-types" }
horon-agent-tool-types = { path = "../tool-types" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
