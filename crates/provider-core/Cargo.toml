[package]
name = "horon-agent-provider-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "horon_agent_provider_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
httpdate = "1"
horon-agent-logging = { path = "../logging" }
horon-agent-schema-dialect = { path = "../schema-dialect" }
horon-agent-message-types = { path = "../message-types" }
horon-agent-usage-types = { path = "../usage-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9.3"
sha2 = "0.10"
# `attempt_tracker` uses `tokio::select!` in production code, so the `macros`
# feature is required here rather than arriving through workspace unification:
# building this crate (or any crate that depends on it) on its own otherwise
# fails with "cannot find `select` in `tokio`".
tokio = { version = "1", features = ["sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt"] }
