[package]
name = "horon-agent-base"
version = "0.1.0"
edition = "2024"
publish = false

# Foundational layer of the horon-agent application core: the downward-closed set of
# modules (provider, auth, config, session, message, memory, ...)
# that the server/tool/agent layer depends on. Split out of `horon-agent-app-core` so
# the two halves compile as separate rustc units, halving peak compile memory.
# `horon-agent-app-core` re-exports this crate (`pub use horon_agent_base::*`) so that every
# existing `crate::<module>` path keeps resolving unchanged.

[lib]
name = "horon_agent_base"
path = "src/lib.rs"

[dependencies]
# Memory allocator (reduces fragmentation for long-running server)
tikv-jemalloc-ctl = { version = "0.6", optional = true }
tikv-jemalloc-sys = { version = "0.6", optional = true }

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
toml = "0.8"

# File operations

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
urlencoding = "2"        # URL encoding for web search
uuid = { version = "1", features = ["v4", "v5"] }
proctitle = "0.1"

# Embeddings (local inference) - behind feature flag (163 crates, slow to compile)
horon-agent-embedding = { path = "../embedding", optional = true }
horon-agent-gateway-types = { path = "../gateway-types" }
horon-agent-import-core = { path = "../import-core" }
horon-agent-logging = { path = "../logging" }

# OAuth
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"            # stable secret placeholders (HMAC-SHA256 of the value)
horon-agent-transport = { path = "../transport" }
rand = "0.9.3"
hex = "0.4"
url = "2"
open = "5"               # Open URLs in browser
horon-agent-auth-types = { path = "../auth-types" }
horon-agent-azure-auth = { path = "../azure-auth" }
horon-agent-agent-runtime = { path = "../agent-runtime" }
horon-agent-provider-metadata = { path = "../provider-metadata" }
horon-agent-provider-env = { path = "../provider-env" }
horon-agent-provider-core = { path = "../provider-core" }
horon-agent-provider-openai = { path = "../provider-openai" }
# NOTE: this foundation layer intentionally does NOT depend on any `horon-agent-tui-*`
# crate or on a presentation crate. `ResumeTarget` lives in
# `horon-agent-session-types` and reasoning-line markup lives in
# `session/render_markup.rs`, so the layering inversion is gone.
horon-agent-terminal-launch = { path = "../terminal-launch" }
horon-agent-usage-types = { path = "../usage-types" }

# NOTE: microphone capture and transcription live in `horon-agent-voice`, a
# client-only crate. The shared runtime never opens a microphone.

# Streaming

# NOTE: no terminal crates (crossterm, ratatui, qrcode). Interactive login
# prompts are a client concern: the CLI installs a presenter into
# `auth::login_ui`, and this shared crate never touches a terminal.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico", "tiff"] }  # PNG/JPEG plus BMP/ICO/TIFF decoding so they can be re-encoded to PNG for providers (#1712). Skip avif/rav1e, exr, etc.

# NOTE: PDF text extraction (horon-agent-pdf) lives in the upper horon-agent-app-core crate
# (tool/read.rs), not here.
horon-agent-background-types = { path = "../background-types" }
horon-agent-batch-types = { path = "../batch-types" }
horon-agent-build-meta = { path = "../build-meta" }
horon-agent-compaction-core = { path = "../compaction-core" }
horon-agent-config-types = { path = "../config-types" }
horon-agent-core = { path = "../core" }
horon-agent-memory-types = { path = "../memory-types" }
horon-agent-message-types = { path = "../message-types" }
horon-agent-plan = { path = "../plan" }
horon-agent-protocol = { path = "../protocol" }
horon-agent-session-types = { path = "../session-types" }
horon-agent-session-store = { path = "../session-store" }
horon-agent-perf-counters = { path = "../perf-counters" }
horon-agent-storage = { path = "../storage" }
horon-agent-task-types = { path = "../task-types" }
horon-agent-todo-policy = { path = "../todo-policy" }
horon-agent-tool-core = { path = "../tool-core" }
horon-agent-tool-types = { path = "../tool-types" }

# Temporary files and directories for provider import helpers.
tempfile = "3"

[features]
default = []
# Compiles the in-crate test helpers (storage::lock_test_env,
# auth::test_sandbox, bus::reset_models_updated_publish_state_for_tests, ...) as
# `pub` so downstream crates' test targets can reach them. Enabled as a
# dev-dependency feature by horon-agent-app-core / horon-agent / etc.; never in normal
# (non-test) builds.
test-support = []
jemalloc = [
    "dep:tikv-jemalloc-ctl",
    "dep:tikv-jemalloc-sys",
    "tikv-jemalloc-ctl/stats",
]
jemalloc-prof = [
    "jemalloc",
    "tikv-jemalloc-ctl/profiling",
]
embeddings = ["dep:horon-agent-embedding"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
# Paused-time (auto-advancing virtual clock) tests for the background stall watchdog.
tokio = { version = "1", features = ["test-util"] }

