[package]
name = "horon-agent-companion"
version = "0.1.0"
edition = "2024"
publish = false
description = "horon-agent companion: per-login helper for desktop-only effects (open, terminals, lid override, global voice)"

# Runs in the user's graphical session. The harness server reaches it only
# through horon_agent_base::companion_client and never links this crate.
[lib]
name = "horon_agent_companion"
path = "src/lib.rs"

[dependencies]
horon-agent-base = { path = "../base", default-features = false }
horon-agent-desktop-open = { path = "../desktop-open" }
horon-agent-transport = { path = "../transport" }
horon-agent-voice = { path = "../voice" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_SystemServices"] }

[dev-dependencies]
horon-agent-base = { path = "../base", default-features = false, features = ["test-support"] }
tempfile = "3"
