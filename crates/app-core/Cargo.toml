[package]
name = "horon-agent-app-core"
version = "0.1.0"
edition = "2024"
publish = false

# Application core for horon-agent: all non-presentation modules (server, agent,
# provider, auth, session, tool, config, etc.) extracted out of the monolithic
# root `horon-agent` crate so they compile as a separate rustc unit. The root `horon-agent`
# crate (cli + tui + bin) re-exports this crate's modules via `pub use
# horon_agent_app_core::*`, preserving every existing `crate::<module>` path.

[lib]
name = "horon_agent_app_core"
path = "src/lib.rs"

[dependencies]
# NOTE: the jemalloc allocator stats live in `horon-agent-base` (process_memory) and
# local embeddings live in `horon-agent-base` (embedding); this crate forwards those
# features to horon-agent-base rather than depending on the backing crates directly.

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Schema-directed repair of model-supplied tool arguments, and validation of a
# structured subagent result against the output schema its spawn named.
jsonschema = { version = "0.49.3", default-features = false }

# CLI

# File operations
glob = "0.3"
ignore = "0.4"
similar = "2"            # diffing for edits

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
# Interceptor rules need lookaround (e.g. `cat` followed by no redirection).
fancy-regex = "0.20"
urlencoding = "2"        # URL encoding for web search
uuid = { version = "1", features = ["v4", "v5"] }
horon-agent-applet-types = { path = "../applet-types" }
horon-agent-ast = { path = "../ast" }

# Embeddings (local inference) live in horon-agent-base; this crate forwards the
# `embeddings` feature to horon-agent-base rather than depending on horon-agent-embedding.
horon-agent-harness-api = { path = "../harness-api" }
horon-agent-productivity-core = { path = "../productivity-core" }
horon-agent-import-core = { path = "../import-core" }
horon-agent-irc-core = { path = "../irc-core" }

# OAuth
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
url = "2"
# Local fallback for the open tool when no `horon-agent companion` is running.
horon-agent-desktop-open = { path = "../desktop-open" }
horon-agent-agent-runtime = { path = "../agent-runtime" }
horon-agent-ambient-types = { path = "../ambient-types" }
horon-agent-notify-email = { path = "../notify-email" }
horon-agent-provider-core = { path = "../provider-core" }
horon-agent-schema-dialect = { path = "../schema-dialect" }
horon-agent-lsp = { path = "../lsp" }
# NOTE: horon-agent-app-core does NOT depend on any horon-agent-tui-* crate. They were
# unused dead dependency edges here (the TUI declares them itself). Removing
# them stops a horon-agent-tui-* edit from cascading a recompile through app-core.
horon-agent-update-core = { path = "../update-core" }

# Streaming
tokio-stream = "0.1"

# NOTE: no ratatui/crossterm here. Terminal rendering and prompts belong to the
# CLI and horon-agent-tui, so the shared runtime never touches a terminal.

# PDF parsing (behind feature flag)
horon-agent-pdf = { path = "../pdf", optional = true }
horon-agent-build-support = { path = "../build-support" }
horon-agent-build-meta = { path = "../build-meta" }

# Foundational layer (provider, auth, config, session, message, memory, ...).
# Re-exported via `pub use horon_agent_base::*` in lib.rs. default-features=false so
# this crate controls horon-agent-base's optional features (see [features] below).
horon-agent-base = { path = "../base", default-features = false }
horon-agent-command-risk = { path = "../command-risk" }
horon-agent-core = { path = "../core" }
horon-agent-edit-safety = { path = "../edit-safety" }
horon-agent-message-types = { path = "../message-types" }
horon-agent-overnight-core = { path = "../overnight-core" }
horon-agent-perf-counters = { path = "../perf-counters" }
horon-agent-plan = { path = "../plan" }
horon-agent-swarm-core = { path = "../swarm-core" }
horon-agent-selfdev-types = { path = "../selfdev-types" }
horon-agent-session-types = { path = "../session-types" }
horon-agent-session-store = { path = "../session-store" }
horon-agent-setup-hints = { path = "../setup-hints" }
horon-agent-task-types = { path = "../task-types" }
horon-agent-tool-core = { path = "../tool-core" }
horon-agent-codemode = { path = "../codemode" }
horon-agent-tool-types = { path = "../tool-types" }

# Archive extraction (for auto-update)
flate2 = "1"
tar = "0.4"
tempfile = "3"
agentgrep = { git = "https://github.com/1jehuang/agentgrep.git", tag = "v0.1.7" }

[features]
default = ["pdf"]
# jemalloc allocator stats live in horon-agent-base (process_memory); forward there.
jemalloc = ["horon-agent-base/jemalloc"]
jemalloc-prof = ["horon-agent-base/jemalloc-prof"]
# local embeddings live in horon-agent-base (embedding); forward there.
embeddings = ["horon-agent-base/embeddings"]
# PDF text extraction lives in this crate (tool/read.rs).
pdf = ["dep:horon-agent-pdf"]
# Offline import of display metadata that exists only in the legacy SQLite
# session index. Opt-in: without it the CLI reports MigrationRequired and never
# opens the database.
legacy-session-index-import = ["horon-agent-session-store/legacy-session-index-import"]
# Compiles this crate's test-only helpers/accessors (e.g. the
# ExternalAuthReviewCandidate read accessors) as `pub` and forwards
# horon-agent-base's `test-support` so downstream crates' test targets can reach the
# whole stack's helpers. Never enabled in normal (non-test) builds.
test-support = ["horon-agent-base/test-support"]

[dev-dependencies]
# Paused-time browser tests must compile when this package is tested alone,
# without inheriting test-util from another workspace package's dev-dependencies.
tokio = { version = "1", features = ["test-util"] }
# Used by async streaming tests (ambient/runner_tests, server/client_actions_tests).
async-stream = "0.3"
# Enables horon-agent-base's test-support helpers (storage::lock_test_env,
# auth::test_sandbox, bus::reset_models_updated_publish_state_for_tests) for
# *this* crate's own test target. Feature unification applies this only to
# test/bench/example builds, not to a normal `cargo build`.
horon-agent-base = { path = "../base", default-features = false, features = ["test-support"] }
# The integration test compares the estimator's per-family counts against the
# bytes/4 heuristic, and cl100k is only reachable through this crate.
horon-agent-token-estimate = { path = "../token-estimate" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
# Native desktop control for the `macos_computer_use` tool (synthetic mouse/keyboard
# events, cursor positioning, display bounds). `highsierra` enables the
# CGEventCreateScrollWheelEvent2 binding used for scroll.
core-graphics = { version = "0.23", features = ["highsierra"] }
