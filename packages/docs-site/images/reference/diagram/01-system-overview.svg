<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
<title id="t">horon-agent system overview</title><desc id="d">Clients on the left - horon-tui, the TypeScript and Python SDKs, editors over ACP and a host program over RPC - reach one horon-agent process over a Unix socket or stdio. The process starts at its entry points api-bridge, acp and rpc, which all sit on the daemon started by horon-agent serve. The daemon is built from the workspace crates, keeps sessions in the append-only event store under ~/.horon/sessions, and shares one MCP server pool across sessions. It POSTs directly to the endpoint the active profile's type names, with no router process and no plugin host in between. The terminal client is the separate horon-tui binary, built on horon-agent-sdk, which the agent binary never links.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--a:#0b6bcb;--b:#c2410c;--ok:#1a7f37}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--a:#58a6ff;--b:#ffa657;--ok:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect width="960" height="620" rx="14" fill="var(--bg)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>

<text x="30" y="32" font-size="12.5" class="m">Clients</text>
<text x="390" y="32" font-size="12.5" class="m">horon-agent (one process)</text>
<text x="750" y="32" font-size="12.5" class="m">Endpoint</text>

<rect x="30" y="48" width="280" height="316" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<rect x="44" y="64" width="252" height="62" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="170" y="88" font-size="14.5" font-weight="600" text-anchor="middle">horon-tui</text>
<text x="170" y="108" font-size="11.5" class="m mono" text-anchor="middle">TUI binary, on horon-agent-sdk</text>
<rect x="44" y="136" width="252" height="62" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="170" y="160" font-size="14.5" font-weight="600" text-anchor="middle">TypeScript / Python SDK</text>
<text x="170" y="180" font-size="11.5" class="m mono" text-anchor="middle">packages/sdk</text>
<rect x="44" y="208" width="252" height="62" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="170" y="232" font-size="14.5" font-weight="600" text-anchor="middle">Editor</text>
<text x="170" y="252" font-size="11.5" class="m mono" text-anchor="middle">ACP over stdio</text>
<rect x="44" y="280" width="252" height="62" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="170" y="304" font-size="14.5" font-weight="600" text-anchor="middle">Host program</text>
<text x="170" y="324" font-size="11.5" class="m mono" text-anchor="middle">RPC over stdio, JSONL</text>
<text x="44" y="382" font-size="11" class="m">horon-agent-sdk: the same API socket</text>
<text x="44" y="400" font-size="11" class="m mono">horon-agent-api.sock</text>

<line x1="312" y1="206" x2="382" y2="206" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="347" y="196" font-size="10" class="m" text-anchor="middle">socket</text>
<text x="347" y="226" font-size="10" class="m" text-anchor="middle">or stdio</text>

<rect x="390" y="48" width="330" height="500" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<rect x="404" y="64" width="302" height="88" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="555" y="86" font-size="14.5" font-weight="600" text-anchor="middle">Entry points</text>
<text x="555" y="107" font-size="11.5" class="m mono" text-anchor="middle">api-bridge — harness API socket</text>
<text x="555" y="124" font-size="11.5" class="m mono" text-anchor="middle">acp — ACP adapter over stdio</text>
<text x="555" y="141" font-size="11.5" class="m mono" text-anchor="middle">rpc — stdio JSONL adapter</text>
<line x1="555" y1="154" x2="555" y2="174" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="404" y="176" width="302" height="60" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/>
<text x="555" y="200" font-size="14.5" font-weight="600" text-anchor="middle">daemon: horon-agent serve</text>
<text x="555" y="220" font-size="11.5" class="m mono" text-anchor="middle">horon-agent.sock — many sessions</text>
<line x1="555" y1="238" x2="555" y2="258" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="404" y="260" width="302" height="170" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="555" y="282" font-size="14.5" font-weight="600" text-anchor="middle">workspace crates</text>
<text x="555" y="306" font-size="11.5" class="m mono" text-anchor="middle">horon-agent-app-core</text>
<text x="555" y="324" font-size="11.5" class="m mono" text-anchor="middle">horon-agent-agent-runtime</text>
<text x="555" y="342" font-size="11.5" class="m mono" text-anchor="middle">horon-agent-base</text>
<text x="555" y="360" font-size="11.5" class="m mono" text-anchor="middle">horon-agent-core</text>
<text x="555" y="378" font-size="11.5" class="m mono" text-anchor="middle">horon-agent-provider-openai</text>
<text x="555" y="396" font-size="11.5" class="m mono" text-anchor="middle">horon-agent-protocol</text>
<text x="555" y="414" font-size="11.5" class="m mono" text-anchor="middle">horon-agent-session-store</text>
<line x1="555" y1="432" x2="555" y2="450" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="404" y="452" width="145" height="76" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="476" y="474" font-size="13" font-weight="600" text-anchor="middle">session store</text>
<text x="476" y="494" font-size="10.5" class="m mono" text-anchor="middle">~/.horon/sessions</text>
<text x="476" y="512" font-size="10.5" class="m mono" text-anchor="middle">events.jsonl</text>
<rect x="561" y="452" width="145" height="76" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="633" y="474" font-size="13" font-weight="600" text-anchor="middle">MCP servers</text>
<text x="633" y="494" font-size="11" class="m" text-anchor="middle">shared pool</text>
<text x="633" y="512" font-size="11" class="m" text-anchor="middle">across sessions</text>

<line x1="722" y1="206" x2="748" y2="206" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="750" y="140" width="180" height="170" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="840" y="164" font-size="14" font-weight="600" text-anchor="middle">model endpoint</text>
<text x="840" y="188" font-size="10.5" class="m mono" text-anchor="middle">/chat/completions</text>
<text x="840" y="206" font-size="10.5" class="m mono" text-anchor="middle">/responses</text>
<text x="840" y="224" font-size="10.5" class="m mono" text-anchor="middle">/messages</text>
<text x="840" y="242" font-size="10.5" class="m mono" text-anchor="middle">/models/{model}</text>
<text x="840" y="260" font-size="10.5" class="m mono" text-anchor="middle">:streamGenerateContent</text>
<text x="840" y="278" font-size="10.5" class="m mono" text-anchor="middle">?alt=sse</text>
<text x="840" y="298" font-size="10.5" class="m" text-anchor="middle">images: /images/*</text>
<text x="840" y="328" font-size="11" class="m" text-anchor="middle">one of four wires,</text>
<text x="840" y="344" font-size="11" class="m" text-anchor="middle">chosen by the type</text>
<text x="840" y="372" font-size="11" class="m" text-anchor="middle">direct POST, no router,</text>
<text x="840" y="388" font-size="11" class="m" text-anchor="middle">no plugin host</text>

<text x="480" y="580" font-size="12" class="m" text-anchor="middle">Every client reaches the same daemon; only the driver changes.</text>
</svg>
