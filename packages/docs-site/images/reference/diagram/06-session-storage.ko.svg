<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t d">
<title id="t">세션 저장소: 원본, 파생 캐시, 유휴 해제</title><desc id="d">$HORON_HOME/sessions 아래 각 세션 디렉터리는 두 부류의 파일을 가진다. 원본은 sync_file과 sync_dir로 확정한다. 추가 전용 이벤트 로그 events.jsonl, 자기 해시를 이름으로 쓰는 blobs, 이벤트 로그로 재현할 수 없는 로컬 상태 파일 네 개, 그리고 내구 실행 상태 저널 runtime.jsonl이 원본이다. [storage] sync는 플러시 강도를 고른다. 기본값 full은 macOS에서 F_FULLFSYNC, Linux에서 fdatasync, Windows에서 FlushFileBuffers를 쓰고, fast는 macOS에서 일반 fsync(2)를 쓰며 나머지 플랫폼에는 더 싼 호출이 없어 full과 같다. 파생 캐시는 임시 파일에 쓴 뒤 이름만 바꾸고 플러시하지 않으므로, 크래시 비용은 재생성뿐이다. 대상은 checkpoint.json, sparse-index.jsonl, summary.json, facade-cache.json, 카탈로그 행이다. 파생 파일마다 원본 로그의 Stamp(device, inode, length, mtime, ctime)와 자기 sha256을 저장하므로, 값이 어긋나면 버리고 writer 락 안에서 다시 만든다. .catalog.dirty 표지는 재생성이 필요하다는 힌트일 뿐이고 플러시하지 않는다. 낡은 캐시를 내보내지 않게 막는 것은 Stamp 비교다. 유휴 세션은 [server] idle_hibernation_secs(기본 1800)가 지나면 파생 캐시를 놓아 주고 원본과 활성 문맥은 남긴다. 다음 턴은 디스크를 읽지 않고 메모리에서 두 캐시를 다시 만든다. 해제 시점이 최대 한 틱 늦는다는 서술은 10초 주기 스윕에서 추론했다.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--a:#0b6bcb;--b:#c2410c;--ok:#1a7f37}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--a:#58a6ff;--b:#ffa657;--ok:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect width="960" height="700" rx="14" fill="var(--bg)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>

<text x="30" y="32" font-size="13" class="m">$HORON_HOME/sessions/&lt;id&gt;/ — 원본은 플러시하고 파생 캐시는 다시 만든다</text>

<rect x="30" y="48" width="290" height="320" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="46" y="72" font-size="13" font-weight="600">원본</text>
<text x="46" y="90" font-size="11" class="m">sync_file + sync_dir, 전원 손실을 견딘다</text>
<rect x="44" y="100" width="262" height="40" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="58" y="117" font-size="12" class="mono">events.jsonl</text>
<text x="58" y="132" font-size="10.5" class="m">추가 전용 정본 로그</text>
<rect x="44" y="148" width="262" height="40" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="58" y="165" font-size="12" class="mono">blobs/&lt;sha256&gt;.json</text>
<text x="58" y="180" font-size="10.5" class="m">외부화한 페이로드, blob마다 플러시</text>
<rect x="44" y="196" width="262" height="96" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="58" y="213" font-size="12" class="mono">local-head.json</text>
<text x="58" y="229" font-size="12" class="mono">local-head-explicit.json</text>
<text x="58" y="245" font-size="12" class="mono">local-explicit-source.json</text>
<text x="58" y="261" font-size="12" class="mono">local-runtime.json</text>
<text x="58" y="280" font-size="10.5" class="m">이벤트 로그로 재현할 수 없는 상태</text>
<rect x="44" y="300" width="262" height="52" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="58" y="317" font-size="12" class="mono">runtime.jsonl</text>
<text x="58" y="332" font-size="10.5" class="m">내구 실행 상태 저널, 전이마다 seq,</text>
<text x="58" y="345" font-size="10.5" class="m">동기화가 끝난 뒤에만 상태를 알린다</text>

<rect x="344" y="48" width="286" height="320" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="360" y="72" font-size="13" font-weight="600">[storage] sync</text>
<text x="360" y="90" font-size="11" class="m">원본을 어떤 호출로 확정하는가</text>
<rect x="358" y="100" width="258" height="130" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="372" y="118" font-size="12" class="mono">full (기본값)</text>
<text x="372" y="136" font-size="10.5" class="m">macOS F_FULLFSYNC, 드라이브 캐시까지</text>
<text x="372" y="152" font-size="10.5" class="m">Linux fdatasync</text>
<text x="372" y="168" font-size="10.5" class="m">Windows FlushFileBuffers</text>
<text x="372" y="190" font-size="10.5" class="m">맥 기본값은 full로 둔다</text>
<text x="372" y="214" font-size="10.5" class="m">HORON_AGENT_STORAGE_SYNC가</text>
<text x="372" y="228" font-size="10.5" class="m">프로세스 하나에서 덮어쓴다</text>
<rect x="358" y="238" width="258" height="114" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="372" y="256" font-size="12" class="mono">fast</text>
<text x="372" y="274" font-size="10.5" class="m">macOS fsync(2), OS 크래시를 견딘다</text>
<text x="372" y="290" font-size="10.5" class="m">Linux와 Windows에는 더 싼 호출이</text>
<text x="372" y="306" font-size="10.5" class="m">없어 fast가 full과 같다</text>
<text x="372" y="328" font-size="10.5" class="m">모르는 값은 프로세스마다 경고 한 번과</text>
<text x="372" y="342" font-size="10.5" class="m">함께 full로 돌아간다</text>

<rect x="654" y="48" width="276" height="320" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="670" y="72" font-size="13" font-weight="600">파생 캐시</text>
<text x="670" y="90" font-size="11" class="m">임시 파일에 쓰고 이름만 바꾼다, 플러시 없음</text>
<rect x="668" y="100" width="248" height="112" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="682" y="117" font-size="12" class="mono">checkpoint.json</text>
<text x="682" y="135" font-size="12" class="mono">sparse-index.jsonl</text>
<text x="682" y="153" font-size="12" class="mono">summary.json</text>
<text x="682" y="171" font-size="12" class="mono">facade-cache.json</text>
<text x="682" y="189" font-size="12" class="mono">.catalog.index.jsonl</text>
<text x="682" y="205" font-size="10.5" class="m">세션마다 카탈로그 행 하나</text>
<rect x="668" y="220" width="248" height="70" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="682" y="237" font-size="12" class="mono">.catalog.dirty/&lt;id&gt;</text>
<text x="682" y="254" font-size="10.5" class="m">빈 파일, 존재만 본다. 재생성이 필요하다는</text>
<text x="682" y="268" font-size="10.5" class="m">힌트이며 원본보다 먼저 만들고</text>
<text x="682" y="282" font-size="10.5" class="m">일부러 플러시하지 않는다</text>
<rect x="668" y="298" width="248" height="54" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="682" y="315" font-size="11" font-weight="600">신뢰 조건: Stamp + sha256</text>
<text x="682" y="330" font-size="10.5" class="m">device, inode, length, mtime, ctime</text>
<text x="682" y="344" font-size="10.5" class="m">어긋나면 버리고 락 안에서 재생성</text>

<rect x="30" y="392" width="900" height="288" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="46" y="416" font-size="13" font-weight="600">유휴 하이버네이션은 다시 만들 수 있는 것만 놓아 준다</text>
<text x="46" y="434" font-size="11" class="m">[server] idle_hibernation_secs 기본값 1800. 데몬 스윕이 10초마다 임계값을 다시 읽고, 0이면 스윕을 끈다</text>

<rect x="46" y="446" width="276" height="216" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="60" y="466" font-size="12" font-weight="600">놓아 주는 것</text>
<text x="60" y="486" font-size="11" class="mono">provider projection</text>
<text x="60" y="501" font-size="10.5" class="m">provider_messages_cache, prefix hash</text>
<text x="60" y="515" font-size="10.5" class="m">캐시, 길이, 프로파일 카운터를 비우고</text>
<text x="60" y="529" font-size="10.5" class="m">모드를 Full로 되돌린다. 다음 턴이 빈</text>
<text x="60" y="543" font-size="10.5" class="m">기록을 보내지 않고 다시 만든다</text>
<text x="60" y="567" font-size="11" class="mono">tool output index</text>
<text x="60" y="582" font-size="10.5" class="m">tool_call_ids와 tool_result_ids를 비우지</text>
<text x="60" y="596" font-size="10.5" class="m">않고 새로 만들어 할당까지 돌려주고,</text>
<text x="60" y="610" font-size="10.5" class="m">스캔 인덱스를 0으로 되돌린다</text>
<text x="60" y="634" font-size="10.5" class="m">이 경로는 저장도 체크포인트도 하지 않아</text>
<text x="60" y="648" font-size="10.5" class="m">리스가 건너뛴 저장을 가릴 수 없다</text>

<rect x="342" y="446" width="276" height="216" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="356" y="466" font-size="12" font-weight="600">남기는 것</text>
<text x="356" y="486" font-size="10.5" class="m">events.jsonl과 blobs/, 상주 활성 문맥,</text>
<text x="356" y="500" font-size="10.5" class="m">고정된 시스템 프롬프트와 잠긴 도구</text>
<text x="356" y="514" font-size="10.5" class="m">표면을 남기므로 다음 턴이 도구 목록을</text>
<text x="356" y="528" font-size="10.5" class="m">다시 협상하지 않는다</text>
<text x="356" y="552" font-size="10.5" class="m">pruned_tool_results, stream_rule_</text>
<text x="356" y="566" font-size="10.5" class="m">ledger, 원래 보조 상태, rewind 되돌리기</text>
<text x="356" y="580" font-size="10.5" class="m">상태, provider 핸들, 대기 알림,</text>
<text x="356" y="594" font-size="10.5" class="m">resume 상태</text>
<text x="356" y="620" font-size="10.5" class="m">깨어날 때 디스크를 읽지 않는다. 그 턴이</text>
<text x="356" y="634" font-size="10.5" class="m">두 캐시를 메모리에서 다시 만든다</text>
<text x="356" y="652" font-size="10.5" class="m"> </text>

<rect x="638" y="446" width="276" height="216" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="652" y="466" font-size="12" font-weight="600">조건, 모두 만족해야 한다</text>
<text x="652" y="486" font-size="10.5" class="m">세션 로스터 상태가 running이 아니고</text>
<text x="652" y="500" font-size="10.5" class="m">진행 중인 턴이 없다</text>
<text x="652" y="518" font-size="10.5" class="m">마이그레이션 리스가 없고 대기 알림과</text>
<text x="652" y="532" font-size="10.5" class="m">resume이 비었으며 소프트 인터럽트 큐가 0</text>
<text x="652" y="550" font-size="10.5" class="m">압축이 돌지 않고 실행 중인 도구가 없다</text>
<text x="652" y="568" font-size="10.5" class="m">마지막 활동과 마지막 상태 변경이 모두</text>
<text x="652" y="582" font-size="10.5" class="m">임계값을 지났다</text>
<text x="652" y="600" font-size="10.5" class="m">락을 잡지 못하면 기다리지 않고 틱을</text>
<text x="652" y="614" font-size="10.5" class="m">건너뛰므로 스윕이 턴 앞에 끼어들지 않는다</text>
<text x="652" y="636" font-size="10.5" class="m">해제 뒤 로그 한 줄이 무엇을 놓았는지 적는다</text>
</svg>
