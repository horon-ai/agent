<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
<title id="t">horon-agent 실행 방식</title><desc id="d">서브커맨드 없이 터미널에서 horon을 실행하면 먼저 데몬이 살아 있는지 확인하고, 그다음 대화형 클라이언트와 헤드리스 경로 중 하나를 고른다. stdin과 stdout이 모두 터미널이고, HORON_NO_TUI가 설정돼 있지 않고, 실행 중인 바이너리 옆에 horon-tui 파일이 있어야만 프로세스가 horon-tui로 자신을 대체하며 --cwd와 --session을 넘긴다. 조건이 하나라도 어긋나면 헤드리스 경로로 남아 이유와 설치 안내를 출력한다. serve, run, api-bridge, acp, rpc 서브커맨드는 이 판정을 건너뛰는 헤드리스 진입점이고, 서브커맨드 없이 준 --mode rpc는 rpc 서브커맨드로 승격된다.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--a:#0b6bcb;--b:#c2410c;--ok:#1a7f37}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--a:#58a6ff;--b:#ffa657;--ok:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect width="960" height="580" rx="14" fill="var(--bg)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>

<rect x="30" y="44" width="480" height="480" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="44" y="66" font-size="12.5" class="m">서브커맨드 없는 실행</text>

<rect x="44" y="78" width="452" height="42" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="270" y="96" font-size="13.5" font-weight="600" text-anchor="middle">horon</text>
<text x="270" y="112" font-size="11" class="m mono" text-anchor="middle">hrn, horon-agent도 같음</text>
<line x1="270" y1="120" x2="270" y2="132" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="44" y="132" width="452" height="56" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="270" y="153" font-size="12" text-anchor="middle">살아 있는 데몬이 없으면 낡은 소켓을 치우고 `serve`를 띄워</text>
<text x="270" y="171" font-size="12" text-anchor="middle">소켓을 기다린 뒤 그 클라이언트로 이어서 진행한다</text>
<line x1="270" y1="188" x2="270" y2="200" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>

<text x="44" y="216" font-size="11" class="m mono">tui_handoff::decide_for_process()</text>

<rect x="44" y="224" width="176" height="48" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/>
<text x="132" y="244" font-size="12" text-anchor="middle">stdin과 stdout이</text>
<text x="132" y="261" font-size="12" text-anchor="middle">모두 터미널인가</text>
<line x1="220" y1="248" x2="282" y2="248" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="251" y="240" font-size="10" class="m" text-anchor="middle">아니오</text>
<rect x="286" y="224" width="210" height="48" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="391" y="244" font-size="12" text-anchor="middle">헤드리스 경로, 이유:</text>
<text x="391" y="261" font-size="11" class="m mono" text-anchor="middle">not both terminals</text>

<line x1="132" y1="272" x2="132" y2="288" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="140" y="285" font-size="10" class="m">예</text>

<rect x="44" y="288" width="176" height="48" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/>
<text x="132" y="308" font-size="12" text-anchor="middle">HORON_NO_TUI가</text>
<text x="132" y="325" font-size="12" text-anchor="middle">없는가</text>
<line x1="220" y1="312" x2="282" y2="312" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="251" y="304" font-size="10" class="m" text-anchor="middle">설정됨</text>
<rect x="286" y="288" width="210" height="48" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="391" y="308" font-size="12" text-anchor="middle">헤드리스 경로, 이유:</text>
<text x="391" y="325" font-size="11" class="m mono" text-anchor="middle">HORON_NO_TUI is set</text>

<line x1="132" y1="336" x2="132" y2="352" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="140" y="349" font-size="10" class="m">예</text>

<rect x="44" y="352" width="176" height="48" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/>
<text x="132" y="372" font-size="12" text-anchor="middle">바이너리 옆에 horon-tui</text>
<text x="132" y="389" font-size="12" text-anchor="middle">파일이 있는가</text>
<line x1="220" y1="376" x2="282" y2="376" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="251" y="368" font-size="10" class="m" text-anchor="middle">없음</text>
<rect x="286" y="352" width="210" height="48" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="391" y="372" font-size="12" text-anchor="middle">헤드리스 경로, 이유:</text>
<text x="391" y="389" font-size="11" class="m mono" text-anchor="middle">no horon-tui beside binary</text>

<line x1="132" y1="400" x2="132" y2="416" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="140" y="413" font-size="10" class="m">예</text>

<rect x="44" y="416" width="452" height="50" rx="8" fill="var(--bg)" stroke="var(--ok)" stroke-width="1.5"/>
<text x="270" y="437" font-size="12.5" font-weight="600" text-anchor="middle">horon-tui로 exec 대체</text>
<text x="270" y="455" font-size="11" class="m mono" text-anchor="middle">--cwd &lt;dir&gt;  [--session &lt;id&gt;]</text>

<text x="44" y="490" font-size="11" class="m">헤드리스 경로는 모두 이유와 설치 안내를 출력하고</text>
<text x="44" y="505" font-size="11" class="m mono">horon-agent install-release</text>
<text x="44" y="520" font-size="11" class="m">0이 아닌 코드로 끝난다. 먼저 띄운 데몬은 계속 살아 있다.</text>

<rect x="530" y="44" width="400" height="480" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="544" y="66" font-size="12.5" class="m">판정을 건너뛰는 헤드리스 진입점</text>

<rect x="544" y="78" width="372" height="74" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="556" y="99" font-size="13" font-weight="600" class="mono">serve</text>
<text x="556" y="118" font-size="11.5" class="m">공유 소켓 위의 배경 데몬, 여러 세션</text>
<text x="556" y="136" font-size="11.5" class="m">클라이언트 없이 300초가 지나면 종료</text>

<rect x="544" y="164" width="372" height="74" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="556" y="185" font-size="13" font-weight="600" class="mono">run &lt;message&gt;</text>
<text x="556" y="204" font-size="11.5" class="m">메시지 하나를 프로세스 안에서 처리, 데몬 없음;</text>
<text x="556" y="221" font-size="11.5" class="m">서버가 필요한 도구만 데몬을 띄운다</text>

<rect x="544" y="250" width="372" height="74" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="556" y="271" font-size="13" font-weight="600" class="mono">api-bridge  (별칭 api)</text>
<text x="556" y="290" font-size="11.5" class="m">SDK가 붙는 harness API 소켓, Unix에서만</text>
<text x="556" y="308" font-size="11.5" class="m mono">--api-socket &lt;path&gt;   --stdio</text>

<rect x="544" y="336" width="372" height="74" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="556" y="357" font-size="13" font-weight="600" class="mono">acp</text>
<text x="556" y="376" font-size="11.5" class="m">편집기용 Agent Client Protocol 어댑터, stdio</text>
<text x="556" y="394" font-size="11.5" class="m">같은 데몬이 뒤를 받친다</text>

<rect x="544" y="422" width="372" height="74" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
<text x="556" y="443" font-size="13" font-weight="600" class="mono">rpc   |   --mode rpc</text>
<text x="556" y="462" font-size="11.5" class="m">stdio JSONL RPC 어댑터. 서브커맨드 없이 준</text>
<text x="556" y="480" font-size="11.5" class="m">--mode rpc는 이 서브커맨드가 된다</text>

<text x="480" y="552" font-size="12" class="m" text-anchor="middle">터미널 앞의 사람에게는 horon-tui, 프로그램에게는 다섯 헤드리스 진입점 중 하나.</text>
</svg>
