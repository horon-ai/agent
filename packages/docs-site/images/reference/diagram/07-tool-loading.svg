<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 930" width="960" height="930" role="img" aria-labelledby="t d">
<title id="t">Tool loading by profile</title><desc id="d">A session resolves one load tier per tool at start and never changes it mid-session. The untouched default core profile is a listing session that reaches every built-in tool: its allow-list is CORE_TOOLS plus CORE_DISCOVERABLE_TOOLS plus toolbox, with irc, checkpoint and rewind joining through their switches. It sends eleven tools eagerly (read, write, edit, apply_patch, bash, ls, agentgrep, todo, bg, websearch, webfetch) together with toolbox, and eval as well when a Python interpreter is on PATH; every other reachable tool becomes discoverable and is named in an Additional tools section of the system prompt. The full profile without an allow-list makes every non-essential tool discoverable instead, and optional tools sit behind toolbox. acp, minimal, none, an explicit enabled list and an unset profile keep every allowed tool eager and have no index: acp allows twelve tools, minimal allows eight, none allows none. An explicit [tools.load_mode] entry outranks the profile, except that toolbox itself can never be deferred, and an off entry removes the tool. toolbox = "off" or a disabled entry turns listing mode off and puts every reachable tool back on the eager surface. A switch set to false removes its tool. The listed tool names come from CORE_TOOLS, CORE_DISCOVERABLE_TOOLS and ESSENTIAL_TOOLS in crates/base/src/config.rs. Which tier an operator's own profile ends up in when several switches disagree is inferred from ToolLoadTiers::tier.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--a:#0b6bcb;--b:#c2410c;--ok:#1a7f37}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--a:#58a6ff;--b:#ffa657;--ok:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect width="960" height="930" rx="14" fill="var(--bg)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>

<text x="30" y="32" font-size="13" class="m">1. What a profile allows, and what it sends eagerly</text>

<rect x="30" y="48" width="176" height="196" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="46" y="72" font-size="12.5" class="mono" font-weight="600">core (default)</text>
<text x="46" y="94" font-size="11.5">allow: every built-in</text>
<text x="46" y="112" font-size="11.5">eager: 11 + toolbox</text>
<text x="46" y="134" font-size="11" class="m">listing session</text>
<text x="46" y="150" font-size="11" class="m">the rest indexed</text>
<text x="46" y="172" font-size="11" class="m">two wire forms:</text>
<text x="46" y="188" font-size="11" class="m">toolbox list / describe /</text>
<text x="46" y="204" font-size="11" class="m">run</text>
<text x="46" y="228" font-size="10.5" class="m">8 eager schemas = 9,151 bytes</text>

<rect x="222" y="48" width="176" height="196" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="238" y="72" font-size="12.5" class="mono" font-weight="600">full</text>
<text x="238" y="94" font-size="11.5">allow: everything</text>
<text x="238" y="112" font-size="11.5">eager: essential set</text>
<text x="238" y="134" font-size="11" class="m">no allow-list: every</text>
<text x="238" y="150" font-size="11" class="m">other tool deferred</text>
<text x="238" y="172" font-size="11" class="m">behind toolbox, and</text>
<text x="238" y="188" font-size="11" class="m">the 11 + toolbox stay</text>
<text x="238" y="204" font-size="11" class="m">eager</text>
<text x="238" y="220" font-size="10.5" class="m">irc joins a full session</text>
<text x="238" y="235" font-size="10.5" class="m">eval requires explicit opt-in</text>

<rect x="414" y="48" width="176" height="196" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="430" y="72" font-size="12.5" class="mono" font-weight="600">acp</text>
<text x="430" y="94" font-size="11.5">allow: 12</text>
<text x="430" y="112" font-size="11.5">eager: all 12</text>
<text x="430" y="134" font-size="11" class="m">bash, read, write, edit,</text>
<text x="430" y="150" font-size="11" class="m">replace, apply_patch,</text>
<text x="430" y="166" font-size="11" class="m">agentgrep, ls, batch,</text>
<text x="430" y="182" font-size="11" class="m">mcp, ask, todo</text>
<text x="430" y="204" font-size="11" class="m">no toolbox, no index</text>
<text x="430" y="228" font-size="10.5" class="m">the editor answers ask</text>

<rect x="606" y="48" width="160" height="196" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="622" y="72" font-size="12.5" class="mono" font-weight="600">minimal / lite</text>
<text x="622" y="94" font-size="11.5">allow: 8</text>
<text x="622" y="112" font-size="11.5">eager: all 8</text>
<text x="622" y="134" font-size="11" class="m">bash, read, write,</text>
<text x="622" y="150" font-size="11" class="m">edit, replace,</text>
<text x="622" y="166" font-size="11" class="m">apply_patch,</text>
<text x="622" y="182" font-size="11" class="m">agentgrep, ls</text>
<text x="622" y="204" font-size="11" class="m">no index</text>

<rect x="782" y="48" width="148" height="196" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="798" y="72" font-size="12.5" class="mono" font-weight="600">none</text>
<text x="798" y="94" font-size="11.5">allow: ∅</text>
<text x="798" y="112" font-size="11.5">eager: ∅</text>
<text x="798" y="134" font-size="11" class="m">stays empty even</text>
<text x="798" y="150" font-size="11" class="m">with irc on</text>
<text x="798" y="172" font-size="11" class="m">also reached by</text>
<text x="798" y="188" font-size="11" class="m">disable_base_tools</text>

<rect x="30" y="254" width="900" height="120" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="46" y="276" font-size="12.5" font-weight="600">A session becomes a listing session only when all three hold</text>
<text x="46" y="298" font-size="11.5" class="m">· the profile is the untouched default core</text>
<text x="46" y="316" font-size="11.5" class="m">· no allow-list is given explicitly (no enabled list, no SDK enabled list, no new_with_session allow-list)</text>
<text x="46" y="334" font-size="11.5" class="m">· toolbox is reachable: not off through [tools.load_mode] and not in [tools] disabled</text>
<text x="46" y="356" font-size="11.5" class="m">Every other case sends every allowed tool eagerly and has no index. An SDK enabled list on a core session turns listing mode off.</text>

<text x="30" y="404" font-size="13" class="m">2. Inside one listing core session</text>

<rect x="30" y="420" width="286" height="212" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="46" y="442" font-size="12.5" font-weight="600">eager schemas (12, 13 with eval)</text>
<text x="46" y="462" font-size="11" class="m">the schemas travel in the cached prefix</text>
<rect x="44" y="472" width="258" height="30" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="58" y="491" font-size="11" class="mono">read write edit apply_patch bash</text>
<rect x="44" y="508" width="258" height="30" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="58" y="527" font-size="11" class="mono">ls agentgrep todo bg websearch</text>
<text x="46" y="558" font-size="10.5" class="m">plus webfetch and toolbox; eval joins when</text>
<text x="46" y="572" font-size="10.5" class="m">Python is on PATH; toolbox is pinned so the</text>
<text x="46" y="586" font-size="10.5" class="m">window onto the rest is never itself deferred</text>
<text x="46" y="606" font-size="10.5" class="m">mcp_search and mcp_call are eager whenever the</text>
<text x="46" y="620" font-size="10.5" class="m">session has an MCP server; with none they are indexed</text>

<rect x="330" y="420" width="300" height="200" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="346" y="442" font-size="12.5" font-weight="600">named in the prompt (the rest)</text>
<text x="346" y="462" font-size="11" class="m">one row each, first sentence, 60 characters</text>
<rect x="344" y="472" width="272" height="88" rx="7" fill="var(--bg)" stroke="var(--line)"/>
<text x="358" y="489" font-size="11" class="mono">replace skill_manage mcp monitor</text>
<text x="358" y="505" font-size="11" class="mono">undo ask session_search swarm</text>
<text x="358" y="521" font-size="11" class="mono">batch memory goal lsp redo ...</text>
<text x="358" y="543" font-size="10.5" class="m">a # Additional tools section follows one</text>
<text x="358" y="556" font-size="10.5" class="m">guidance sentence about toolbox run</text>
<text x="346" y="580" font-size="10.5" class="m">rows are filtered like toolbox list: no mcp__*</text>
<text x="346" y="594" font-size="10.5" class="m">proxies, no toolbox itself, nothing the session</text>
<text x="346" y="608" font-size="10.5" class="m">cannot reach</text>

<rect x="644" y="420" width="286" height="200" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="660" y="442" font-size="12.5" font-weight="600">how the model reaches them</text>
<text x="660" y="466" font-size="11" class="mono">toolbox list</text>
<text x="660" y="482" font-size="10.5" class="m">names and one-line descriptions, name order</text>
<text x="660" y="506" font-size="11" class="mono">toolbox describe</text>
<text x="660" y="522" font-size="10.5" class="m">description and input schema as text</text>
<text x="660" y="546" font-size="11" class="mono">toolbox run</text>
<text x="660" y="562" font-size="10.5" class="m">Registry::execute for the target tool, so plan</text>
<text x="660" y="576" font-size="10.5" class="m">mode, approval and hooks apply to the target</text>
<text x="660" y="600" font-size="10.5" class="m">no promote action: promoting would change the</text>
<text x="660" y="614" font-size="10.5" class="m">tool list mid-session and cost the prompt cache</text>

<text x="30" y="652" font-size="13" class="m">3. Overrides, and the switch that turns listing off</text>

<rect x="30" y="668" width="440" height="92" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="46" y="690" font-size="12" class="mono" font-weight="600">[tools.load_mode]</text>
<text x="46" y="710" font-size="11" class="m">ask = "essential" ships that schema even in a listing session;</text>
<text x="46" y="726" font-size="11" class="m">an explicit entry outranks the profile</text>
<text x="46" y="742" font-size="11" class="m">toolbox = "discoverable" becomes essential again; "off" removes it</text>

<rect x="490" y="668" width="440" height="92" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="506" y="690" font-size="12" font-weight="600">listing off, and the irc switch</text>
<text x="506" y="710" font-size="11" class="m">toolbox removed: every reachable tool comes back eager</text>
<text x="506" y="726" font-size="11" class="m">[tools] irc = true by default; false removes it from the lists</text>
<text x="506" y="742" font-size="11" class="m">tiers are resolved once at start; a reload never moves a tool</text>

<text x="30" y="800" font-size="13" class="m">4. Tools a package declares</text>

<rect x="30" y="816" width="440" height="96" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="46" y="838" font-size="12" class="mono" font-weight="600">ext__&lt;package id&gt;__&lt;name&gt;</text>
<text x="46" y="858" font-size="11" class="m">declared in extension.toml; read from the turn's generation</text>
<text x="46" y="874" font-size="11" class="m">core lists it behind toolbox, full defers it</text>
<text x="46" y="890" font-size="11" class="m">minimal, none, acp never expose it; an existing name wins</text>

<rect x="490" y="816" width="440" height="96" rx="10" fill="var(--panel)" stroke="var(--line)"/>
<text x="506" y="838" font-size="12" font-weight="600">the ordinary Registry::execute path</text>
<text x="506" y="858" font-size="11" class="m">plan mode, approval, hooks and secret checks run first</text>
<text x="506" y="874" font-size="11" class="m">the child starts only after approval, from the pinned copy</text>
<text x="506" y="890" font-size="11" class="m">disable or remove cancels the call and reaps the child</text>
</svg>
