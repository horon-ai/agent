<rect x="275.6" y="102.0" width="123.9" height="18" rx="3" fill="#0b84de"/>
<text x="661.9" y="115.0" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">872.4 → 290.4 ms (jcode 294.8 ms)</text>
<text x="263.6" y="145.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="normal">원샷 중앙값, Linux (Docker)</text>
<rect x="275.6" y="132.0" width="372.3" height="18" rx="3" fill="#d3d9e1"/>
<rect x="275.6" y="132.0" width="300.8" height="18" rx="3" fill="#0b84de"/>
<text x="661.9" y="145.0" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">207.9 → 168.0 ms (jcode 146.3 ms)</text>
<text x="263.6" y="175.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="normal">시작→첫 요청, macOS</text>
<rect x="275.6" y="162.0" width="372.3" height="18" rx="3" fill="#d3d9e1"/>
<rect x="275.6" y="162.0" width="123.9" height="18" rx="3" fill="#0b84de"/>
<text x="661.9" y="175.0" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">236.4 → 78.7 ms</text>
<text x="263.6" y="205.0" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="normal">시작→첫 요청, Linux (Docker)</text>
<rect x="275.6" y="192.0" width="372.3" height="18" rx="3" fill="#d3d9e1"/>
