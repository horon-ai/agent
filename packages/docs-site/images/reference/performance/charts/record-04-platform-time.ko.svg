<text x="46.0" y="42.0" font-size="21" fill="#1f2328" text-anchor="start" font-weight="bold">macOS·Linux 시작 경로: 이전과 이후</text>
<text x="32.0" y="72.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">같은 기계에서 번갈아 잰 release 프로필. jcode 원샷은 규모 비교용입니다.</text>
